<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>landfall</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%232563eb'/><path d='M4 5h8M4 8h8M4 11h5' stroke='white' stroke-width='1.6' stroke-linecap='round'/></svg>">
<style>
:root {
  /* Three text sizes and three corner radii; headings set their own. */
  --fs-xs: 11.5px; --fs-sm: 12.5px; --fs: 13px;
  --r-sm: 7px; --r: 10px; --r-lg: 14px;
  --bg: #fafafa; --panel: #fff; --hover: #f4f4f5; --line: #ececee; --line-strong: #d4d4d8; --text: #18181b; --dim: #5d5d66; --faint: #71717a;
  --accent: #4f46e5; --accent-bg: #eef0fe; --accent-solid: #4f46e5; --bad-solid: #dc2626; --ok: #15803d; --ok-bg: #eaf7ee; --warn: #b45309; --warn-bg: #fdf4e3;
  --bad: #c42323; --bad-bg: #fcecec; --term: #0f0f12; --term-text: #dcdce1;
  --shadow: 0 1px 2px rgb(0 0 0 / .04); --shadow-lg: 0 10px 30px -8px rgb(0 0 0 / .14), 0 2px 6px rgb(0 0 0 / .05);
  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e; --panel: #141417; --hover: #1c1c20; --line: #232328; --line-strong: #34343b; --text: #ececef; --dim: #a1a1aa; --faint: #8b8b94;
    --accent: #8b93ff; --accent-bg: #1d1d3a; --accent-solid: #5b54e8; --bad-solid: #d33a3a; --ok: #4ade80; --ok-bg: #122a1b; --warn: #f5b34a; --warn-bg: #2b2212;
    --bad: #ff7b7b; --bad-bg: #321819; --term: #08080a; --term-text: #dcdce1;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-lg: 0 16px 40px -8px rgb(0 0 0 / .6), 0 2px 6px rgb(0 0 0 / .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: var(--fs-sm); }
button {
  font: inherit; font-size: var(--fs); font-weight: 500; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text);
  padding: 5px 12px; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; box-shadow: var(--shadow);
  transition: background-color .12s, border-color .12s, color .12s, box-shadow .12s;
}
button:hover { background: var(--hover); }
button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent-solid); border-color: var(--accent-solid); color: #fff; }
button.primary:hover, button.danger.solid:hover { filter: brightness(1.1); }
button.danger { color: var(--bad); }
button.danger:hover { background: var(--bad-bg); }
button.danger.solid { background: var(--bad-solid); border-color: var(--bad-solid); color: #fff; }
button.ghost { border-color: transparent; background: transparent; color: var(--dim); box-shadow: none; }
button.ghost:hover { color: var(--text); background: var(--hover); }
button.sm { padding: 2px 9px; font-size: var(--fs-sm); }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 7px 10px; width: 100%;
  transition: border-color .12s, box-shadow .12s;
}
input.secret { -webkit-text-security: disc; text-security: disc; }
input:focus, select:focus, textarea:focus { outline: none; box-shadow: var(--ring); border-color: var(--accent); }
textarea { font-family: var(--mono); font-size: var(--fs-sm); min-height: 90px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr); height: 100vh; }
.app.with-job { grid-template-columns: 248px minmax(0, 1fr) clamp(360px, 32vw, 520px); }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 9px; letter-spacing: -.015em; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand svg { width: 24px; height: 24px; flex: none; }
.brand small { font-weight: 500; color: var(--faint); font-size: var(--fs-xs); letter-spacing: 0; padding: 1px 7px; border-radius: 99px; background: var(--hover); }
.project { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: var(--fs); min-width: 0; }
.project .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36vw; font-family: var(--mono); font-size: var(--fs-sm); }
nav.servers { border-right: 1px solid var(--line); background: var(--bg); overflow: auto; display: flex; flex-direction: column; }
.nav-top { position: sticky; top: 0; z-index: 1; background: var(--bg); display: flex; gap: 6px; padding: 14px 12px 8px; }
.nav-top input { padding: 6px 10px; font-size: var(--fs); }
.nav-top button { flex: none; padding-inline: 10px; }
#navlist { padding: 0 8px 16px; }
nav h3 { margin: 14px 10px 4px; font-size: var(--fs-xs); color: var(--faint); font-weight: 500; display: flex; justify-content: space-between; }
nav h3 span { font-weight: 500; }
.srv { display: grid; grid-template-columns: 8px minmax(0, 1fr); column-gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; box-shadow: none; padding: 7px 10px; border-radius: var(--r-sm); }
.srv > .dot { margin: 0; }
.srv .n, .srv .t { grid-column: 2; }
.srv.off:not(.on) .n { color: var(--dim); }
.srv .t .refused { color: var(--warn); }
.srv:hover { background: var(--hover); }
.srv.on { background: var(--panel); box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.srv.on .n { color: var(--text); }
.srv.on .t { color: var(--dim); }
.srv .n { font-weight: 550; display: flex; align-items: center; gap: 6px; }
.tile .n .dot { margin-right: 0; flex: none; }
nav h3 .grp { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
nav h3 .grp:hover { color: var(--dim); }
nav h3 .grp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
nav h3 .caret { width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
nav h3 .grp[aria-expanded="true"] .caret { transform: rotate(90deg); }
.nav-foot { position: sticky; bottom: 0; margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px 18px; border-top: 1px solid var(--line); background: var(--bg); font-size: var(--fs-sm); }
.nav-foot .what { flex: 1; min-width: 0; color: var(--dim); }
.nav-foot .counts { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--text); }
.nav-foot .counts .dot { margin-right: 5px; }
.nav-foot .when { color: var(--faint); font-size: var(--fs-xs); margin-top: 2px; }
.nav-foot .recheck { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.nav-foot .recheck .spin { width: 10px; height: 10px; }
.srv .t { color: var(--faint); font-size: var(--fs-sm); display: flex; min-width: 0; white-space: nowrap; }
.srv .t .h { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.srv .t .x { flex: none; white-space: pre; }
.nav-none { color: var(--faint); font-size: var(--fs-sm); padding: 6px 10px; }
.srv .t .live { color: var(--ok); }
/* The open server's sections, under it in the list. */
.sections { display: grid; gap: 1px; margin: 4px 0 10px 12px; padding-left: 8px; border-left: 1px solid var(--line-strong); }
.sections button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; box-shadow: none; padding: 5px 10px; color: var(--dim); font-weight: 450; }
.sections button:hover { background: var(--hover); color: var(--text); }
.sections button.on { background: var(--accent-bg); color: var(--accent); font-weight: 550; }
.sections .badge { margin-left: auto; }
.head h1 .crumb { font-weight: 400; color: var(--faint); }
.tunnel-url { font-family: var(--mono); font-size: var(--fs-sm); }
.tunnel-lan::before { content: "· LAN "; color: var(--faint); font-size: var(--fs-sm); }
.star { color: var(--warn); font-size: var(--fs-xs); }
main { overflow: auto; padding: 28px 32px 48px; min-width: 0; container-type: inline-size; }
.show-sm { display: none !important; }
/* By main's own width, so an open job panel squeezes the tables like a small screen does. */
@container (max-width: 720px) {
  td, th { padding: 9px 8px; }
  .hide-sm { display: none; }
  .show-sm { display: flex !important; }
}
.empty { color: var(--dim); text-align: center; padding: 72px 20px; }
.empty h2 { color: var(--text); font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 20px; margin-bottom: 22px; }
.head > div:first-child { flex: 1 1 320px; min-width: 0; }
.head h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.25; }
.head .sub { color: var(--dim); font-size: var(--fs); margin-top: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
/* Phones only: elsewhere the sections sit under the server in the list. */
.tabs { display: none; gap: 4px; padding: 4px; background: var(--hover); border-radius: var(--r); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; border-radius: var(--r-sm); background: none; box-shadow: none; padding: 6px 12px; color: var(--dim); flex: none; }
.tabs button:hover { color: var(--text); background: none; }
.tabs button.on { color: var(--text); background: var(--panel); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: clip; }
.card + .card { margin-top: 20px; }
.card > h2 { margin: 0; padding: 14px 18px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.card > h2 .actions { font-weight: 400; }
.card > h2 .sub { font-weight: 400; color: var(--dim); }
.card > .lede { padding: 10px 18px; color: var(--dim); font-size: var(--fs); border-bottom: 1px solid var(--line); }

/* "⋯" menus: one floating list at a time, placed by openMenu(). */
button.more { padding-inline: 8px; letter-spacing: .05em; }
.menu { position: fixed; z-index: 30; min-width: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 5px; display: grid; animation: pop .12s ease-out; }
.menu button { border: 0; background: none; box-shadow: none; font-weight: 450; text-align: left; padding: 6px 10px; border-radius: var(--r-sm); display: flex; justify-content: space-between; gap: 16px; }
.menu button:hover { background: var(--hover); }
.menu button:focus-visible { background: var(--accent-bg); box-shadow: none; }
.menu button.danger:hover { background: var(--bad-bg); }
.menu button .k { color: var(--faint); font-family: var(--mono); font-size: var(--fs-xs); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
@keyframes pop { from { opacity: 0; transform: translateY(-3px) scale(.98); } }

.home { max-width: 880px; margin: 0 auto; padding-top: 24px; }
.home h1 { margin: 0 0 6px; font-size: 28px; font-weight: 650; letter-spacing: -.025em; }
.home > p { color: var(--dim); margin: 0 0 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { display: block; text-align: left; padding: 16px 18px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); width: 100%; transition: border-color .12s, box-shadow .15s, transform .15s; }
.tile:hover { background: var(--panel); border-color: var(--line-strong); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.tile .n { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.tile .t { color: var(--faint); font-size: var(--fs-sm); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.add { border: 1.5px dashed var(--line-strong); background: none; box-shadow: none; color: var(--dim); display: grid; place-items: center; min-height: 68px; }
.tile.add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); transform: none; box-shadow: none; }
.home-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; color: var(--dim); font-size: var(--fs); margin: 0 0 20px; }
.home-sub .sep { width: 1px; height: 14px; background: var(--line-strong); }
.home-sub .spin { width: 10px; height: 10px; vertical-align: -1px; }
.home-note { font-size: var(--fs-sm); margin: 10px 0 0; }
.tile .w { font-size: var(--fs-xs); margin-top: 4px; color: var(--faint); }
.tile .w.login { color: var(--warn); } .tile .w.down { color: var(--bad); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin: 28px 0 20px; align-items: start; }
.cols > .card + .card { margin-top: 0; }
.meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.meter { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.meter .k { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-sm); color: var(--dim); }
.meter .k span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter .v { display: flex; align-items: flex-end; gap: 10px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0 6px; white-space: nowrap; }
.meter .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter .bar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.meter.warn .bar > i { background: var(--warn); } .meter.bad .bar > i { background: var(--bad); }
.meter .t { font-size: var(--fs-xs); color: var(--faint); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tchart { position: relative; }
.tchart svg { display: block; width: 100%; height: 120px; border-bottom: 1px solid var(--line); }
.tchart .tmax { position: absolute; top: -2px; left: 0; font-size: var(--fs-xs); }
.tticks { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: var(--fs-xs); margin-top: 4px; }
.tlegend { display: flex; gap: 14px; font-size: var(--fs-xs); color: var(--dim); margin-top: 8px; }
.tlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px 16px; margin-top: 20px; }
.cols .card + .card { margin-top: 0; }
.cols + .card { margin-top: 20px; }
.meter svg { flex: 1; min-width: 0; height: 26px; color: var(--accent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.recent li:last-child { border-bottom: 0; }
.recent li > div { flex: 1; min-width: 0; }
.recent li .mono { font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.where-cols > div { padding: 14px 18px 16px; }
.where-cols > div + div { border-left: 1px solid var(--line); }
@container (max-width: 720px) { .where-cols > div + div { border-left: 0; border-top: 1px solid var(--line); } }
.where-cols h3 { margin: 0 0 8px; font-size: var(--fs-xs); font-weight: 500; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
.paths { margin: 0; font-size: var(--fs-sm); }
.paths dt { overflow-wrap: anywhere; color: var(--text); margin-top: 8px; }
.paths dt:first-child { margin-top: 0; }
.paths dd { margin: 1px 0 0; color: var(--dim); }
.nav-home { margin: 6px 0 2px; grid-template-columns: 14px minmax(0, 1fr); column-gap: 4px; }
.nav-home .ico { width: 14px; height: 14px; color: var(--faint); }
.nav-home.on .ico { color: var(--accent); }
.cli { margin-top: 20px; padding: 16px 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--hover); font-size: var(--fs); color: var(--dim); }
.cli pre { margin: 10px 0 0; font: 12.5px/1.7 var(--mono); color: var(--text); white-space: pre-wrap; }
.cli pre span { color: var(--faint); }

.drow { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.drow:first-child { padding-top: 0; }
.drow:last-child { border-bottom: 0; padding-bottom: 0; }
.drow > div:first-child { flex: 1 1 260px; min-width: 0; }
.drow .actions { flex: none; }
.site-name { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
td .chips.show-sm { margin-top: 4px; }
.card .body { padding: 16px 18px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 500; font-size: var(--fs-sm); color: var(--faint); padding: 9px 14px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--hover) 55%, transparent); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
td.acts { text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
td.acts button { margin-left: 4px; }
.scroll { overflow-x: auto; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 7px; vertical-align: 1px; }
.dot.up { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); } .dot.down { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); } .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.badge { display: inline-block; font-size: var(--fs-xs); font-weight: 500; line-height: 1.6; padding: 0 8px; border-radius: 99px; background: var(--hover); color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.badge.accent { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.dim { color: var(--dim); } .faint { color: var(--faint); }
.note { padding: 11px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn); margin-bottom: 16px; border: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note.info { background: var(--accent-bg); color: var(--accent); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: var(--fs); margin: 0; }
.kv dt { color: var(--faint); } .kv dd { margin: 0; }
details.where summary { cursor: pointer; color: var(--faint); font-size: var(--fs-sm); }
details.where h3 { font-size: var(--fs-sm); margin: 12px 0 6px; }
details.where dl { margin: 0; font-size: var(--fs-sm); } details.where dt { overflow-wrap: anywhere; margin-top: 6px; } details.where dd { margin: 0; }
pre.block { background: var(--hover); border: 1px solid var(--line); padding: 10px 12px; border-radius: var(--r-sm); overflow-x: auto; font-size: var(--fs-sm); margin: 6px 0 0; }
.detail td { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.releases, .services { margin: 0; padding: 0; list-style: none; }
.services li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.releases li { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.run { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.run:last-child { border-bottom: 0; }
.run .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.run .cmd { font-family: var(--mono); font-weight: 600; font-size: var(--fs); }
.steps { list-style: none; margin: 8px 0 0; padding: 0 0 0 4px; }
.steps li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; font-size: var(--fs); }
.steps li .ico { width: 16px; text-align: center; flex: none; }
.steps li.undone, .steps li.fixed { color: var(--faint); }
.steps li.undone .what { text-decoration: line-through; }
.steps li button { opacity: 0; }
.steps li:hover button, .steps li:focus-within button { opacity: 1; }

.job-out .c-cyan { color: #67d3e8; } .job-out .c-green { color: #6ee7a0; } .job-out .c-yellow { color: #f5c76a; } .job-out .c-red { color: #ff8a8a; } .job-out .c-dim { color: #7b7b86; }

.list .row:last-child { border-bottom: 0; }

.drop label { display: inline; color: var(--accent); cursor: pointer; font-size: var(--fs); }
body.dragging::after {
  content: "Drop a folder or .zip to deploy it"; position: fixed; inset: 12px; z-index: 20; display: grid; place-items: center;
  border: 2px dashed var(--accent); border-radius: var(--r-lg); background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--accent); font-size: 18px; font-weight: 600; pointer-events: none;
}

@media (max-width: 1100px) {

}
@media (max-width: 760px) {

  nav.servers { display: none; }

  .tabs { display: flex; position: sticky; top: -14px; z-index: 2; }
  main { padding: 16px 16px 40px; }
  .home h1 { font-size: 24px; }
  .project .path { display: none; }

}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <a class="brand" href="#/"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="var(--accent)"/><path d="M4 5h8M4 8h8M4 11h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>landfall <small id="version"></small></a>
    <div class="project" id="project"></div>
  </header>
  <!-- The filter stays put across renders, so typing keeps its focus. -->
  <nav class="servers" id="nav">
    <div class="nav-top"><input id="filter" type="search" placeholder="Filter servers" autocomplete="off" spellcheck="false" aria-label="Filter servers"><button type="button" id="add-server" title="Register an ssh alias or set up a fresh machine">+</button></div>
    <div id="navlist"></div>
    <div class="nav-foot" id="navfoot" hidden></div>
  </nav>
  <div class="server-pick" id="pick"></div>
  <main id="main"></main>
  <aside class="job" id="job" aria-label="Command output" hidden></aside>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" popover="manual"></div>
<div class="sr" id="sr-live" role="status"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s)) return "";
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}

// ---- state ---------------------------------------------------------------

const S = {
  state: null,           // /api/state
  sel: null,             // selected server name
  tab: "sites",
  overview: {},          // name -> {data} | {error} | {loading}
  firewall: {},
  det: {},               // project folder -> what /api/fs detected there (null while reading, false if it failed)
  system: {},            // name -> {data: lf system --json}
  history: {},
  updates: {},
  facts: {},
  stats: {},             // name -> {data: lf stats --json}; reloads every few seconds while the tab is open
  statsLog: {},          // name -> [{cpu, mem}], the last samples, for the sparklines
  disk: {},              // name -> {data: lf disk --json}, only on request: du takes a while
  settings: {},          // name -> {data: lf server config --json + dns of the main domain}
  dns: {},               // name -> {data: {ips, domains: [{domain, ips, ok, https: lf check}]}}; checked again each minute
  traffic: {},           // name -> {data: lf traffic --json --since S.since}
  since: "24h",          // the Traffic tab's range
  errs: {},              // name -> {data: lf traffic --json --since 24h}, for the sites' errors card
  certs: {},             // name -> {data: lf certs --json}
  open: new Set(),       // expanded site rows
  filter: "",            // server list filter
  reach: {},             // name -> {state: ok|login|down, detail, ms} from /api/reach
  reaching: false,
  reachedAt: null,       // when the last check finished
  jobs: new Map(),       // id -> {info, lines, after, actions, es}
  job: null,             // shown job id
};

async function http(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 401) throw new Error("This browser is not logged in. Open the link `lf ui` printed.");
  const data = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` }));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// One live region in the top layer, so it shows (and is announced) above an open dialog too.
// action: {label, run} adds a button, e.g. to open the job a toast is about.
let toastTimer;
function toast(msg, action) {
  const t = $("#toast");
  t.textContent = msg;
  if (action) {
    const b = Object.assign(document.createElement("button"), { type: "button", className: "sm", textContent: action.label });
    b.onclick = () => (hideToast(), action.run());
    t.append(b);
  }
  t.hidePopover?.();
  t.showPopover?.();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, Math.max(4000, msg.length * 70) + (action ? 4000 : 0));
}
function hideToast() {
  $("#toast").hidePopover?.();
}
$("#toast").onmouseenter = () => clearTimeout(toastTimer);
$("#toast").onmouseleave = () => (toastTimer = setTimeout(hideToast, 2000));
/** Tell screen readers about a change that has no visible text of its own. */
function say(text) {
  const r = $("#sr-live");
  r.textContent = "";
  setTimeout(() => (r.textContent = text), 50);
}

// Buttons call functions registered per render: data-k="<id>".
let handlers = new Map();
let hid = 0;
function on(fn) {
  const k = String(++hid);
  handlers.set(k, fn);
  return `data-k="${k}"`;
}
/** f: a key that stays the same across renders, so the button keeps its keyboard focus when redrawn. */
function btn(label, fn, cls = "", title = "", f = "") {
  return `<button type="button" class="${cls}" ${on(fn)}${title ? ` title="${esc(title)}"` : ""}${f ? ` data-f="${esc(f)}"` : ""}>${label}</button>`;
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-k]");
  // A click outside an open menu only closes it.
  if (menuEl && !menuEl.contains(e.target)) {
    closeMenu(false);
    e.preventDefault();
    return void e.stopPropagation();
  }
  if (!el || el.disabled) return;
  const fn = handlers.get(el.dataset.k);
  if (fn) {
    e.preventDefault();
    e.stopPropagation();
    fn(e, el);
  }
});

/**
 * A "⋯" button for the less used actions. items: [{label, run, cls, title, hint}] or "-" for a divider;
 * falsy items are skipped. The menu keeps its own handlers, so a render while it is open leaves it working.
 */
function menuBtn(items, title = "More actions", cls = "sm") {
  items = items.filter(Boolean);
  if (!items.length) return "";
  return btn("⋯", (e, el) => openMenu(el, items), `${cls} more`, title).replace("<button", `<button aria-haspopup="menu" aria-expanded="false" aria-label="${esc(title)}"`);
}
let menuAnchor = null;
let menuEl = null;
function openMenu(anchor, items) {
  closeMenu(false);
  menuAnchor = anchor;
  anchor.setAttribute("aria-expanded", "true");
  const m = Object.assign(document.createElement("div"), { id: "menu", className: "menu" });
  m.setAttribute("role", "menu");
  m.innerHTML = items
    .map((it, i) => it === "-" ? `<hr role="separator">` : `<button type="button" role="menuitem" data-i="${i}" class="${it.cls ?? ""}"${it.title ? ` title="${esc(it.title)}"` : ""}><span>${esc(it.label)}</span>${it.hint ? `<span class="k">${esc(it.hint)}</span>` : ""}</button>`)
    .join("");
  m.onclick = (e) => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    closeMenu();
    items[b.dataset.i].run();
  };
  m.onkeydown = (e) => {
    const all = [...m.querySelectorAll("button")];
    const i = all.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      all[(i + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus();
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      all[e.key === "Home" ? 0 : all.length - 1].focus();
    }
  };
  // Keep focus where it is on mousedown: a browser that does not focus clicked buttons would blur the menu and close it before the click.
  m.onmousedown = (e) => e.preventDefault();
  m.addEventListener("focusout", (e) => {
    if (!m.contains(e.relatedTarget)) closeMenu(false);
  });
  document.body.append(m);
  menuEl = m;
  const r = anchor.getBoundingClientRect();
  m.style.left = `${Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8))}px`;
  m.style.top = `${r.bottom + 4 + m.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4}px`;
  $("button", m)?.focus({ preventScroll: true });
}
/** restore: focus goes back to the "⋯" button (Esc, or an item that opens no dialog). */
function closeMenu(restore = true) {
  const m = menuEl;
  if (!m) return;
  // Removing the focused item fires focusout, which calls closeMenu again: clear menuEl first so that call is a no-op.
  menuEl = null;
  m.remove();
  menuAnchor?.setAttribute("aria-expanded", "false");
  if (restore && menuAnchor?.isConnected) menuAnchor.focus({ preventScroll: true });
  menuAnchor = null;
}
addEventListener("resize", () => closeMenu(false));
document.addEventListener("scroll", (e) => e.target.closest?.("#menu") || closeMenu(false), true);

// ---- routing: #/<server>/<tab> ---------------------------------------------

function go(sel, tab = S.tab) {
  const hash = sel ? `#/${encodeURIComponent(sel)}/${tab}` : "#/";
  if (location.hash !== hash) location.hash = hash;
  else route();
}
function route() {
  const [, name, tab] = location.hash.split("/");
  S.sel = name ? decodeURIComponent(name) : null;
  S.tab = tab in STORE ? tab : "sites";
  if (S.sel && server()) load(S.sel, S.tab);
  render();
}
window.addEventListener("hashchange", route);

// ---- loading -------------------------------------------------------------

const STORE = { sites: "overview", tunnels: "overview", stats: "stats", traffic: "traffic", traefik: "settings", facts: "facts", updates: "updates", firewall: "firewall", system: "system", history: "history", settings: "settings" };
const URLS = { sites: "", tunnels: "", stats: "/stats", traffic: "/traffic", traefik: "/config", facts: "/facts", updates: "/updates", firewall: "/firewall", system: "/system", history: "/history", settings: "/config" };
// A server's sections, in the list and as tabs on phones; keys 1-9 switch between them.
const SECTIONS = [["sites", "Sites"], ["tunnels", "Tunnels"], ["stats", "Stats"], ["traffic", "Traffic"], ["traefik", "Traefik"], ["updates", "Updates"], ["firewall", "Firewall"], ["system", "System"], ["history", "History"], ["settings", "Settings"]];

// The overview and facts drive the header, so every tab needs them.
const needs = (tab) => (STORE[tab] === "overview" ? ["sites", "facts"] : ["sites", "facts", tab]);
function load(name, tab, force = false) {
  for (const t of needs(tab)) {
    const store = S[STORE[t]];
    if (store[name] && !force) continue;
    // Keep what is shown while it reloads; views show a spinner only when they have nothing yet.
    store[name] = { ...store[name], loading: true, error: undefined };
    http(`/api/servers/${encodeURIComponent(name)}${URLS[t]}${t === "traffic" ? `?since=${S.since}` : ""}`).then(
      (data) => (t === "stats" && logStats(name, data), (store[name] = { data }), render()),
      (e) => ((store[name] = { error: e.message }), render()),
    );
  }
}
function invalidate(name) {
  delete S.dns[name];
  delete S.errs[name];
  delete S.certs[name];
  // What is on screen reloads in place; other tabs reload when opened.
  const shown = new Set(S.sel === name ? needs(S.tab).map((t) => STORE[t]) : []);
  for (const k of Object.values(STORE)) if (!shown.has(k)) delete S[k][name];
  if (S.sel === name) load(name, S.tab, true);
}
async function refreshState() {
  S.state = await http("/api/state");
  render();
}
/** Which servers take landfall's ssh login; the server caches each answer for 30s unless fresh. */
async function loadReach(fresh = false) {
  if (S.reaching) return;
  S.reaching = true;
  renderNav();
  try {
    S.reach = await http(`/api/reach${fresh ? "?fresh=1" : ""}`);
    S.reachedAt = new Date();
  } catch (e) {
    toast(`Checking servers failed: ${e.message}`);
  } finally {
    S.reaching = false;
    // The home tiles show the dots too; an open server's view stays as it is.
    S.sel ? renderNav() : render();
  }
}
const REACH_DOT = { ok: ["up", "reachable"], login: ["warn", "login refused"], down: ["down", "unreachable"] };
function reachDot(n) {
  const r = S.reach[n];
  if (!r) return `<span class="dot" role="img" aria-label="not checked yet" title="${S.reaching ? "Checking…" : "Not checked yet"}"></span>`;
  const [cls, word] = REACH_DOT[r.state];
  const tip = r.state === "ok" ? `Key login works (${r.ms} ms)` : r.state === "login" ? `sshd answers but refuses the login: ${r.detail}` : `Unreachable: ${r.detail}`;
  return `<span class="dot ${cls}" role="img" aria-label="${word}" title="${esc(tip)}"></span>`;
}

// ---- jobs ----------------------------------------------------------------

/**
 * Run `lf <argv>` on the machine running lf ui; output streams into the side panel.
 * after(job) may return follow-up actions [{label, run, cls}] once it ends.
 */
async function run(argv, o = {}) {
  let info;
  try {
    // A retry runs the job's own argv on the server: the page only has it with passwords masked.
    info = o.retry
      ? await http(`/api/jobs/${encodeURIComponent(o.retry)}/force`, {})
      : await http("/api/jobs", { argv, server: o.server ?? S.sel ?? undefined, password: o.password, cwd: o.cwd });
  } catch (e) {
    return toast(e.message);
  }
  const j = { info, lines: [], after: o.after, actions: [] };
  S.jobs.set(info.id, j);
  S.job = info.id;
  stream(j);
  render();
  say(`Running lf ${argv.join(" ")}`);
}

function stream(j) {
  const es = new EventSource(`/api/jobs/${j.info.id}/events?from=${j.lines.length}`);
  j.es = es;
  es.onmessage = (e) => {
    const { from, lines, report } = JSON.parse(e.data);
    if (report) j.report = report;
    j.lines.length = Math.min(j.lines.length, from);
    j.lines.push(...lines);
    if (S.job === j.info.id) appendOutput(j);
    // A tunnel's address shows in the lists once it is up.
    if (isTunnel(j.info) && !j.url && (j.url = tunnelUrl(j))) render();
  };
  es.addEventListener("done", (e) => {
    es.close();
    j.info = JSON.parse(e.data);
    j.report = j.info.report;
    finished(j);
  });
  // Dropped connection while it still runs: pick up where it left off.
  es.onerror = () => {
    es.close();
    if (j.info.code === undefined) setTimeout(() => stream(j), 1000);
  };
}

function finished(j) {
  const { info } = j;
  const failed = info.code !== 0 && info.code !== null;
  j.actions = (j.after && j.after(j)) || [];
  // Safety checks refuse what would lock out ssh or break running services; --force overrides after reading why.
  const why = rep(j).force;
  if (failed && !info.argv.includes("--force") && why) {
    j.actions.push({
      label: "Do it anyway (--force)…",
      cls: "danger",
      run: () => confirmDlg({ title: "Override the safety check?", text: why, ok: "Run with --force", danger: true, onOk: () => run([...info.argv, "--force"], { server: info.server, retry: info.id }) }),
    });
  }
  if (info.undoable && info.server && info.code !== null) {
    j.actions.push({
      label: "Undo this",
      run: () =>
        confirmDlg({
          title: `Undo \`lf ${info.argv.join(" ")}\`?`,
          text: `Reverts the changes this command recorded in the journal on ${info.server}.`,
          ok: "Undo it",
          onOk: () => run(["undo", info.id, "-s", info.server, "-y"], { server: info.server }),
        }),
    });
  }
  if (info.server) invalidate(info.server);
  refreshState().catch(() => {});
  render();
  const what = `lf ${info.argv.join(" ")} ${info.code === 0 ? "done" : info.code === null ? "stopped" : `failed (exit ${info.code})`}`;
  // Closed or showing another job: say so, with a way back to it.
  if (S.job !== info.id) toast(`${info.code === 0 ? "✓" : "✗"} ${what}`, { label: "Show", run: () => showJob(info.id) });
  else say(what);
}
function showJob(id) {
  S.job = id;
  render();
  $("#job .job-out")?.focus({ preventScroll: true });
}
const runningJobs = () => [...S.jobs.values()].filter((j) => j.info.code === undefined);
const isTunnel = (info) => info.argv[0] === "tunnel" || (info.argv[0] === "traefik" && info.argv[1] === "dashboard");
/** Tunnels the UI opened to server n that are still open. */
const openTunnels = (n) => runningJobs().filter((j) => j.info.server === n && isTunnel(j.info));
/** What the job reported through the CLI's report(): never parsed from its text output. */
const rep = (j) => j.report ?? j.info.report ?? {};
const tunnelUrl = (j) => rep(j).url;
/** With --lan: the addresses other devices on the network open it at. */
const lanUrls = (j) => rep(j).lan ?? [];
const closeTunnel = (j) => http(`/api/jobs/${j.info.id}/stop`, {}).catch((e) => toast(e.message));
/** argv plus --port, --local and --lan, picked in a dialog. ports: the ones the container listens on, if known. */
function tunnelOptions(n, argv, ports = []) {
  // A choice only when there is one to make: else free text, empty meaning the CLI's default.
  const port = ports.length > 1
    ? { name: "port", label: "Container port", type: "select", value: String(ports[0]), options: ports.map((p) => ({ value: String(p), label: String(p) })) }

  dialog({
    title: argv[0] === "traefik" ? "Tunnel to the Traefik dashboard" : `Tunnel to ${argv.slice(1).filter((a, i, l) => a !== "-s" && l[i - 1] !== "-s").join(" · ")}`,
    text: `Forwards a port on this machine to it until you close it: lf ${argv.join(" ")}`,
    ok: "Open tunnel",
    fields: [
      ...(argv[0] === "tunnel" ? [port] : []),
      { name: "local", label: "Local port", placeholder: "the container's port, else a free one", value: "", hint: "Fails if something else listens on it." },
      { name: "lan", label: "Reachable from my network too", type: "check", value: false, hint: "Open it from a phone or another device on the same Wi-Fi. Anyone on that network can reach it." },

    onOk: (v) => {
      const isPort = (x) => /^\d+$/.test(x) && +x >= 1 && +x <= 65535;
      const to = v.port?.trim() ?? "", local = v.local.trim();
      if (to && !isPort(to)) return invalid("port", "A port from 1 to 65535");
      if (local && !isPort(local)) return invalid("local", "A port from 1 to 65535");
      run([...argv, ...(to ? ["--port", to] : []), ...(local ? ["-l", local] : []), ...(v.lan ? ["--lan"] : [])], { server: n });
    },

}
/** Open a tunnel with argv, or, when it is open, its address and a way to close it. */
function tunnelBtn(n, argv, label = "Open tunnel", ports = []) {
  // Opened with options, the job's argv goes on after argv.
  const j = openTunnels(n).find((t) => t.info.argv.slice(0, argv.length).join(" ") === argv.join(" "));
  if (!j)
    return `${btn(label, () => run(argv, { server: n }), "sm", `lf ${argv.join(" ")}: until you close it`)}${btn(
      "On network",
      () => run([...argv, "--lan"], { server: n }),
      "sm",
      "Open it for every device on your network too (a phone, a colleague): anyone there reaches it at this machine's address",
    )}${btn("…", () => tunnelOptions(n, argv, ports), "sm", "Container port, local port, network")}`;
  const url = tunnelUrl(j);
  // A database's address is for a client, not the browser.
  const link = (u) => u.startsWith("http://") ? `<a class="tunnel-url" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace("http://", ""))}</a>` : `<code class="tunnel-url" title="Connect a client to it">${esc(u)}</code>`;
  const lan = lanUrls(j);
  const addr = !url ? `<span class="spin" role="img" aria-label="opening"></span>` : link(url);
  return `${addr}${lan.length ? ` <span class="tunnel-lan" title="From other devices on your network">${lan.map(link).join(" ")}</span>` : ""}
    ${btn("Output", () => showJob(j.info.id), "sm ghost")}${btn("Close", () => closeTunnel(j), "sm danger", "Ends the tunnel")}`;

const ANSI = /\x1b\[[0-9;?]*[A-Za-z]/g;
function lineClass(l) {
  if (/^==> /.test(l)) return "c-cyan";
  if (/^\s*✓/.test(l)) return "c-green";
  if (/^\s*!/.test(l)) return "c-yellow";
  if (/^\s*(error|✗|FAIL)/i.test(l)) return "c-red";
  if (/^\$ /.test(l)) return "c-dim";
  return "";
}
function appendOutput(j) {
  const out = $("#job .job-out");
  if (!out) return;
  const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
  const shown = Number(out.dataset.n || 0);
  if (shown > j.lines.length) out.textContent = "";
  const frag = document.createDocumentFragment();
  for (const l of j.lines.slice(out.textContent ? shown : 0)) {
    const div = document.createElement("div");
    const text = l.replace(ANSI, "") || " ";
    // Addresses (a tunnel's localhost one, a deployed site) open in a new tab.
    for (const [i, part] of text.split(/(https?:\/\/[^\s)]+)/).entries()) {
      if (!(i % 2)) div.append(part);
      else div.append(Object.assign(document.createElement("a"), { href: part, textContent: part, target: "_blank", rel: "noopener" }));
    }
    const c = lineClass(text);
    if (c) div.className = c;
    frag.append(div);
  }
  out.append(frag);
  out.dataset.n = j.lines.length;
  if (atBottom) out.scrollTop = out.scrollHeight;
}

function renderJob() {
  const el = $("#job");
  const j = S.jobs.get(S.job);
  $("#app").classList.toggle("with-job", !!j);
  el.hidden = !j;
  if (!j) return;
  const { info } = j;
  const running = info.code === undefined;
  const status = running
    ? `<span class="spin"></span> running`
    : info.code === null
      ? `<span class="dim">stopped</span>`
      : info.code === 0
        ? `<span style="color:var(--ok)">✓ done</span>`
        : `<span style="color:var(--bad)">✗ failed (exit ${info.code})</span>`;
  const others = [...S.jobs.values()].reverse();
  const stop = () => {
    const doStop = () => http(`/api/jobs/${info.id}/stop`, {}).catch((e) => toast(e.message));
    if (!info.undoable) return doStop();
    confirmDlg({ title: `Stop lf ${info.argv[0]}?`, text: "What it changed so far stays. Undo it from History.", ok: "Stop it", danger: true, onOk: doStop });
  };
  // The output element stays across renders: rebuilding it would lose the reader's scroll position.
  let out = $(".job-out", el);
  const fresh = !out || out.dataset.job !== info.id;
  if (fresh) {
    out = Object.assign(document.createElement("div"), { className: "job-out", tabIndex: 0 });
    out.dataset.job = info.id;
    out.setAttribute("role", "region");
    out.setAttribute("aria-label", "Output");
  }
  el.innerHTML = `
    <div class="job-head">
      <span class="title" title="${esc("lf " + info.argv.join(" "))}">$ lf ${esc(info.argv.join(" "))}</span>
      ${btn("✕", () => ((S.job = null), render()), "ghost sm", "Close (Esc)", "job-close").replace("<button", `<button aria-label="Close output"`)}
    </div>
    <div class="job-out-slot"></div>
    <div class="job-foot">
      <span class="status">${status}</span>
      ${running ? btn("Stop", stop, "danger", info.undoable ? "Changes made so far stay" : "", "job-stop") : ""}
      ${(running ? [] : j.actions).map((a, i) => btn(esc(a.label), a.run, a.cls ?? (i === 0 ? "primary" : ""), "", `job-act:${a.label}`)).join("")}
    </div>
    ${others.length > 1 ? `<div class="joblist">${others
      .map((o) => {
        const [cls, ico] = o.info.code === undefined ? ["", "…"] : o.info.code === 0 ? ["ok", "✓"] : o.info.code === null ? ["", "■"] : ["bad", "✗"];
        return `<button type="button" class="${o.info.id === S.job ? "on" : ""}" data-f="job:${o.info.id}" ${on(() => showJob(o.info.id))}>
        <span class="${cls}">${ico}</span><span>lf ${esc(o.info.argv.join(" "))}</span></button>`;
      })
      .join("")}</div>` : ""}`;
  $(".job-out-slot", el).replaceWith(out);
  appendOutput(j);
  if (fresh) out.scrollTop = out.scrollHeight;
}

// ---- dialogs -------------------------------------------------------------

/**
 * A modal form. fields: [{name, label, value, type: text|password|textarea|select|check, options, hint, placeholder}].
 * onOk(values) runs on submit; return false to keep it open, or {field, error} to keep it open and show why.
 * typeToConfirm: a name the user types before the (dangerous) action is enabled.
 */
function dialog({ title, text = "", fields = [], ok = "OK", danger = false, onOk, extra = "", after = "", typeToConfirm = "" }) {
  const dlg = openDlg();
  const field = (f) => {
    const id = `f-${f.name}`;
    const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "";
    if (f.type === "check") {
      return `<label class="check"><input type="checkbox" id="${id}" name="${f.name}" ${f.value ? "checked" : ""}><span>${esc(f.label)}${hint}</span></label>`;
    }
    if (f.type === "select") {
      return `<label>${esc(f.label)}<select id="${id}" name="${f.name}">${f.options
        .map((o) => `<option value="${esc(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc(o.label)}</option>`)
        .join("")}</select>${hint}</label>`;
    }
    if (f.type === "password") return `<label>${esc(f.label)}${secretInput(id, f)}${hint}</label>`;
    if (f.type === "textarea") return `<label>${esc(f.label)}<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder)}">${esc(f.value)}</textarea>${hint}</label>`;
    return `<label>${esc(f.label)}<input id="${id}" name="${f.name}" type="${f.type || "text"}" value="${esc(f.value)}" placeholder="${esc(f.placeholder)}" autocomplete="off" spellcheck="false">${hint}</label>`;
  };
  const group = (f) => (f.legend ? `<fieldset${f.id ? ` id="fs-${f.id}"` : ""}><legend>${esc(f.legend)}</legend>${f.fields.map(field).join("")}</fieldset>` : field(f));
  dlg.innerHTML = `<form method="dialog" novalidate>
    <h2 id="dlg-title">${esc(title)}</h2>
    ${text ? `<div class="text">${esc(text)}</div>` : ""}
    ${extra}
    ${fields.map(group).join("")}
    ${after}
    ${typeToConfirm ? `<label>Type <b class="mono">${esc(typeToConfirm)}</b> to confirm<input id="dlg-confirm" autocomplete="off" spellcheck="false" autocapitalize="off"></label>` : ""}
    <div class="note bad dlg-err" id="dlg-err" role="alert" hidden></div>
    <div class="btns">
      <button type="button" value="cancel" class="ghost" id="dlg-cancel">Cancel</button>
      <button type="submit" value="ok" class="${danger ? "danger solid" : "primary"}">${esc(ok)}</button>
    </div>
  </form>`;
  const form = $("form", dlg);
  const submit = $("button[type=submit]", form);
  $("#dlg-cancel", dlg).onclick = () => dlg.close();
  if (typeToConfirm) {
    submit.disabled = true;
    $("#dlg-confirm", dlg).oninput = (e) => (submit.disabled = e.target.value.trim() !== typeToConfirm);
  }
  form.oninput = (e) => e.target.removeAttribute?.("aria-invalid");
  form.onsubmit = (e) => {
    e.preventDefault();
    if (submit.disabled) return;
    const values = {};
    for (const f of fields.flatMap((f) => f.fields ?? [f])) {
      const el = form.elements[f.name];
      values[f.name] = f.type === "check" ? el.checked : el.value;
    }
    const r = onOk(values);
    if (r === false) return;
    if (r?.error) {
      const err = $("#dlg-err", dlg), el = r.field && form.elements[r.field];
      err.textContent = r.error;
      err.hidden = false;
      el?.setAttribute("aria-invalid", "true");
      el?.focus();
      return;
    }
    // Empty before closing: browsers offer to save a password they still see when the form goes away.
    for (const el of form.querySelectorAll(".secret")) el.value = "";
    dlg.close();
  };
  dlg.showModal();
  // A dangerous confirm starts on Cancel, so a stray Enter does not delete anything.
  const first = $("input:not([type=checkbox]), textarea, select", form);
  (first || (danger ? $("#dlg-cancel", dlg) : submit)).focus();
}
const invalid = (field, error) => ({ field, error });
/** What is wrong with a login (lf newLogin's rules), as [field, message]. */
const loginError = (user, password, { loginName, minPassword } = S.state.rules) =>
  !new RegExp(loginName).test(user) ? ["user", "Only letters, digits and . _ @ -"]
  : password.length < minPassword ? ["password", `The password needs at least ${minPassword} characters`]
  : null;
/**
 * Passwords here are for servers and sites, not for this page: a masked text field, so browsers
 * and password managers do not offer to save them. Browsers without text masking get a password field.
 */
const MASK = CSS.supports("-webkit-text-security", "disc");
const secretInput = (id, f) =>
  `<input id="${id}" name="${f.name}" class="secret" type="${MASK ? "text" : "password"}" value="${esc(f.value)}" placeholder="${esc(f.placeholder)}" autocomplete="${MASK ? "off" : "new-password"}" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">`;
/** The shared <dialog>, closed and reset so a new one can take its place. */
function openDlg(cls = "") {
  const dlg = $("#dlg");
  if (dlg.open) dlg.close();
  dlg.className = cls;
  dlg.site = undefined;
  return dlg;
}
const confirmDlg = (o) => dialog({ ...o, onOk: () => o.onOk() });
const promptDlg = (title, text, field, onOk, ok = "OK") => dialog({ title, text, fields: [{ name: "v", ...field }], ok, onOk: (v) => onOk(v.v.trim()) });

// ---- server flows ----------------------------------------------------------

const sv = (n) => ["-s", n];
const server = () => S.state?.servers.find((s) => s.name === S.sel);

function setupFlow(args, base = args) {
  run(["setup", ...args, "--check"], {
    server: args[0],
    after: (j) => {
      if (j.info.code !== 0) return;
      // Synology and other systems without a package manager: nothing for setup to apply.
      if (rep(j).refuse) return [{ label: "Back to the server", run: () => ((S.job = null), go(args[0], "sites")) }];
      if (rep(j).needsKey) {
        return [{ label: "Enter the password to install a key", run: () => passwordFor(args, base) }];
      }
      const todo = (rep(j).checks ?? []).filter((ch) => ch.status === "todo").length;
      return [
        { label: todo ? `Apply ${plural(todo, "change")}` : "Finish setup (nothing to install)", run: () => run(["setup", ...args, "-y"], { server: args[0], after: securityAfter(args[0]) }) },
        { label: "Change options", run: () => setupWizard(base) },
      ];
    },
  });
}

/** After a job that ends with security advice: a way to its fixes. */
const securityAfter = (n) => (j) =>
  j.info.code === 0 && rep(j).advice?.length ? [{ label: `Security: ${plural(rep(j).advice.length, "thing")} to look at`, run: () => go(n, "system") }] : undefined;

function setupWizard(base) {
  const saved = S.state.servers.find((s) => s.name === base[0])?.saved ?? {};
  dialog({
    title: `Set up ${base[0]}`,
    text: "landfall first shows what it finds and what it would change. Nothing is applied before you confirm.",
    ok: "Check",
    fields: [
      {
        legend: "Traefik (reverse proxy, automatic HTTPS)",
        fields: [
          {
            name: "traefik", label: "Mode", type: "select", value: saved.hostNetwork ? "host" : "docker",
            options: [
              { value: "docker", label: "Own Traefik, ports published by Docker" },
              { value: "host", label: "Own Traefik on the host network (real client IPs, ufw guards 80/443)" },
              { value: "none", label: "No Traefik (add later with traefik setup)" },
            ],
            hint: "If the server already runs a Traefik on 80/443, setup routes sites through it instead.",
          },
          { name: "image", label: "Image", value: saved.traefikImage ?? S.state.defaultImage },
          { name: "email", label: "Let's Encrypt e-mail (optional)", value: saved.email ?? "" },
          { name: "dashboard", label: "Dashboard domain (optional)", value: "", placeholder: "traefik.example.com", hint: "Behind basic auth; the password is shown after setup." },
          { name: "http3", label: "HTTP/3 (QUIC on 443/udp)", type: "check", value: saved.http3 !== false, hint: "Browsers that can't use it fall back to HTTP/2." },
        ],
      },
      { name: "firewall", label: "Enable ufw: deny incoming except ssh, 80 and 443", type: "check", value: true, hint: "Skipped automatically if it would block ports in use." },
      { name: "harden", label: "Key login only (turn off ssh passwords)", type: "check", value: true, hint: "Skipped automatically if other users still log in with a password." },
      { name: "user", label: "Deploy user", value: "deploy", hint: "landfall deploys as this user (docker group, your key). Empty keeps the login user." },
    ],
    onOk: (v) => {
      const f = [];
      if (v.traefik === "none") f.push("--no-traefik");
      else {

        if (v.image.trim()) f.push(`--image=${v.image.trim()}`);
        if (v.email.trim()) f.push(`--email=${v.email.trim()}`);
        if (v.dashboard.trim()) f.push(`--dashboard=${v.dashboard.trim()}`);

      }
      if (!v.firewall) f.push("--no-firewall");

      f.push(`--deploy-user=${v.user.trim()}`);

    },

}

function passwordFor(args, base) {
  const host = args.includes("--host") ? `root@${args[args.indexOf("--host") + 1]}` : S.state.servers.find((s) => s.name === args[0])?.target ?? args[0];
  promptDlg(
    `Password for ${host}`,
    "Used once to install landfall's ssh key (ssh-copy-id). It is not stored; afterwards only the key is used.",
    { type: "password", label: "Password" },
    (pw) => {
      if (!pw) return;
      run(["setup", ...args, "--key-only", "-y"], {
        password: pw,
        server: args[0],
        after: (j) => {
          if (j.info.code === 0) return void setTimeout(() => setupFlow(args, base));
          return [{ label: "Try the password again", run: () => passwordFor(args, base) }];
        },
      });
    },
    "Install key",
  );
}

function addServer() {
  dialog({
    title: "Add a server",
    text: "Use an alias from ~/.ssh/config (like vps), or pick a new name and give the machine's address, fresh or already in use. landfall writes the ssh config entry for it.",
    fields: [
      { name: "name", label: "Name", placeholder: "vps" },
      { name: "host", label: "IP or hostname (not needed for an ssh alias)", placeholder: "203.0.113.7" },
      {
        legend: "Login (for a new address)",
        fields: [
          { name: "user", label: "User", placeholder: "root" },
          { name: "port", label: "SSH port", placeholder: "22" },
          { name: "key", label: "Private key file (optional)", placeholder: "~/.ssh/id_ed25519", hint: "Without one, landfall creates ~/.ssh/landfall_<name> and installs it with the password." },
          { name: "password", label: "Password (optional)", type: "password", hint: "Used once to install the key, never stored. Leave empty if the key already works." },
        ],
      },
      { name: "setup", label: "Set it up now (shows what it would change first)", type: "check", value: true },
    ],
    ok: "Add",
    onOk: (v) => {
      const [name, host, user, port, key] = [v.name, v.host, v.user, v.port, v.key].map((x) => x.trim());
      if (!name) return invalid("name", "Give the server a name");
      const known = S.state.servers.some((s) => s.name === name);
      if (!known && !host) return invalid("host", `${name} is not in your ssh config: give its IP or hostname`);
      if (port && !/^\d+$/.test(port)) return invalid("port", "The port is a number");
      const args = [name, ...(host ? ["--host", host] : []), ...(user ? ["-u", user] : []), ...(port ? ["-p", port] : []), ...(key ? ["-i", key] : [])];
      // With a password: install the key now, then the setup wizard needs nothing but the alias.
      const then = (j) => (j.info.code === 0 ? void (v.setup ? setupWizard([name]) : go(name)) : undefined);
      if (v.password) run(["server", "add", ...args], { server: name, password: v.password, after: then });
      else if (v.setup) setupWizard(args);
      else run(["server", "add", ...args], { server: name, after: (j) => void go(name, rep(j).advice?.length ? "system" : S.tab) });
    },
  });
}

const defaultServer = () => S.sel ?? S.state.servers.find((s) => s.isDefault)?.name;

/** The server deploys new sites with no domain unless one is given: its own setting, else landfall's default. */

/** landfall's defaults for every server (lf config); a server's own setting wins. */
function defaultsDialog() {
  const d = S.state.defaults;
  dialog({
    title: "landfall defaults",
    text: `For every server, unless it sets its own. Saved in ${d.configFile}.`,
    fields: [
      { name: "default", label: "Default server", type: "select", value: d.default ?? "", options: [{ value: "", label: "none" }, ...S.state.servers.map((s) => ({ value: s.name, label: s.name }))], hint: "Commands in a terminal use it without --server." },
      { name: "tunnelOnly", label: "New sites get no domain: tunnel only", type: "check", value: d.tunnelOnly, hint: "Nothing is served on the internet until a site gets a domain. A server's Settings can override it." },
      { name: "email", label: "Let's Encrypt e-mail (optional)", value: d.email ?? "", hint: "For servers that set none, when landfall installs Traefik." },
      { name: "keep", label: "Releases to keep for rollback", value: String(d.keep), placeholder: "5" },
    ],
    after: whereList(d.locations),
    ok: "Save",
    onOk: (v) => {
      const argv = ["config"];
      if (v.default !== (d.default ?? "")) argv.push(...(v.default ? ["--default", v.default] : ["--unset", "default"]));
      if (v.tunnelOnly !== d.tunnelOnly) argv.push(v.tunnelOnly ? "--tunnel-only" : "--no-tunnel-only");
      const email = v.email.trim();

      const keep = v.keep.trim();
      if (keep && (!/^\d+$/.test(keep) || !Number(keep))) return invalid("keep", "A whole number from 1 up");
      if (keep !== String(d.keep)) argv.push(...(keep ? ["--keep", keep] : ["--unset", "keep"]));
      if (argv.length === 1) return;
      run(argv, { after: (j) => (j.info.code === 0 ? void (S.sel && load(S.sel, "settings", true), refreshState()) : undefined) });
    },
  });
}
/** Every place landfall writes to, from `lf config`: nothing it installs is hidden. */
const whereList = (loc) => {
  const kv = (list) => `<dl>${list.map((l) => `<dt class="mono">${esc(l.path)}</dt><dd class="dim">${esc(l.what)}</dd>`).join("")}</dl>`;
  return `<details class="where"><summary>Where landfall puts things</summary>
    <h3>On this machine</h3>${kv(loc.local)}<h3>On each server</h3>${kv(loc.server)}</details>`;
};
/** What `lf deploy` picks without a domain: <site>.<main domain>, else the free sslip.io address. */
function autoDomain(n, name) {
  const main = mainDomain(n);
  if (main) return `${name}.${main}`;
  const suffix = S.facts[n]?.data?.sslipSuffix;
  return suffix ? `${name}.${suffix}` : "";
}
const slugify = (s) => s.toLowerCase().replace(/\.(zip|tgz|tar(\.gz)?)$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "site";
const tilde = (p) => p.replace(/^\/(Users|home)\/[^/]+/, "~");

function describe(d, before = true) {
  const built = d.build ? ` · builds with <code>${esc(d.build)}</code> first` : "";
  const what =
    d.kind === "compose" ? `Compose project <code>${esc(d.compose ?? "compose.yaml")}</code>: built and started on the server; x-landfall picks the routed service`
    : d.kind === "image" ? `Docker image <code>${esc(d.project?.image ?? "")}</code> (from .landfall.json)`
    : d.kind === "dockerfile" && d.start ? `${esc(d.runtime ?? "Node.js")} app${d.tool && d.tool !== d.runtime ? ` (${esc(d.tool)})` : ""}: built on the server${d.build ? ` with <code>${esc(d.build)}</code>` : ""}, started with <code>${esc(d.start)}</code> on port ${esc(d.port)}${d.note ? `<br><span style="color:var(--warn)">${esc(d.note)}</span>` : ""}`
    : d.kind === "dockerfile" ? `Dockerfile: built on the server, served on port ${esc(d.port)}`
    : d.dir ? `Static files from <code>${esc(d.dir === "." ? "./" : d.dir + "/")}</code>${d.tool ? ` (where ${esc(d.tool)} builds the site)` : ""}${d.spa ? " (single-page app)" : ""}${built}`
    : d.build ? `Static site, built with <code>${esc(d.build)}</code> first`
    : `<span style="color:var(--warn)">No compose.yaml, Dockerfile, index.html or build script here.</span>`;
  return what + (before && d.project?.server ? ` <span class="dim">· deployed before to ${esc(d.project.server)}</span>` : "");
}

/**
 * Deploy a local folder (det from /api/fs or an upload). upload: a temporary folder, so no .landfall.json.
 * site: an existing site ({ server, name, domains, old }) this folder redeploys.
 */
function deployDialog(det, o = {}) {
  const p = det.project;
  const re = o.site;
  const servers = S.state.servers.map((s) => ({ value: s.name, label: s.name }));
  const target = re?.server ?? p?.server ?? defaultServer();
  const name = re?.name ?? o.name ?? det.name;
  const main = mainDomain(target);
  // A redeploy keeps the site's domains unless .landfall.json or the field names others.
  const keeps = re && !p?.domains ? re.domains : null;
  // Static files or an app without a Dockerfile: what to build and run is landfall's to decide, and editable here.
  const runtime = det.runtime ?? "Node.js";
  const modal = det.kind === "static" || !!det.start;
  dialog({
    title: re ? `Redeploy ${name}` : `Deploy ${name}`,
    text: (o.upload ? `Uploaded ${plural(o.files ?? 0, "file")}. Not remembered: drop it again to redeploy.` : `From ${tilde(det.path)}${p ? " (settings from .landfall.json)" : ""}`)
      + (re ? `\nGoes live as a new release of ${name} on ${re.server}: volumes keep their data${re.old ? "." : ", and Roll back… returns to the current one."}` : ""),
    extra: `<div class="detected">${describe(det)}</div>`,
    fields: [
      { name: "name", label: "Site name", value: name, hint: re ? "Another name deploys a new site instead." : "" },
      { name: "server", label: "Server", type: "select", options: servers, value: target },
      {
        name: "domains", label: "Domains", value: (p?.domains ?? []).join(" "),
        placeholder: keeps ? keeps.join(" ") || "none" : autoDomain(target, name) || "example.com www.example.com",
        hint: keeps
          ? `Empty: keeps ${keeps.length ? keeps.join(", ") : "no domain (tunnel only)"}.`
          : main
          ? `Empty: <name>.${main}. A bare name like blog means blog.${main}, @ means ${main} itself (another site serving it hands it over). Other domains need an A record pointing at the server.`
          : "Empty: a free <name>.<ip>.sslip.io address, no DNS needed. Own domains need an A record pointing at the server.",
      },
      { name: "noDomain", label: "No domain: reach it through a tunnel only", type: "check", value: p?.domains ? !p.domains.length : re ? false : !!tunnelOnly(target), hint: "Nothing is served on the internet. Give it a domain later with Domains… on the site." },
      ...(modal
        ? [
            ...(det.node || det.start
              ? [{ name: "mode", label: "Deploy as", type: "select", value: det.start ? "node" : "static", options: [{ value: "node", label: `${runtime} app (runs on the server)` }, { value: "static", label: "Static files" }] }]
              : []),
            { name: "build", label: "Build command", value: det.build ?? "", placeholder: "none", hint: `Static files: runs here, before the upload. ${runtime === "Node.js" ? "A Node.js app" : `The ${runtime} app`}: runs on the server, in its image.` },
            {
              legend: "Static files", id: "static",
              fields: [
                {
                  name: "dir", label: "Folder to publish", value: det.dir ?? ".", placeholder: ".",
                  hint: det.tool && !det.start ? `Detected: ${det.tool} writes the site to ${det.dir}/ (it need not exist before the build).` : "Relative to the project; it needs an index.html after the build.",
                },
                { name: "spa", label: "Single-page app (unknown paths serve index.html)", type: "check", value: !!p?.spa },
              ],
            },
            {
              legend: `${runtime} app`, id: "node",
              fields: [
                {
                  name: "start", label: "Start command", value: det.start ?? "", placeholder: "node server.js",
                  hint: `${det.start && det.tool ? `Detected: ${det.tool}. ` : ""}landfall writes the Dockerfile (install, build, start); lf init puts it into the project to change it.`,
                },
                { name: "port", label: "Port it listens on", value: String(det.port ?? 3000), hint: runtime === "Node.js" ? "The app gets it as PORT, with HOST=0.0.0.0." : "The app gets it as PORT." },
              ],
            },
          ]
        : det.kind === "dockerfile" || det.kind === "image"
        ? [{ name: "port", label: "Port it listens on", value: String(det.port ?? 3000) }]
        : []),
      {
        legend: "Login (optional)",
        fields: [
          { name: "authUser", label: "User", value: "admin", placeholder: "admin" },
          { name: "authPassword", label: `Password (at least ${S.state.rules.minPassword} characters)`, type: "password", hint: "Visitors log in with this user and password (HTTP basic auth). Empty: no change; set or remove it later with Password… on the site." },
        ],
      },
    ],
    ok: re ? "Redeploy" : "Deploy",
    onOk: (v) => {
      const n = v.name.trim();
      if (!n) return invalid("name", "Give the site a name");
      if (!v.server) return invalid("server", "Pick a server");
      const domains = v.domains.split(/[\s,]+/).filter(Boolean);
      // The server's default would leave it unrouted though the box is unticked.
      if (!v.noDomain && !domains.length && !p?.domains?.length && !(keeps && n === re.name && v.server === re.server) && tunnelOnly(v.server)) return invalid("domains", `${v.server} gives new sites no domain: name one, or tick No domain`);
      const argv = ["deploy", "-y", ...sv(v.server), "-n", n, ...(v.noDomain ? ["--no-domain"] : domains.flatMap((d) => ["-d", d]))];
      const asNode = modal && (v.mode ?? (det.start ? "node" : "static")) === "node";
      const build = v.build?.trim() ?? "";
      if (asNode) {
        const start = v.start.trim();
        if (!start) return invalid("start", "How does the app start? For example: node server.js");
        if (start !== det.start) argv.push("--start", start);
        if (build !== (det.build ?? "")) argv.push("--build", build);
      } else if (modal) {
        if (det.start) argv.push("--static");
        if (build && build !== p?.build) argv.push("--build", build);
        if (v.spa && !p?.spa) argv.push("--spa");
        const dir = v.dir.trim().replace(/\/+$/, "") || ".";
        if (/^[/-]/.test(dir) || dir.split("/").includes("..")) return invalid("dir", "A folder inside the project");
        if (dir !== (det.dir ?? ".")) argv.push(dir);
      }
      if (v.port !== undefined && (asNode || !modal)) {
        const port = Number(v.port.trim());
        if (!Number.isInteger(port) || port < 1 || port > 65535) return invalid("port", "A port from 1 to 65535");
        if (port !== (det.port ?? 3000)) argv.push("--port", String(port));
      }
      // The login counts once there is a password; the user defaults to admin.
      if (v.authPassword) {
        const user = v.authUser.trim() || "admin";
        const bad = loginError(user, v.authPassword);
        if (bad) return invalid(bad[0] === "user" ? "authUser" : "authPassword", bad[1]);
        argv.push("--auth-user", user, "--auth-password", v.authPassword);
      }
      if (o.upload) argv.push("--no-save");
      run(argv, { server: v.server, cwd: det.path, after: openAfter });
    },
  });
  noDomainToggle();
  modeToggle();
}

/** The open dialog's "deploy as" picks which settings show: the static folder's or the Node.js app's. */

  const mode = $("#f-mode"), stat = $("#fs-static"), node = $("#fs-node");

  const sync = () => {

/** The open dialog's "no domain" box greys out its domains field: ticked, the site gets none. */

// Dropped folders: walk the entries (skipping dependencies and VCS data), then upload with relative paths.
const SKIP = new Set(["node_modules", ".git", ".DS_Store", "__MACOSX"]);
const skipped = (rel) => rel.split("/").some((x) => SKIP.has(x));
async function droppedFiles(roots) {
  const out = [];
  const walk = async (entry, prefix) => {
    if (SKIP.has(entry.name)) return;
    if (entry.isFile) out.push([await new Promise((res, rej) => entry.file(res, rej)), prefix + entry.name]);
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (let batch; (batch = await new Promise((res, rej) => reader.readEntries(res, rej))).length; ) {
        for (const e of batch) await walk(e, `${prefix}${entry.name}/`);
      }
    }
  };
  for (const r of roots) await walk(r, "");
  return out;
}

async function upload(pairs, label = "site", site) {
  if (!pairs.length) return toast("Nothing to upload");
  const fd = new FormData();
  for (const [f, path] of pairs) fd.append("file", f), fd.append("path", path);
  toast(`Uploading ${plural(pairs.length, "file")}…`);
  try {
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const data = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` }));
    if (!r.ok) throw new Error(data.error);
    toast(`Uploaded ${plural(data.files, "file")}`);
    deployDialog(data.detected, { upload: true, files: data.files, name: slugify(label), site });
  } catch (e) {
    toast(`Upload failed: ${e.message}`);
  }
}

const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes("Files");
window.addEventListener("dragover", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  document.body.classList.add("dragging");
});
window.addEventListener("dragleave", (e) => {
  if (!e.relatedTarget) document.body.classList.remove("dragging");
});
window.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  document.body.classList.remove("dragging");
  // Entries must be taken while the event is live.
  const roots = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
  const label = roots[0]?.name ?? e.dataTransfer.files[0]?.name;
  const files = roots.length ? droppedFiles(roots) : Promise.resolve([...e.dataTransfer.files].map((f) => [f, f.name]));
  const dlg = $("#dlg");
  const site = dlg.open ? dlg.site : undefined;
  files.then((pairs) => upload(pairs, label, site), (err) => toast(err.message));
});

const servedByOther = (n, site, d) => S.overview[n]?.data?.sites.find((s) => s.meta.name !== site && s.domains.includes(d))?.meta.name;

function authDialog(n, m) {

function ensureDns(n, o, force = false) {
  if ((S.dns[n] && !force) || S.dns[n]?.loading || !o?.sites.length) return;

  // A recheck keeps the last answer on screen.
  S.dns[n] = { ...S.dns[n], loading: true };
  http(`/api/servers/${encodeURIComponent(n)}/dns?domains=${encodeURIComponent(domains.join(","))}`).then(
    (data) => ((S.dns[n] = { data }), render()),
    (e) => ((S.dns[n] = { error: e.message }), render()),
  );
}

function domainChip(n, d) {
  const c = S.dns[n]?.data?.domains.find((x) => x.domain === d);
  const url = `https://${d}`;
  let dot = "", title = "checking…";
  if (c) {
    const { status: st, ms, tls } = c.https;
    const cert = tls ? (tls.valid ? ` · certificate ${plural(tls.days, "day")} left` : ` · certificate: ${tls.error}`) : "";
    if (!c.ips.length) (dot = "down"), (title = "DNS: does not resolve");
    else if (!c.ok) (dot = "warn"), (title = `DNS points at ${c.ips.join(", ")}, not this server`);
    else if (st && st < 500 && tls && (!tls.valid || tls.days < 7)) (dot = "warn"), (title = `HTTPS ${st}${cert}`);
    else if (st && st < 500) (dot = "up"), (title = `HTTPS ${st}${st === 401 ? " (login required)" : ""} in ${ms} ms${cert}`);
    else (dot = "down"), (title = `HTTPS: ${st ?? c.https.error}`);
  }
  return `<span class="chip"><span class="dot ${dot}" title="${esc(title)}"></span><a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title)}" onclick="event.stopPropagation()">${esc(d)}</a>${btn("⧉", () => copy(url), "ghost", "Copy the address")}</span>`;
}

}

function makeDefault(n) {

function renderNav() {
  const st = S.state;
  // Reachable first, then refused, then down; unchecked last. sort() is stable, so ties keep config order.
  const list = st.servers.slice().sort((a, b) => reachRank(a.name) - reachRank(b.name));
  // Down servers sit in their own group, closed until opened, so the rest stay in view.
  const isDown = (s) => S.reach[s.name]?.state === "down";
  const own = list.filter((s) => s.registered && !isDown(s));
  const aliases = list.filter((s) => !s.registered && !isDown(s));
  const down = list.filter(isDown);
  const q = S.filter.toLowerCase();
  const hit = (s) => !q || s.name.toLowerCase().includes(q) || s.target.toLowerCase().includes(q) || s.name === S.sel;
  const item = (s) => {
    const tunnels = openTunnels(s.name).length;
    const r = S.reach[s.name];
    const why = r?.state === "login" ? `<span class="x"> · <span class="refused">login refused</span></span>` : "";
    const head = `<button type="button" class="srv ${s.name === S.sel ? "on" : ""} ${r?.state === "down" ? "off" : ""}" data-f="srv:${esc(s.name)}" ${on(() => go(s.name, S.sel === s.name ? S.tab : "sites"))}>
      ${reachDot(s.name)}<div class="n">${esc(s.name)}${s.isDefault ? `<span class="star" title="default server">★</span>` : ""}</div>
      <div class="t"><span class="h">${esc(s.target)}</span>${why}${tunnels ? `<span class="x"> · <span class="live">${plural(tunnels, "tunnel")}</span></span>` : ""}</div></button>`;
    return s.name === S.sel ? `${head}<div class="sections" role="list" aria-label="${esc(s.name)}">${sectionButtons(s.name, "sec")}</div>` : head;
  };
  const group = (key, title, l) => {
    if (!l.length) return "";
    const shown = l.filter(hit);
    // A closed group still shows the open server; a filter opens every group.
    const closed = navClosed.has(key) && !q;
    const rows = closed ? shown.filter((s) => s.name === S.sel) : shown;
    return `<h3><button type="button" class="grp" aria-expanded="${!closed}" ${on(() => toggleGroup(key))}><span class="caret" aria-hidden="true"></span>${title}</button><span>${q ? `${shown.length}/` : ""}${l.length}</span></h3>
      ${rows.map(item).join("") || (closed ? "" : `<div class="nav-none">no match</div>`)}`;
  };
  $("#filter").hidden = list.length < 8;
  $("#add-server").textContent = list.length < 8 ? "+ Add server" : "+";
  $("#navlist").innerHTML = `<button type="button" class="srv nav-home ${S.sel ? "" : "on"}"${S.sel ? "" : ` aria-current="page"`} data-f="home" ${on(() => go(null))}><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5h-4.5zM9 2.5h4.5v4.5h-4.5zM2.5 9h4.5v4.5h-4.5zM9 9h4.5v4.5h-4.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><div class="n">Overview</div></button>${group("own", "Servers", own)}${group("ssh", "From ~/.ssh/config", aliases)}${group("down", "Unreachable", down)}
    ${list.length ? "" : `<div class="nav-none">No servers yet.</div>`}`;
  $("#navfoot").hidden = !list.length;
  $("#navfoot").innerHTML = reachSummary(list);
  $("#pick").innerHTML = `<select aria-label="Server" onchange="go(this.value || null)">
    <option value="">Pick a server…</option>${list.map((s) => `<option value="${esc(s.name)}" ${s.name === S.sel ? "selected" : ""}>${esc(s.name)} · ${esc(s.target)}${S.reach[s.name] && S.reach[s.name].state !== "ok" ? ` · ${REACH_DOT[S.reach[s.name].state][1]}` : ""}</option>`).join("")}
  </select>`;
}

const reachRank = (n) => ({ ok: 0, login: 1, down: 2 })[S.reach[n]?.state] ?? 3;

/** The sidebar's foot: what the login check is doing, or what it found and when. */
function reachSummary(list) {
  const btnHtml = `<button type="button" class="sm ghost recheck" ${S.reaching ? "disabled" : ""} title="Try landfall's ssh login on every server again (lf server list --check)" ${on(() => loadReach(true))}><span class="${S.reaching ? "spin" : "ico"}" aria-hidden="true">${S.reaching ? "" : "↻"}</span>${S.reaching ? "Checking" : "Check"}</button>`;
  if (S.reaching) return `<div class="what" role="status">Trying ssh login on ${plural(list.length, "server")}…</div>${btnHtml}`;
  if (!S.reachedAt) return `<div class="what">Not checked yet</div>${btnHtml}`;
  const count = { ok: 0, login: 0, down: 0 };
  for (const s of list) if (S.reach[s.name]) count[S.reach[s.name].state]++;
  const part = (k, word) => (count[k] ? `<span title="${esc(word)}"><span class="dot ${REACH_DOT[k][0]}"></span>${count[k]} ${word}</span>` : "");
  const at = S.reachedAt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return `<div class="what" role="status"><div class="counts">${part("ok", "reachable")}${part("login", "refused")}${part("down", "down")}</div>
    <div class="when">checked ${at} · again every minute</div></div>${btnHtml}`;
}

// Unreachable starts folded on every load; only the other groups remember their state.
const navClosed = new Set([...(() => {
  try {
    return JSON.parse(localStorage.getItem("lf.navClosed") ?? "[]");
  } catch {
    return [];
  }
})(), "down"]);
function toggleGroup(key) {
  navClosed.has(key) ? navClosed.delete(key) : navClosed.add(key);
  try {
    localStorage.setItem("lf.navClosed", JSON.stringify([...navClosed].filter((k) => k !== "down")));
  } catch {}
  renderNav();
}
