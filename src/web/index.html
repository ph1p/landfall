<style>
:root {

}

.srv { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: var(--r-sm); }

}

.card .body { padding: 12px 16px; }

.nowrap { white-space: nowrap; }

.scroll { overflow-x: auto; }

.dot.up { background: var(--ok); } .dot.down { background: var(--bad); } .dot.warn { background: var(--warn); }

.dim { color: var(--dim); } .faint { color: var(--faint); }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: var(--fs); margin: 0; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; }

.detail td { background: var(--bg); }
.releases, .services { margin: 0; padding: 0; list-style: none; }

.steps { list-style: none; margin: 8px 0 0; padding: 0 0 0 4px; }

.steps li.undone, .steps li.fixed { color: var(--faint); }

.form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }

label { display: block; font-size: var(--fs-sm); color: var(--dim); }

.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }

[hidden] { display: none !important; }

.job-out .c-cyan { color: #67d3e8; } .job-out .c-green { color: #6ee7a0; } .job-out .c-yellow { color: #f5c76a; } .job-out .c-red { color: #ff8a8a; } .job-out .c-dim { color: #7b8494; }

dialog { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0; background: var(--panel); color: var(--text); box-shadow: var(--shadow); width: min(520px, calc(100vw - 32px)); }

legend { font-size: var(--fs-sm); font-weight: 600; padding: 0 4px; }

.toast button { margin-left: 10px; background: none; border-color: color-mix(in srgb, var(--bg) 40%, transparent); color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.chip button { padding: 0 5px; font-size: var(--fs-sm); min-width: 24px; min-height: 24px; color: var(--faint); }
.chip:hover button, .chip button:focus-visible { color: var(--text); }
.lock { font-size: var(--fs-xs); margin-left: 4px; }

.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); max-height: 260px; overflow: auto; }

.detected { font-size: var(--fs); padding: 8px 12px; border-radius: var(--r); background: var(--bg); }

  content: "Drop a folder or .zip to deploy it"; position: fixed; inset: 12px; z-index: 20; display: grid; place-items: center;
  border: 2px dashed var(--accent); border-radius: var(--r-lg); background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--accent); font-size: 18px; font-weight: 600; pointer-events: none;

<body>
<div class="app" id="app">
  <header>
    <a class="brand" href="#/"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="var(--accent)"/><path d="M4 5h8M4 8h8M4 11h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>landfall <small id="version"></small></a>
    <div class="project" id="project"></div>
  </header>
  <!-- The filter stays put across renders, so typing keeps its focus. -->
  <nav class="servers" id="nav">
    <div class="nav-top"><input id="filter" type="search" placeholder="Filter servers" autocomplete="off" spellcheck="false" aria-label="Filter servers"><button type="button" id="add-server" title="Register an ssh alias or set up a fresh machine">+</button></div>
    <div id="navlist"></div>
  </nav>
  <div class="server-pick" id="pick"></div>
  <main id="main"></main>
  <aside class="job" id="job" aria-label="Command output" hidden></aside>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" popover="manual"></div>
<div class="sr" id="sr-live" role="status"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s)) return "";
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}

// ---- state ---------------------------------------------------------------

const S = {
  state: null,           // /api/state
  sel: null,             // selected server name
  tab: "sites",
  overview: {},          // name -> {data} | {error} | {loading}
  firewall: {},
  history: {},
  updates: {},
  facts: {},
  settings: {},          // name -> {data: lf server config --json + dns of the main domain}
  dns: {},               // name -> {data: {ips, domains: [{domain, ips, ok, https}]}}
  open: new Set(),       // expanded site rows
  filter: "",            // server list filter
  jobs: new Map(),       // id -> {info, lines, after, actions, es}
  job: null,             // shown job id
};

async function http(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 401) throw new Error("This browser is not logged in. Open the link `lf ui` printed.");
  const data = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` }));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// One live region in the top layer, so it shows (and is announced) above an open dialog too.
// action: {label, run} adds a button, e.g. to open the job a toast is about.
let toastTimer;
function toast(msg, action) {
  const t = $("#toast");
  t.textContent = msg;
  if (action) {
    const b = Object.assign(document.createElement("button"), { type: "button", className: "sm", textContent: action.label });
    b.onclick = () => (hideToast(), action.run());
    t.append(b);
  }
  t.hidePopover?.();
  t.showPopover?.();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, Math.max(4000, msg.length * 70) + (action ? 4000 : 0));
}
function hideToast() {
  $("#toast").hidePopover?.();
}
$("#toast").onmouseenter = () => clearTimeout(toastTimer);
$("#toast").onmouseleave = () => (toastTimer = setTimeout(hideToast, 2000));
/** Tell screen readers about a change that has no visible text of its own. */
function say(text) {
  const r = $("#sr-live");
  r.textContent = "";
  setTimeout(() => (r.textContent = text), 50);
}

// Buttons call functions registered per render: data-k="<id>".
let handlers = new Map();
let hid = 0;
function on(fn) {
  const k = String(++hid);
  handlers.set(k, fn);
  return `data-k="${k}"`;
}
/** f: a key that stays the same across renders, so the button keeps its keyboard focus when redrawn. */
function btn(label, fn, cls = "", title = "", f = "") {
  return `<button type="button" class="${cls}" ${on(fn)}${title ? ` title="${esc(title)}"` : ""}${f ? ` data-f="${esc(f)}"` : ""}>${label}</button>`;
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-k]");
  // A click outside an open menu only closes it.
  if (menuEl && !menuEl.contains(e.target)) {
    closeMenu(false);
    e.preventDefault();
    return void e.stopPropagation();
  }
  if (!el || el.disabled) return;
  const fn = handlers.get(el.dataset.k);
  if (fn) {
    e.preventDefault();
    e.stopPropagation();
    fn(e, el);
  }
});

/**
 * A "⋯" button for the less used actions. items: [{label, run, cls, title, hint}] or "-" for a divider;
 * falsy items are skipped. The menu keeps its own handlers, so a render while it is open leaves it working.
 */
function menuBtn(items, title = "More actions", cls = "sm") {
  items = items.filter(Boolean);
  if (!items.length) return "";
  return btn("⋯", (e, el) => openMenu(el, items), `${cls} more`, title).replace("<button", `<button aria-haspopup="menu" aria-expanded="false" aria-label="${esc(title)}"`);
}
let menuAnchor = null;
let menuEl = null;
function openMenu(anchor, items) {
  closeMenu(false);
  menuAnchor = anchor;
  anchor.setAttribute("aria-expanded", "true");
  const m = Object.assign(document.createElement("div"), { id: "menu", className: "menu" });
  m.setAttribute("role", "menu");
  m.innerHTML = items
    .map((it, i) => it === "-" ? `<hr role="separator">` : `<button type="button" role="menuitem" data-i="${i}" class="${it.cls ?? ""}"${it.title ? ` title="${esc(it.title)}"` : ""}><span>${esc(it.label)}</span>${it.hint ? `<span class="k">${esc(it.hint)}</span>` : ""}</button>`)
    .join("");
  m.onclick = (e) => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    closeMenu();
    items[b.dataset.i].run();
  };
  m.onkeydown = (e) => {
    const all = [...m.querySelectorAll("button")];
    const i = all.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      all[(i + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus();
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      all[e.key === "Home" ? 0 : all.length - 1].focus();
    }
  };
  // Keep focus where it is on mousedown: a browser that does not focus clicked buttons would blur the menu and close it before the click.
  m.onmousedown = (e) => e.preventDefault();
  m.addEventListener("focusout", (e) => {
    if (!m.contains(e.relatedTarget)) closeMenu(false);
  });
  document.body.append(m);
  menuEl = m;
  const r = anchor.getBoundingClientRect();
  m.style.left = `${Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8))}px`;
  m.style.top = `${r.bottom + 4 + m.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4}px`;
  $("button", m)?.focus({ preventScroll: true });
}
/** restore: focus goes back to the "⋯" button (Esc, or an item that opens no dialog). */
function closeMenu(restore = true) {
  const m = menuEl;
  if (!m) return;
  // Removing the focused item fires focusout, which calls closeMenu again: clear menuEl first so that call is a no-op.
  menuEl = null;
  m.remove();
  menuAnchor?.setAttribute("aria-expanded", "false");
  if (restore && menuAnchor?.isConnected) menuAnchor.focus({ preventScroll: true });
  menuAnchor = null;
}
addEventListener("resize", () => closeMenu(false));
document.addEventListener("scroll", (e) => e.target.closest?.("#menu") || closeMenu(false), true);

// ---- routing: #/<server>/<tab> ---------------------------------------------

function go(sel, tab = S.tab) {
  const hash = sel ? `#/${encodeURIComponent(sel)}/${tab}` : "#/";
  if (location.hash !== hash) location.hash = hash;
  else route();
}
function route() {
  const [, name, tab] = location.hash.split("/");
  S.sel = name ? decodeURIComponent(name) : null;
  S.tab = tab in STORE ? tab : "sites";
  if (S.sel && server()) load(S.sel, S.tab);
  render();
}
window.addEventListener("hashchange", route);

// ---- loading -------------------------------------------------------------

const STORE = { sites: "overview", tunnels: "overview", traefik: "settings", facts: "facts", updates: "updates", firewall: "firewall", history: "history", settings: "settings" };
const URLS = { sites: "", tunnels: "", traefik: "/config", facts: "/facts", updates: "/updates", firewall: "/firewall", history: "/history", settings: "/config" };
// A server's sections, in the list and as tabs on phones; keys 1-7 switch between them.
const SECTIONS = [["sites", "Sites"], ["tunnels", "Tunnels"], ["traefik", "Traefik"], ["updates", "Updates"], ["firewall", "Firewall"], ["history", "History"], ["settings", "Settings"]];

// The overview and facts drive the header, so every tab needs them.
const needs = (tab) => (STORE[tab] === "overview" ? ["sites", "facts"] : ["sites", "facts", tab]);
function load(name, tab, force = false) {
  for (const t of needs(tab)) {
    const store = S[STORE[t]];
    if (store[name] && !force) continue;
    // Keep what is shown while it reloads; views show a spinner only when they have nothing yet.
    store[name] = { ...store[name], loading: true, error: undefined };
    http(`/api/servers/${encodeURIComponent(name)}${URLS[t]}`).then(
      (data) => ((store[name] = { data }), render()),
      (e) => ((store[name] = { error: e.message }), render()),
    );
  }
}
function invalidate(name) {
  delete S.dns[name];
  // What is on screen reloads in place; other tabs reload when opened.
  const shown = new Set(S.sel === name ? needs(S.tab).map((t) => STORE[t]) : []);
  for (const k of Object.values(STORE)) if (!shown.has(k)) delete S[k][name];
  if (S.sel === name) load(name, S.tab, true);
}
async function refreshState() {
  S.state = await http("/api/state");
  render();
}

// ---- jobs ----------------------------------------------------------------

/**
 * Run `lf <argv>` on the machine running lf ui; output streams into the side panel.
 * after(job) may return follow-up actions [{label, run, cls}] once it ends.
 */
async function run(argv, o = {}) {
  let info;
  try {
    info = await http("/api/jobs", { argv, server: o.server ?? S.sel ?? undefined, password: o.password, cwd: o.cwd });
  } catch (e) {
    return toast(e.message);
  }
  const j = { info, lines: [], after: o.after, actions: [] };
  S.jobs.set(info.id, j);
  S.job = info.id;
  stream(j);
  render();
  say(`Running lf ${argv.join(" ")}`);
}

function stream(j) {
  const es = new EventSource(`/api/jobs/${j.info.id}/events?from=${j.lines.length}`);
  j.es = es;
  es.onmessage = (e) => {
    const { from, lines } = JSON.parse(e.data);
    j.lines.length = Math.min(j.lines.length, from);
    j.lines.push(...lines);
    if (S.job === j.info.id) appendOutput(j);
    // A tunnel's address shows in the lists once it is up.
    if (isTunnel(j.info) && !j.url && (j.url = tunnelUrl(j))) render();
  };
  es.addEventListener("done", (e) => {
    es.close();
    j.info = JSON.parse(e.data);
    finished(j);
  });
  // Dropped connection while it still runs: pick up where it left off.
  es.onerror = () => {
    es.close();
    if (j.info.code === undefined) setTimeout(() => stream(j), 1000);
  };
}

function finished(j) {
  const { info } = j;
  const failed = info.code !== 0 && info.code !== null;
  j.actions = (j.after && j.after(j)) || [];
  // Safety checks refuse what would lock out ssh or break running services; --force overrides after reading why.
  if (failed && !info.argv.includes("--force") && j.lines.some((l) => l.includes("--force"))) {
    const why = j.lines.map((l) => l.replace(ANSI, "").trim()).filter(Boolean).slice(-4).join("\n");
    j.actions.push({
      label: "Do it anyway (--force)…",
      cls: "danger",
      run: () => confirmDlg({ title: "Override the safety check?", text: why, ok: "Run with --force", danger: true, onOk: () => run([...info.argv, "--force"], { server: info.server }) }),
    });
  }
  if (info.undoable && info.server && info.code !== null) {
    j.actions.push({
      label: "Undo this",
      run: () =>
        confirmDlg({
          title: `Undo \`lf ${info.argv.join(" ")}\`?`,
          text: `Reverts the changes this command recorded in the journal on ${info.server}.`,
          ok: "Undo it",
          onOk: () => run(["undo", info.id, "-s", info.server, "-y"], { server: info.server }),
        }),
    });
  }
  if (info.server) invalidate(info.server);
  refreshState().catch(() => {});
  render();
  const what = `lf ${info.argv.join(" ")} ${info.code === 0 ? "done" : info.code === null ? "stopped" : `failed (exit ${info.code})`}`;
  // Closed or showing another job: say so, with a way back to it.
  if (S.job !== info.id) toast(`${info.code === 0 ? "✓" : "✗"} ${what}`, { label: "Show", run: () => showJob(info.id) });
  else say(what);
}
function showJob(id) {
  S.job = id;
  render();
  $("#job .job-out")?.focus({ preventScroll: true });
}
const runningJobs = () => [...S.jobs.values()].filter((j) => j.info.code === undefined);
const isTunnel = (info) => info.argv[0] === "tunnel" || (info.argv[0] === "traefik" && info.argv[1] === "dashboard");
/** Tunnels the UI opened to server n that are still open. */
const openTunnels = (n) => runningJobs().filter((j) => j.info.server === n && isTunnel(j.info));
const tunnelUrl = (j) => j.lines.map((l) => l.replace(ANSI, "").match(/\b[a-z][a-z0-9+.-]*:\/\/localhost:\d+\S*/)?.[0]).find(Boolean);
/** With --lan: the addresses other devices on the network open it at. */
const lanUrls = (j) => j.lines.map((l) => l.replace(ANSI, "")).find((l) => /on your network:/.test(l))?.match(/\b[a-z][a-z0-9+.-]*:\/\/\S+/g) ?? [];
const closeTunnel = (j) => http(`/api/jobs/${j.info.id}/stop`, {}).catch((e) => toast(e.message));
/** argv plus --port, --local and --lan, picked in a dialog. ports: the ones the container listens on, if known. */
function tunnelOptions(n, argv, ports = []) {
  // A choice only when there is one to make: else free text, empty meaning the CLI's default.
  const port = ports.length > 1
    ? { name: "port", label: "Container port", type: "select", value: String(ports[0]), options: ports.map((p) => ({ value: String(p), label: String(p) })) }
    : { name: "port", label: "Container port", placeholder: ports[0] ? String(ports[0]) : "the one Traefik routes to, else the one it exposes", value: "" };
  dialog({
    title: argv[0] === "traefik" ? "Tunnel to the Traefik dashboard" : `Tunnel to ${argv.slice(1).filter((a, i, l) => a !== "-s" && l[i - 1] !== "-s").join(" · ")}`,
    text: `Forwards a port on this machine to it until you close it: lf ${argv.join(" ")}`,
    ok: "Open tunnel",
    fields: [
      ...(argv[0] === "tunnel" ? [port] : []),
      { name: "local", label: "Local port", placeholder: "the container's port, else a free one", value: "", hint: "Fails if something else listens on it." },
      { name: "lan", label: "Reachable from my network too", type: "check", value: false, hint: "Open it from a phone or another device on the same Wi-Fi. Anyone on that network can reach it." },
    ],
    onOk: (v) => {
      const isPort = (x) => /^\d+$/.test(x) && +x >= 1 && +x <= 65535;
      const to = v.port?.trim() ?? "", local = v.local.trim();
      if (to && !isPort(to)) return invalid("port", "A port from 1 to 65535");
      if (local && !isPort(local)) return invalid("local", "A port from 1 to 65535");
      run([...argv, ...(to ? ["--port", to] : []), ...(local ? ["-l", local] : []), ...(v.lan ? ["--lan"] : [])], { server: n });
    },
  });
}
/** Open a tunnel with argv, or, when it is open, its address and a way to close it. */
function tunnelBtn(n, argv, label = "Open tunnel", ports = []) {
  // Opened with options, the job's argv goes on after argv.
  const j = openTunnels(n).find((t) => t.info.argv.slice(0, argv.length).join(" ") === argv.join(" "));
  if (!j) return `${btn(label, () => run(argv, { server: n }), "sm", `lf ${argv.join(" ")}: until you close it`)}${btn("…", () => tunnelOptions(n, argv, ports), "sm ghost", "Pick the ports, or make it reachable from your network")}`;
  const url = tunnelUrl(j);
  // A database's address is for a client, not the browser.
  const link = (u) => u.startsWith("http://") ? `<a class="tunnel-url" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace("http://", ""))}</a>` : `<code class="tunnel-url" title="Connect a client to it">${esc(u)}</code>`;
  const lan = lanUrls(j);
  const addr = !url ? `<span class="spin" role="img" aria-label="opening"></span>` : link(url);
  return `${addr}${lan.length ? ` <span class="tunnel-lan" title="From other devices on your network">${lan.map(link).join(" ")}</span>` : ""}
    ${btn("Output", () => showJob(j.info.id), "sm ghost")}${btn("Close", () => closeTunnel(j), "sm danger", "Ends the tunnel")}`;
}

const ANSI = /\x1b\[[0-9;?]*[A-Za-z]/g;
function lineClass(l) {
  if (/^==> /.test(l)) return "c-cyan";
  if (/^\s*✓/.test(l)) return "c-green";
  if (/^\s*!/.test(l)) return "c-yellow";
  if (/^\s*(error|✗|FAIL)/i.test(l)) return "c-red";
  if (/^\$ /.test(l)) return "c-dim";
  return "";
}
function appendOutput(j) {
  const out = $("#job .job-out");
  if (!out) return;
  const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
  const shown = Number(out.dataset.n || 0);
  if (shown > j.lines.length) out.textContent = "";
  const frag = document.createDocumentFragment();
  for (const l of j.lines.slice(out.textContent ? shown : 0)) {
    const div = document.createElement("div");
    const text = l.replace(ANSI, "") || " ";
    // Addresses (a tunnel's localhost one, a deployed site) open in a new tab.
    for (const [i, part] of text.split(/(https?:\/\/[^\s)]+)/).entries()) {
      if (!(i % 2)) div.append(part);
      else div.append(Object.assign(document.createElement("a"), { href: part, textContent: part, target: "_blank", rel: "noopener" }));
    }
    const c = lineClass(text);
    if (c) div.className = c;
    frag.append(div);
  }
  out.append(frag);
  out.dataset.n = j.lines.length;
  if (atBottom) out.scrollTop = out.scrollHeight;
}

function renderJob() {
  const el = $("#job");
  const j = S.jobs.get(S.job);
  $("#app").classList.toggle("with-job", !!j);
  el.hidden = !j;
  if (!j) return;
  const { info } = j;
  const running = info.code === undefined;
  const status = running
    ? `<span class="spin"></span> running`
    : info.code === null
      ? `<span class="dim">stopped</span>`
      : info.code === 0
        ? `<span style="color:var(--ok)">✓ done</span>`
        : `<span style="color:var(--bad)">✗ failed (exit ${info.code})</span>`;
  const others = [...S.jobs.values()].reverse();
  const stop = () => {
    const doStop = () => http(`/api/jobs/${info.id}/stop`, {}).catch((e) => toast(e.message));
    if (!info.undoable) return doStop();
    confirmDlg({ title: `Stop lf ${info.argv[0]}?`, text: "What it changed so far stays. Undo it from History.", ok: "Stop it", danger: true, onOk: doStop });
  };
  // The output element stays across renders: rebuilding it would lose the reader's scroll position.
  let out = $(".job-out", el);
  const fresh = !out || out.dataset.job !== info.id;
  if (fresh) {
    out = Object.assign(document.createElement("div"), { className: "job-out", tabIndex: 0 });
    out.dataset.job = info.id;
    out.setAttribute("role", "region");
    out.setAttribute("aria-label", "Output");
  }
  el.innerHTML = `
    <div class="job-head">
      <span class="title" title="${esc("lf " + info.argv.join(" "))}">$ lf ${esc(info.argv.join(" "))}</span>
      ${btn("✕", () => ((S.job = null), render()), "ghost sm", "Close (Esc)", "job-close").replace("<button", `<button aria-label="Close output"`)}
    </div>
    <div class="job-out-slot"></div>
    <div class="job-foot">
      <span class="status">${status}</span>
      ${running ? btn("Stop", stop, "danger", info.undoable ? "Changes made so far stay" : "", "job-stop") : ""}
      ${(running ? [] : j.actions).map((a, i) => btn(esc(a.label), a.run, a.cls ?? (i === 0 ? "primary" : ""), "", `job-act:${a.label}`)).join("")}
    </div>
    ${others.length > 1 ? `<div class="joblist">${others
      .map((o) => {
        const [cls, ico] = o.info.code === undefined ? ["", "…"] : o.info.code === 0 ? ["ok", "✓"] : o.info.code === null ? ["", "■"] : ["bad", "✗"];
        return `<button type="button" class="${o.info.id === S.job ? "on" : ""}" data-f="job:${o.info.id}" ${on(() => showJob(o.info.id))}>
        <span class="${cls}">${ico}</span><span>lf ${esc(o.info.argv.join(" "))}</span></button>`;
      })
      .join("")}</div>` : ""}`;
  $(".job-out-slot", el).replaceWith(out);
  appendOutput(j);
  if (fresh) out.scrollTop = out.scrollHeight;
}

// ---- dialogs -------------------------------------------------------------

/**
 * A modal form. fields: [{name, label, value, type: text|password|textarea|select|check, options, hint, placeholder}].
 * onOk(values) runs on submit; return false to keep it open, or {field, error} to keep it open and show why.
 * typeToConfirm: a name the user types before the (dangerous) action is enabled.
 */
function dialog({ title, text = "", fields = [], ok = "OK", danger = false, onOk, extra = "", typeToConfirm = "" }) {
  const dlg = openDlg();
  const field = (f) => {
    const id = `f-${f.name}`;
    const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "";
    if (f.type === "check") {
      return `<label class="check"><input type="checkbox" id="${id}" name="${f.name}" ${f.value ? "checked" : ""}><span>${esc(f.label)}${hint}</span></label>`;
    }
    if (f.type === "select") {
      return `<label>${esc(f.label)}<select id="${id}" name="${f.name}">${f.options
        .map((o) => `<option value="${esc(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc(o.label)}</option>`)
        .join("")}</select>${hint}</label>`;
    }
    if (f.type === "password") return `<label>${esc(f.label)}${secretInput(id, f)}${hint}</label>`;
    if (f.type === "textarea") return `<label>${esc(f.label)}<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder)}">${esc(f.value)}</textarea>${hint}</label>`;
    return `<label>${esc(f.label)}<input id="${id}" name="${f.name}" type="${f.type || "text"}" value="${esc(f.value)}" placeholder="${esc(f.placeholder)}" autocomplete="off" spellcheck="false">${hint}</label>`;
  };
  const group = (f) => (f.legend ? `<fieldset><legend>${esc(f.legend)}</legend>${f.fields.map(field).join("")}</fieldset>` : field(f));
  dlg.innerHTML = `<form method="dialog" novalidate>
    <h2 id="dlg-title">${esc(title)}</h2>
    ${text ? `<div class="text">${esc(text)}</div>` : ""}
    ${extra}
    ${fields.map(group).join("")}
    ${typeToConfirm ? `<label>Type <b class="mono">${esc(typeToConfirm)}</b> to confirm<input id="dlg-confirm" autocomplete="off" spellcheck="false" autocapitalize="off"></label>` : ""}
    <div class="note bad dlg-err" id="dlg-err" role="alert" hidden></div>
    <div class="btns">
      <button type="button" value="cancel" class="ghost" id="dlg-cancel">Cancel</button>
      <button type="submit" value="ok" class="${danger ? "danger solid" : "primary"}">${esc(ok)}</button>
    </div>
  </form>`;
  const form = $("form", dlg);
  const submit = $("button[type=submit]", form);
  $("#dlg-cancel", dlg).onclick = () => dlg.close();
  if (typeToConfirm) {
    submit.disabled = true;
    $("#dlg-confirm", dlg).oninput = (e) => (submit.disabled = e.target.value.trim() !== typeToConfirm);
  }
  form.oninput = (e) => e.target.removeAttribute?.("aria-invalid");
  form.onsubmit = (e) => {
    e.preventDefault();
    if (submit.disabled) return;
    const values = {};
    for (const f of fields.flatMap((f) => f.fields ?? [f])) {
      const el = form.elements[f.name];
      values[f.name] = f.type === "check" ? el.checked : el.value;
    }
    const r = onOk(values);
    if (r === false) return;
    if (r?.error) {
      const err = $("#dlg-err", dlg), el = r.field && form.elements[r.field];
      err.textContent = r.error;
      err.hidden = false;
      el?.setAttribute("aria-invalid", "true");
      el?.focus();
      return;
    }
    // Empty before closing: browsers offer to save a password they still see when the form goes away.
    for (const el of form.querySelectorAll(".secret")) el.value = "";
    dlg.close();
  };
  dlg.showModal();
  // A dangerous confirm starts on Cancel, so a stray Enter does not delete anything.
  const first = $("input:not([type=checkbox]), textarea, select", form);
  (first || (danger ? $("#dlg-cancel", dlg) : submit)).focus();
}
const invalid = (field, error) => ({ field, error });
/** What is wrong with a login (lf newLogin's rules), as [field, message]. */
const loginError = (user, password) =>
  !/^[A-Za-z0-9._@-]{1,64}$/.test(user) ? ["user", "Only letters, digits and . _ @ -"]
  : password.length < 8 ? ["password", "The password needs at least 8 characters"]
  : null;
/**
 * Passwords here are for servers and sites, not for this page: a masked text field, so browsers
 * and password managers do not offer to save them. Browsers without text masking get a password field.
 */
const MASK = CSS.supports("-webkit-text-security", "disc");
const secretInput = (id, f) =>
  `<input id="${id}" name="${f.name}" class="secret" type="${MASK ? "text" : "password"}" value="${esc(f.value)}" placeholder="${esc(f.placeholder)}" autocomplete="${MASK ? "off" : "new-password"}" autocapitalize="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other">`;
/** The shared <dialog>, closed and reset so a new one can take its place. */
function openDlg(cls = "") {
  const dlg = $("#dlg");
  if (dlg.open) dlg.close();
  dlg.className = cls;
  return dlg;
}
const confirmDlg = (o) => dialog({ ...o, onOk: () => o.onOk() });
const promptDlg = (title, text, field, onOk, ok = "OK") => dialog({ title, text, fields: [{ name: "v", ...field }], ok, onOk: (v) => onOk(v.v.trim()) });

// ---- server flows ----------------------------------------------------------

const sv = (n) => ["-s", n];
const server = () => S.state?.servers.find((s) => s.name === S.sel);

function setupFlow(args, base = args) {
  run(["setup", ...args, "--check"], {
    server: args[0],
    after: (j) => {
      if (j.info.code !== 0) return;
      if (j.lines.some((l) => l.includes("no key login yet"))) {
        return [{ label: "Enter the password to install a key", run: () => passwordFor(args, base) }];
      }
      const todo = j.lines.filter((l) => /^\s+→ /.test(l)).length;
      return [
        { label: todo ? `Apply ${plural(todo, "change")}` : "Finish setup (nothing to install)", run: () => run(["setup", ...args, "-y"], { server: args[0] }) },
        { label: "Change options", run: () => setupWizard(base) },
      ];
    },
  });
}

function setupWizard(base) {
  const saved = S.state.servers.find((s) => s.name === base[0])?.saved ?? {};
  dialog({
    title: `Set up ${base[0]}`,
    text: "landfall first shows what it finds and what it would change. Nothing is applied before you confirm.",
    ok: "Check",
    fields: [
      {

        fields: [
          {
            name: "traefik", label: "Mode", type: "select", value: saved.hostNetwork ? "host" : "docker",
            options: [
              { value: "docker", label: "Own Traefik, ports published by Docker" },
              { value: "host", label: "Own Traefik on the host network (real client IPs, ufw guards 80/443)" },

          },

          { name: "dashboard", label: "Dashboard domain (optional)", value: "", placeholder: "traefik.example.com", hint: "Behind basic auth; the password is shown after setup." },
          { name: "http3", label: "HTTP/3 (QUIC on 443/udp)", type: "check", value: saved.http3 !== false, hint: "Browsers that can't use it fall back to HTTP/2." },
        ],
      },
      { name: "firewall", label: "Enable ufw: deny incoming except ssh, 80 and 443", type: "check", value: true, hint: "Skipped automatically if it would block ports in use." },
      { name: "harden", label: "Key login only (turn off ssh passwords)", type: "check", value: true, hint: "Skipped automatically if other users still log in with a password." },

function passwordFor(args, base) {
  const host = args.includes("--host") ? `root@${args[args.indexOf("--host") + 1]}` : S.state.servers.find((s) => s.name === args[0])?.target ?? args[0];

    { type: "password", label: "Password" },

          return [{ label: "Try the password again", run: () => passwordFor(args, base) }];

function addServer() {
  dialog({
    title: "Add a server",
    text: "Use an alias from ~/.ssh/config (like vps), or pick a new name and give the machine's address, fresh or already in use. landfall writes the ssh config entry for it.",
    fields: [
      { name: "name", label: "Name", placeholder: "vps" },
      { name: "host", label: "IP or hostname (not needed for an ssh alias)", placeholder: "203.0.113.7" },
      {
        legend: "Login (for a new address)",
        fields: [
          { name: "user", label: "User", placeholder: "root" },
          { name: "port", label: "SSH port", placeholder: "22" },
          { name: "key", label: "Private key file (optional)", placeholder: "~/.ssh/id_ed25519", hint: "Without one, landfall creates ~/.ssh/landfall_<name> and installs it with the password." },
          { name: "password", label: "Password (optional)", type: "password", hint: "Used once to install the key, never stored. Leave empty if the key already works." },
        ],
      },
      { name: "setup", label: "Set it up now (shows what it would change first)", type: "check", value: true },
    ],
    ok: "Add",
    onOk: (v) => {
      const [name, host, user, port, key] = [v.name, v.host, v.user, v.port, v.key].map((x) => x.trim());
      if (!name) return invalid("name", "Give the server a name");
      const known = S.state.servers.some((s) => s.name === name);
      if (!known && !host) return invalid("host", `${name} is not in your ssh config: give its IP or hostname`);
      if (port && !/^\d+$/.test(port)) return invalid("port", "The port is a number");
      const args = [name, ...(host ? ["--host", host] : []), ...(user ? ["-u", user] : []), ...(port ? ["-p", port] : []), ...(key ? ["-i", key] : [])];
      // With a password: install the key now, then the setup wizard needs nothing but the alias.
      const then = (j) => (j.info.code === 0 ? void (v.setup ? setupWizard([name]) : go(name)) : undefined);
      if (v.password) run(["server", "add", ...args], { server: name, password: v.password, after: then });
      else if (v.setup) setupWizard(args);
      else run(["server", "add", ...args], { server: name, after: () => void go(name) });
    },
  });
}

const defaultServer = () => S.sel ?? S.state.servers.find((s) => s.isDefault)?.name;

/** What `lf deploy` picks without a domain: <site>.<main domain>, else the free sslip.io address. */
function autoDomain(n, name) {
  const main = mainDomain(n);

// Dropped folders: walk the entries (skipping dependencies and VCS data), then upload with relative paths.
const SKIP = new Set(["node_modules", ".git", ".DS_Store", "__MACOSX"]);
const skipped = (rel) => rel.split("/").some((x) => SKIP.has(x));
async function droppedFiles(roots) {
  const out = [];
  const walk = async (entry, prefix) => {
    if (SKIP.has(entry.name)) return;
    if (entry.isFile) out.push([await new Promise((res, rej) => entry.file(res, rej)), prefix + entry.name]);
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (let batch; (batch = await new Promise((res, rej) => reader.readEntries(res, rej))).length; ) {
        for (const e of batch) await walk(e, `${prefix}${entry.name}/`);
      }
    }
  };
  for (const r of roots) await walk(r, "");
  return out;
}

async function upload(pairs, label = "site") {
  if (!pairs.length) return toast("Nothing to upload");
  const fd = new FormData();
  for (const [f, path] of pairs) fd.append("file", f), fd.append("path", path);
  toast(`Uploading ${plural(pairs.length, "file")}…`);
  try {
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const data = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` }));
    if (!r.ok) throw new Error(data.error);
    toast(`Uploaded ${plural(data.files, "file")}`);
    deployDialog(data.detected, { upload: true, files: data.files, name: slugify(label) });
  } catch (e) {
    toast(`Upload failed: ${e.message}`);
  }
}

const hasFiles = (e) => [...(e.dataTransfer?.types ?? [])].includes("Files");
window.addEventListener("dragover", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  document.body.classList.add("dragging");
});
window.addEventListener("dragleave", (e) => {
  if (!e.relatedTarget) document.body.classList.remove("dragging");
});
window.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  document.body.classList.remove("dragging");
  // Entries must be taken while the event is live.
  const roots = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry?.()).filter(Boolean);
  const label = roots[0]?.name ?? e.dataTransfer.files[0]?.name;
  const files = roots.length ? droppedFiles(roots) : Promise.resolve([...e.dataTransfer.files].map((f) => [f, f.name]));
  files.then((pairs) => upload(pairs, label), (err) => toast(err.message));
});

  dialog({
    title: `Password for ${m.name}`,
    text: users.length
      ? `Visitors log in as ${users.join(", ")}. Saving an existing user changes their password.`
      : "Visitors have to log in (HTTP basic auth) before they see the site.",
    fields: [
      { name: "user", label: "User", value: users[0] ?? "admin" },
      { name: "password", label: "Password (at least 8 characters)", type: "password", auto: "new-password" },
      ...(users.length ? [{ name: "off", label: "Remove the login: the site is public again", type: "check", value: false }] : []),
    ],
    ok: "Save",
    onOk: (v) => {
      if (v.off) return void run(["auth", m.name, ...sv(n), "--off", "-y"], { server: n });
      const user = v.user.trim() || "admin";
      const bad = loginError(user, v.password);
      if (bad) return invalid(...bad);
      run(["auth", m.name, ...sv(n), "-u", user, "-p", v.password], { server: n });
    },
  });
}

function ensureDns(n, o) {
  if (S.dns[n] || !o?.sites.length) return;
  const domains = [...new Set(o.sites.flatMap((x) => x.domains))];
  S.dns[n] = { loading: true };
  http(`/api/servers/${encodeURIComponent(n)}/dns?domains=${encodeURIComponent(domains.join(","))}`).then(
    (data) => ((S.dns[n] = { data }), render()),
    (e) => ((S.dns[n] = { error: e.message }), render()),
  );
}

function domainChip(n, d) {
  const c = S.dns[n]?.data?.domains.find((x) => x.domain === d);
  const url = `https://${d}`;
  let dot = "", title = "checking…";
  if (c) {
    const st = c.https.status;
    if (!c.ips.length) (dot = "down"), (title = "DNS: does not resolve");
    else if (!c.ok) (dot = "warn"), (title = `DNS points at ${c.ips.join(", ")}, not this server`);
    else if (st && st < 500) (dot = "up"), (title = `HTTPS ${st}${st === 401 ? " (login required)" : ""}`);
    else (dot = "down"), (title = `HTTPS: ${st ?? c.https.error}`);
  }
  return `<span class="chip"><span class="dot ${dot}" title="${esc(title)}"></span><a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title)}" onclick="event.stopPropagation()">${esc(d)}</a>${btn("⧉", () => copy(url), "ghost", "Copy the address")}</span>`;
}

function runCommand(n) {
  promptDlg(`Run a command on ${n}`, "Runs through ssh as the server's login; output shows on the right.", { label: "Command", placeholder: "df -h", type: "text" }, (cmd) => {
    if (cmd) run(["ssh", n, "--", cmd], { server: n });
  }, "Run");
}

function forget(n) {
  confirmDlg({
    title: `Forget ${n}?`,
    text: "Removes it from landfall (and the Host block landfall wrote to ~/.ssh/config).\nNothing on the server is changed.",
    ok: `Forget ${n}`,
    danger: true,
    typeToConfirm: n,
    onOk: () => run(["server", "rm", n, "-y"], { server: n, after: (j) => (j.info.code === 0 ? void go(null) : undefined) }),
  });
}

async function makeDefault(n) {
  try {
    await http(`/api/servers/${encodeURIComponent(n)}/default`, {});
    await refreshState();
    toast(`${n} is now the default server`);
  } catch (e) {
    toast(e.message);
  }
}

function errorHint(error) {
  if (/permission denied/i.test(error)) return "No key login yet. Use Set up: landfall asks for the password once and installs a key.";
  if (/resolve|not known|nodename/i.test(error)) return "Host name not found. Check the entry in ~/.ssh/config.";
  if (/timed out|refused|no route|unreachable/i.test(error)) return "Server not reachable. Is it running, and is the ssh port right?";
  return "";
}

const isUp = (status) => /^up/i.test(status);
// A one-off service that finished (Exited (0)) is not down: grey, not red.
const statusDot = (status) => {
  const [cls, word] = isUp(status) ? (/unhealthy|restarting/i.test(status) ? ["warn", "unhealthy"] : ["up", "running"]) : /^exited \(0\)/i.test(status) ? ["", "finished"] : ["down", "down"];
  return `<span class="dot ${cls}" role="img" aria-label="${word}" title="${esc(status)}"></span>`;
};

const size = (b) => {
  const u = ["B", "K", "M", "G", "T"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) (b /= 1024), i++;
  return `${b < 10 && i ? b.toFixed(1) : Math.round(b)}${u[i]}`;
};
const uptime = (s) => {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  return d ? `${d}d ${h}h` : h ? `${h}h` : `${Math.floor(s / 60)}m`;
};

function factsLine(n) {
  const f = S.facts[n]?.data;
  if (!f) return "";
  const pct = (used, total) => (total ? Math.round((used / total) * 100) : 0);
  const disk = pct(f.disk.used, f.disk.total);
  const items = [
    `<b>${esc(f.os)}</b> ${esc(f.arch)}`,
    `<span title="kernel ${esc(f.kernel)}">up ${uptime(f.uptime)}</span>`,
    f.cpus ? `${f.cpus} CPU · load ${esc(f.load.split(" ")[0])}` : "",
    f.mem.total ? `RAM ${size(f.mem.total - f.mem.available)} / ${size(f.mem.total)}` : "",
    f.disk.total ? `<span ${disk > 85 ? `style="color:var(--warn)"` : ""}>disk ${disk}% of ${size(f.disk.total)}</span>` : "",
    f.docker ? `docker ${esc(f.docker)}` : `<span class="faint">no docker</span>`,
    f.reboot ? `<span class="badge warn">reboot required</span>` : "",
  ];
  return `<div class="facts">${items.filter(Boolean).map((x) => `<span>${x}</span>`).join("")}</div>`;
}

function factsNote(n) {
  const sup = S.facts[n]?.data?.support;
  if (!sup?.note) return "";
  return `<div class="note ${sup.level === "ok" ? "" : "bad"}">${esc(sup.note)}</div>`;
}

              .sort((a, b) => (a.at < b.at ? 1 : -1))
              .map((r) => `<li><span class="mono">${esc(r.id)}</span><span class="dim">${esc(ago(r.at))}</span>${r.services ? `<span class="faint">${esc(r.services.map((x) => x.name).join(", "))}</span>` : ""}
                ${r.id === m.current ? `<span class="badge ok">live</span>` : managed ? btn("Switch to this", () => confirmDlg({ title: `Switch ${name} to ${r.id}?`, text: `Release from ${ago(r.at)} goes live instead of ${m.current}. Volumes keep their data.`, ok: "Switch", onOk: () => run(["rollback", name, ...sv(n), "--to", r.id, "-y"]) }), "sm") : ""}</li>`)
              .join("")}</ul></dd>` : ""}
          </dl></td></tr>`
        : "";
      // A site deployed with no domain is reached by its tunnel.
      const where = domains.length ? domains.map((d) => domainChip(n, d)).join("") : main && !old ? `<span class="faint">no domain</span> ${tunnelBtn(n, ["tunnel", name, ...sv(n)])}` : "";
      return `<tr class="click" ${on(toggle)}>
        <td><div class="site-name">${statusDot(status)}<button type="button" class="row-toggle" aria-expanded="${open}" data-f="row:${esc(name)}" ${on(toggle)}><b>${esc(name)}</b> <span class="faint" aria-hidden="true">${open ? "▾" : "▸"}</span></button>${m.auth?.length ? `<span class="lock" title="password protected" role="img" aria-label="password protected">🔒</span>` : ""}</div>
          <div class="chips show-sm">${where}</div></td>
        <td class="hide-sm"><div class="chips">${where}</div></td>
        <td class="hide-sm"><span class="badge" title="${esc(services.map((x) => x.service).join(", "))}">${esc(kind)}</span>${services.length > 1 ? ` <span class="faint">${services.length} services</span>` : ""}</td>
        <td class="hide-sm dim">${cur ? esc(ago(cur.at)) : ""}</td>
        <td class="acts">${acts}</td></tr>${detail}`;
    })
    .join("");
  return `<div class="card scroll"><table>
    <thead><tr><th>Site</th><th class="hide-sm">Domains</th><th class="hide-sm">Kind</th><th class="hide-sm">Deployed</th><th><span class="sr">Actions</span></th></tr></thead>
    <tbody>${rows}</tbody></table></div>${othersCard(n, o)}`;
}

/** Where a site lives on the server: docker compose works in its current folder. */
function siteFiles(m, state) {
  const dir = `${S.state.paths.sites}/${m.name}`;

function envDialog(n, name) {

    title: `Environment of ${name}`,

// ---- updates ---------------------------------------------------------------

const IMG = { current: ["ok", "up to date"], update: ["warn", "newer image"], unknown: ["", "unknown"], pinned: ["", "pinned"], rebuild: ["", "rebuild"], foreign: ["", "not landfall's"], missing: ["bad", "missing"] };

function updatesBadge(n) {
  const d = S.updates[n]?.data;
  if (!d) return "";
  const k = d.packages.updates.length + d.images.filter((i) => i.state === "update").length;
  const sec = d.packages.updates.some((u) => u.security);
  return k ? ` <span class="badge ${sec ? "warn" : ""}">${k}</span>` : "";
}

function refreshUpdates(n) {
  S.updates[n] = { loading: true, refreshing: true };
  render();
  http(`/api/servers/${encodeURIComponent(n)}/updates?refresh=1`).then(
    (data) => ((S.updates[n] = { data }), render()),
    (e) => ((S.updates[n] = { error: e.message }), render()),
  );
}

function updatesView(n) {
  const st = S.updates[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> ${st.refreshing ? "refreshing package lists…" : "checking packages and images…"}</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div><div class="actions" style="margin:0">${btn("Retry", () => (load(n, "updates", true), render()))}</div>`;
  const { packages: p, images, engine: e } = st.data;
  const s = sv(n);
  const sec = p.updates.filter((u) => u.security);
  const upgrade = (flags, what, k) =>
    confirmDlg({
      title: `Upgrade ${what} on ${n}?`,
      text: `${plural(k, "package")} through ${p.mgr}, as root. Package upgrades cannot be undone.${flags.includes("--reboot") ? "\nReboots afterwards if the upgrade needs it: sites are offline for a minute or two." : ""}`,
      ok: "Upgrade",
      danger: flags.includes("--reboot"),
      onOk: () => run(["update", "--packages", ...flags, ...s, "-y"], { server: n }),
    });
  const pkgActs = [
    btn("Refresh lists", () => refreshUpdates(n), "sm", "Fetch the newest package lists first (apt update)"),
    sec.length && p.mgr !== "apk" ? btn(`Security only (${sec.length})`, () => upgrade(["--security"], "security updates", sec.length), "sm") : "",
    p.updates.length ? btn("Upgrade all", () => upgrade([], "all packages", p.updates.length), "sm primary") : "",
    p.updates.length ? btn("Upgrade + reboot", () => upgrade(["--reboot"], "all packages", p.updates.length), "sm danger") : "",
  ].join("");
  const shown = p.updates.slice(0, 200);
  const pkgRows = shown
    .map((u) => `<tr><td class="mono">${esc(u.name)}</td><td class="mono dim hide-sm">${esc(u.from ?? "")}</td><td class="mono">${esc(u.to)}</td><td>${u.security ? `<span class="badge warn">security</span>` : ""}</td></tr>`)
    .join("");
  const imgUpdates = images.filter((i) => i.state === "update");
  const updImg = (names) =>
    confirmDlg({
      title: `Update ${names.join(", ")}?`,
      text: "Pulls the newer image and recreates the container (a few seconds offline). Undo puts the old image back.",
      ok: "Update",
      onOk: () => run(["update", ...names, "--images", ...s, "-y"], { server: n }),
    });
  const imgRows = images
    .map((i) => {
      const [cls, label] = IMG[i.state] ?? ["", i.state];
      const can = i.state === "update" || i.state === "unknown";
      return `<tr><td><b>${esc(i.name)}</b> <span class="faint">${esc(i.kind)}</span></td><td class="mono dim hide-sm">${esc(i.ref || "-")}</td>
        <td><span class="badge ${cls}">${esc(label)}</span></td><td class="dim hide-sm">${esc(i.note ?? "")}</td>
        <td class="acts">${can ? btn(i.state === "update" ? "Update" : "Pull anyway", () => updImg([i.name]), i.state === "update" ? "sm primary" : "sm") : ""}</td></tr>`;
    })
    .join("");
  const head = p.mgr === "none"
    ? `<span class="dim" style="font-weight:400">no supported package manager</span>`
    : p.updates.length
      ? `<span class="badge">${p.updates.length}</span>${sec.length ? ` <span class="badge warn">${sec.length} security</span>` : ""}`
      : `<span class="badge ok">up to date</span>`;
  return `
    <div class="card">
      <h2>Packages ${head}${p.reboot ? ` <span class="badge warn">reboot required</span>` : ""}
        <span class="dim hide-sm" style="font-weight:400">${esc(p.mgr)}${p.refreshed ? "" : " · lists not refreshed"}</span>
        <span class="actions">${pkgActs}</span></h2>
      ${pkgRows ? `<div class="scroll"><table>
        <thead><tr><th>Package</th><th class="hide-sm">Installed</th><th>New</th><th></th></tr></thead>
        <tbody>${pkgRows}${p.updates.length > shown.length ? `<tr><td colspan="4" class="dim">… ${p.updates.length - shown.length} more</td></tr>` : ""}</tbody>
      </table></div>` : ""}
    </div>
    <div class="card">
      <h2>Docker <span class="badge ${!e.docker || e.dockerNote || e.composeNote ? "warn" : "ok"}">${e.docker ? `${esc(e.docker)} · compose ${esc(e.compose || "missing")}` : "not installed"}</span>
        <span class="actions">${e.composeUpdate ? btn("Update compose", () => run(["update", "--compose", ...s, "-y"], { server: n }), "sm primary") : ""}</span></h2>
      ${[e.dockerNote, e.composeNote].filter(Boolean).map((t) => `<p class="dim">${esc(t)}</p>`).join("")}
    </div>
    <div class="card">
      <h2>Images <span class="dim" style="font-weight:400">Traefik and sites</span>
        <span class="actions">${imgUpdates.length ? btn(`Update all (${imgUpdates.length})`, () => updImg(imgUpdates.map((i) => i.name)), "sm primary") : ""}</span></h2>
      <div class="scroll"><table>
        <thead><tr><th>Name</th><th class="hide-sm">Image</th><th>State</th><th class="hide-sm">Note</th><th></th></tr></thead>
        <tbody>${imgRows || `<tr><td colspan="5" class="dim">no containers</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

const REACH = { open: "ok", limited: "accent", blocked: "bad", local: "" };

function firewallView(n) {
  const st = S.firewall[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> reading the firewall…</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const fw = st.data;
  const s = sv(n);
  const fwRun = (argv) => run(argv, { server: n });
  const active = fw.ufw === "active";
  const toggle =
    fw.ufw === "missing"
      ? btn("Install & enable ufw", () => fwRun(["firewall", "enable", ...s]), "primary")
      : active
        ? btn("Turn off", () => confirmDlg({ title: `Turn the firewall on ${n} off?`, text: "Every listening port becomes reachable from anywhere.", ok: "Turn it off", danger: true, onOk: () => fwRun(["firewall", "disable", ...s, "-y"]) }), "danger")
        : btn("Turn on", () => fwRun(["firewall", "enable", ...s]), "primary");
  const badge = active ? `<span class="badge ok">on</span>` : fw.ufw === "missing" ? `<span class="badge warn">ufw not installed</span>` : `<span class="badge bad">off</span>`;
  const blocked = !active && fw.blocked.length
    ? `<div class="note">Turning it on would cut off ${esc(fw.blocked.join(", "))}: add rules for them first, or landfall refuses (with a way to do it anyway).</div>`
    : "";
  const ruleRows = fw.rules
    .map((r, i) => {
      const num = String(i + 1);
      const flip = r.action === "deny" || r.action === "reject" ? "allow" : "deny";
      const cls = r.action === "allow" ? "ok" : r.action === "limit" ? "accent" : "bad";
      const port = r.port ? `${r.port}${r.proto ? `/${r.proto}` : ""}` : "";
      return `<tr>
        <td class="faint">${num}</td>
        <td>${btn(`<span class="badge ${cls}">${esc(r.action)}${r.out ? " out" : ""}</span>`, () => confirmDlg({ title: `Switch rule ${num} to ${flip}?`, text: `${r.spec}${r.from ? ` from ${r.from}` : ""}`, ok: `Switch to ${flip}`, danger: flip === "deny", onOk: () => fwRun(["firewall", "update", r.spec, "--action", flip, ...s]) }), "ghost sm", `Switch to ${flip}`)}</td>
        <td class="mono">${esc(port || r.spec)}</td>
        <td>${r.from ? `<span class="mono">${esc(r.from)}</span>` : `<span class="dim">anywhere</span>`}</td>
        <td class="dim hide-sm">${esc(r.comment ?? "")}</td>
        <td class="acts">${btn("Edit", () => editRule(n, num, r), "sm")}${btn("Remove", () => confirmDlg({ title: `Remove rule ${num}?`, text: r.spec, ok: "Remove it", danger: true, onOk: () => fwRun(["firewall", "rm", r.spec, ...s, "-y"]) }), "sm danger")}</td>
      </tr>`;
    })
    .join("");
  const portRows = fw.ports
    .map((p) => `<tr><td class="mono">${esc(p.port)}</td><td>${esc(p.proc)}</td><td><span class="badge ${REACH[p.state] ?? ""}">${esc(p.state)}</span></td><td class="dim">${esc(p.why)}</td></tr>`)
    .join("");
  return `
    ${blocked}
    <div class="card">
      <h2>ufw ${badge} <span class="dim" style="font-weight:400">incoming default: ${esc(fw.policy.toLowerCase())} · ssh on ${esc(fw.sshPort)}${fw.asRoot ? " · as root" : ""}</span>
        <span class="actions">${toggle}</span></h2>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th>Action</th><th>Port</th><th>From</th><th class="hide-sm">Comment</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody>${ruleRows || `<tr><td colspan="6" class="dim">no rules</td></tr>`}</tbody>
      </table></div>
      <div class="body" style="border-top:1px solid var(--line)">
        <form class="form-row" id="addrule">
          <label>Port <input name="port" placeholder="5432, 51820/udp, 6000:6007/tcp" required></label>
          <label>From <input name="from" placeholder="anywhere, or 10.0.0.0/8"></label>
          <label style="flex:0 0 110px">Action <select name="action"><option value="allow">allow</option><option value="deny">deny</option></select></label>
          <button type="submit" class="primary">Add rule</button>
        </form>
      </div>
    </div>
    <div class="card">
      <h2>Listening ports <span class="dim" style="font-weight:400">and whether the internet reaches them</span></h2>
      <div class="scroll"><table>
        <thead><tr><th>Port</th><th>Process</th><th>Reach</th><th>Why</th></tr></thead>
        <tbody>${portRows || `<tr><td colspan="4" class="dim">nothing listening</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

document.addEventListener("submit", (e) => {
  if (e.target.id !== "addrule") return;
  e.preventDefault();
  const f = e.target.elements;
  const port = f.port.value.trim();
  if (!port) return;
  const from = f.from.value.trim();
  const action = f.action.value;
  e.target.reset();
  run(["firewall", action, port, ...sv(S.sel), ...(from && from !== "anywhere" ? ["--from", from] : [])], { server: S.sel });
});

function editRule(n, num, r) {
  const port = r.port ? `${r.port}${r.proto ? `/${r.proto}` : ""}` : "";
  dialog({
    title: `Edit rule ${num}`,
    text: r.spec,
    fields: [
      { name: "port", label: "Port", value: port, placeholder: "port[/proto]" },
      { name: "from", label: "From", value: r.from ?? "", placeholder: "anywhere", hint: "An address or network like 10.0.0.0/8. Empty = anyone." },
      { name: "action", label: "Action", type: "select", value: r.action, options: ["allow", "deny", "reject", "limit"].map((a) => ({ value: a, label: a })) },
    ],
    ok: "Save",
    onOk: (v) => {
      // By its text, not its number: numbers shift when another firewall command lands first.
      const argv = ["firewall", "update", r.spec, ...sv(n)];
      if (v.port.trim() && v.port.trim() !== port) argv.push("--port", v.port.trim());
      argv.push("--from", v.from.trim() || "any");
      if (v.action !== r.action) argv.push("--action", v.action);
      run(argv, { server: n });
    },
  });
}

/** Everything an SSH tunnel reaches on server n, and the tunnels open now. */
function tunnelsView(n, o) {
  if (!o.ready && !o.others.length && !o.unrouted?.length) return `<div class="card"><div class="body empty"><h2>Nothing to tunnel to yet</h2><p>Set up the server and deploy a site first.</p></div></div>`;
  const open = openTunnels(n);
  const chips = (l) => `<div class="chips">${l.map((d) => `<span class="chip">${esc(d)}</span>`).join("")}</div>`;
  const targets = [];
  const dashArgv = ["traefik", "dashboard", ...sv(n)];
  targets.push({ name: "Traefik dashboard", status: o.traefik, serves: o.dashboard.hosts, argv: o.dashboard.tunnel ? dashArgv : null, why: "no tunnel yet: see Traefik" });
  for (const x of o.sites) {
    if (x.state === "old") continue;
    // One row per service when a site has several: each is its own container.
    const many = x.services.length > 1;
    if (!many) targets.push({ name: x.meta.name, status: x.status, serves: x.domains, argv: ["tunnel", x.meta.name, ...sv(n)] });
    else for (const svc of x.services) targets.push({ name: `${x.meta.name} · ${svc.service}`, status: svc.status, serves: svc.service === x.main ? x.domains : [], argv: ["tunnel", x.meta.name, svc.service, ...sv(n)] });
  }
  for (const e of o.others) targets.push({ name: e.name, status: e.status, serves: e.domains, argv: ["tunnel", e.name, ...sv(n)], other: true });
  // Databases, workers: by Compose project and service, else by container name.
  const loose = (o.unrouted ?? []).map((x) => ({ name: x.container, status: x.status, image: x.image, ports: x.ports ?? [], serves: [], argv: ["tunnel", ...(x.project ? [x.project, x.service] : [x.container]), ...sv(n)] }));
  const row = (t) => `<tr><td><div class="site-name">${t.status ? statusDot(t.status) : ""}<b>${esc(t.name)}</b>${t.other ? `&nbsp;<span class="faint">not landfall's</span>` : ""}</div><div class="show-sm">${chips(t.serves)}</div></td>
      <td class="hide-sm">${chips(t.serves)}</td>
      <td class="acts">${t.argv ? tunnelBtn(n, t.argv) : `<span class="dim">${esc(t.why)}</span> ${btn("Traefik", () => go(n, "traefik"), "sm")}`}</td></tr>`;
  return `${open.length ? `<div class="card scroll"><h2>Open <span class="badge ok">${open.length}</span></h2><table><tbody>${open
      .map((j) => `<tr><td><b class="mono">lf ${esc(j.info.argv.filter((a, i, l) => a !== "-s" && l[i - 1] !== "-s").join(" "))}</b></td><td class="acts">${tunnelBtn(n, j.info.argv)}</td></tr>`)
      .join("")}</tbody></table></div>` : ""}
    <div class="card scroll"><h2>Tunnel to</h2>
      <div class="lede">An SSH tunnel forwards a port on this machine to a container on ${esc(n)}: test a site on localhost with no domain, HTTPS or login. Nothing changes on the server, and closing the tunnel ends it.</div>
      <table><thead><tr><th>Container</th><th class="hide-sm">Domains</th><th><span class="sr">Tunnel</span></th></tr></thead><tbody>${targets.map(row).join("")}</tbody></table></div>
    ${loose.length ? `<div class="card scroll"><h2>Other containers <span class="badge">${loose.length}</span></h2>
      <div class="lede">Running, but no domain routes to them: databases, caches, workers. The tunnel goes to the port their image exposes.</div>
      <table><thead><tr><th>Container</th><th class="hide-sm">Image</th><th><span class="sr">Tunnel</span></th></tr></thead><tbody>${loose
        .map((t) => `<tr><td><div class="site-name">${statusDot(t.status)}<b>${esc(t.name)}</b></div><div class="show-sm faint mono">${esc(t.image)}</div></td><td class="hide-sm faint mono">${esc(t.image)}</td><td class="acts">${tunnelBtn(n, t.argv, undefined, t.ports)}</td></tr>`)
        .join("")}</tbody></table></div>` : ""}`;
}

/** Traefik on server n: its dashboard (domain and tunnel) and how landfall runs it. */
function traefikView(n) {
  const st = S.settings[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> reading the settings…</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const x = st.data;
  const reload = { server: n, after: (j) => (j.info.code === 0 ? void (load(n, "traefik", true), render()) : undefined) };
  const rows = (pairs) => `<dl class="kv">${pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const P = S.state.paths;
  const dashboard = () =>
    dialog({
      title: `Traefik dashboard on ${n}`,
      text: "Serves the dashboard on a domain behind a login. Without one it stays reachable through an SSH tunnel only (Open via tunnel).\nRuns lf traefik setup, which reconfigures landfall's Traefik.",
      fields: [
        { name: "domain", label: "Domain", value: x.traefik.dashboard ?? "", placeholder: x.domains[0] ? `traefik.${x.domains[0]}` : "traefik.example.com", hint: x.traefik.dashboard ? "Empty: take the dashboard off its domain." : "Needs an A record pointing at the server." },
        { name: "user", label: "Login user", value: "admin", placeholder: "admin" },
        { name: "password", label: "Login password (at least 8 characters)", type: "password", hint: x.traefik.dashboard ? "Empty: keeps the current one." : "Empty: a generated one, shown in the output." },
      ],
      ok: "Apply",
      onOk: (v) => {
        const d = v.domain.trim();
        const user = v.user.trim() || "admin";
        if (!d && !x.traefik.dashboard) return invalid("domain", "Give a domain, or use the tunnel");
        const bad = d && loginError(user, v.password || "generated");
        if (bad) return invalid(...bad);
        const argv = ["traefik", "setup", ...sv(n), "--dashboard", d || "off"];
        if (d) argv.push("--dashboard-user", user, ...(v.password ? ["--dashboard-password", v.password] : []));
        run(argv, reload);
      },
    });
  const traefikDialog = () =>
    dialog({
      title: `Traefik on ${n}`,
      text: "Runs lf traefik setup, which reconfigures landfall's Traefik and restarts it (a few seconds without traffic). The settings are remembered.",
      fields: [
        { name: "http3", label: "HTTP/3 (QUIC on 443/udp)", type: "check", value: x.traefik.http3, hint: "Faster on lossy and mobile connections; browsers that can't use it fall back to HTTP/2." },
        {
          name: "mode", label: "Ports", type: "select", value: x.traefik.hostNetwork ? "host" : "docker",
          options: [
            { value: "docker", label: "Published by Docker (default)" },
            { value: "host", label: "Host network: real client IPs, ufw guards 80/443" },
          ],
        },
        { name: "image", label: "Image", value: x.traefik.image, placeholder: S.state.defaultImage },
        { name: "email", label: "Let's Encrypt e-mail (optional)", value: x.traefik.email ?? "", hint: "Only the account contact; Let's Encrypt no longer mails expiry warnings." },
        { name: "staging", label: "Let's Encrypt staging CA (test certificates, browsers warn)", type: "check", value: x.traefik.staging },
      ],
      ok: "Apply",
      onOk: (v) => {
        const argv = ["traefik", "setup", ...sv(n), v.http3 ? "--http3" : "--no-http3", v.mode === "host" ? "--host-network" : "--no-host-network", v.staging ? "--staging" : "--no-staging"];
        if (v.image.trim()) argv.push("--image", v.image.trim());
        if (v.email.trim()) argv.push("--email", v.email.trim());
        run(argv, reload);
      },
    });
  // lf traefik setup refuses to touch a Traefik the server already had.
  const o = S.overview[n]?.data;
  const foreign = o?.adopted ? o.proxy : "";
  const dash = o?.dashboard ?? { hosts: x.traefik.dashboard ? [x.traefik.dashboard] : [], tunnel: false };
  const link = (h) => `<a href="https://${esc(h)}" target="_blank" rel="noopener">${esc(h)}</a>`;
  const dashArgv = ["traefik", "dashboard", ...sv(n)];
  return `
    <div class="card">
      <h2>Dashboard <span class="actions">${foreign ? "" : btn(dash.hosts.length ? "Domain & login…" : "Put on a domain…", dashboard, "sm")}</span></h2>
      <div class="body">${rows([
        ["domain", dash.hosts.length ? `${dash.hosts.map(link).join(", ")} <span class="dim">(with its login)</span>` : `<span class="dim">none${foreign ? "" : ": only through the tunnel"}</span>`],
        ["tunnel", dash.tunnel
          ? `${tunnelBtn(n, dashArgv, "Open via tunnel")} <span class="dim">lf traefik dashboard</span>`
          : foreign ? `<span class="dim">route its dashboard (api@internal) to a domain, or run <span class="mono">lf traefik dashboard --port &lt;its api port&gt;</span></span>`
          : `<span class="dim">set up by an older landfall</span> ${btn("Enable tunnel", () => run(["traefik", "setup", ...sv(n)], reload), "sm", "Re-runs lf traefik setup, which adds it")}`],
      ])}</div>
    </div>
    <div class="card">
      <h2>Traefik <span class="actions">${btn("Status", () => run(["traefik", "status", ...sv(n)]), "sm", "lf traefik status")}${foreign ? "" : btn("Settings…", traefikDialog, "sm")}</span></h2>
      <div class="body">${foreign ? `<div class="note">Sites go through <b class="mono">${esc(foreign)}</b>, a Traefik landfall did not install and never changes: it is configured in its own files.</div>` : ""}${rows([
        ["image", esc(x.traefik.summary)],
        ["e-mail", esc(x.traefik.email ?? "none")],
        ["HTTP/3", x.traefik.http3 ? `on <span class="dim">(443/udp)</span>` : `<span class="dim">off</span>`],
        ["files", `<span class="mono">${esc(P.traefik)}/docker-compose.yml</span>`],
        ["certificates", `<span class="mono">${esc(P.traefik)}/letsencrypt/</span> <span class="dim">(kept on reinstall)</span>`],
      ])}<p class="faint">Used when landfall installs or reconfigures its own Traefik. With a Traefik that was already there, landfall only writes <span class="mono">${esc(P.proxy)}</span>.</p></div>
    </div>`;
}

function settingsView(n) {
  const st = S.settings[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> reading the settings…</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const x = st.data;
  const reload = { server: n, after: (j) => (j.info.code === 0 ? void (load(n, "settings", true), render()) : undefined) };
  const rows = (pairs) => `<dl class="kv">${pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const dnsRow = (d) => `${esc(d.domain)} ${d.ok ? `<span class="badge ok">dns ok</span>` : d.ips.length ? `<span class="badge warn">dns → ${esc(d.ips.join(", "))}</span>` : `<span class="badge bad">no dns</span>`}`;
  const addDomain = () =>
    promptDlg(`Add a main domain to ${n}`, `${x.domains.length ? "The first main domain stays the primary." : "The first main domain is the primary: new sites get <site>.<domain>, and a bare name like blog means blog.<domain>."}\nPoint <domain> and *.<domain> (A records) at the server once.`, { label: "Domain", placeholder: "example.com", type: "text", value: "" }, (d) => {
      if (d) run(["server", "domain", n, "--add", d], reload);
    }, "Add");
  const sites = S.overview[n]?.data?.sites ?? [];
  const external = (d) => S.overview[n]?.data?.others?.find((e) => e.domains.includes(d))?.name;
  const servedBy = (d) => sites.find((s) => s.domains.includes(d))?.meta.name;
  const serve = (d) => {
    const cur = servedBy(d);
    // Only sites whose domains landfall sets; the others name theirs in compose.yaml.
    const pick = sites.filter((s) => s.main && s.meta.name !== cur);
    if (!pick.length) return void toast(cur ? `${cur} is the only site on ${n}` : `No sites on ${n} yet: deploy one with @ as its domain`);
    dialog({
      title: `Serve a site on ${d}`,
      text: cur ? `${cur} serves ${d} now; it moves to the site you pick, which keeps its other domains.` : `The site keeps its other domains. ${d} needs an A record pointing at the server.`,
      fields: [{ name: "site", label: "Site", type: "select", options: pick.map((s) => ({ value: s.meta.name, label: `${s.meta.name} (${s.domains.join(", ")})` })), value: pick[0].meta.name }],
      ok: "Serve it",
      onOk: (v) => run(["domains", v.site, ...sv(n), "--add", d, "-y"], { server: n, after: (j) => (j.info.code === 0 ? void (load(n, "settings", true), load(n, "sites", true), render()) : undefined) }),
    });
  };
  const P = S.state.paths;
  const ip = x.dns[0]?.ips[0] ?? "<server ip>";
  const records = x.dns.flatMap((r) => [r.apex, r.wildcard]).filter((d) => !d.ok).map((d) => `${esc(d.domain)}  A  ${esc(ip)}`);
  const saved = x.saved ? Object.entries(x.saved).filter(([k, v]) => v !== undefined && k !== "dashboard").map(([k, v]) => [k, `<span class="mono">${esc(String(v))}</span>`]) : [];
  return `
    <div class="card">
      <h2>Main domains <span class="actions">${btn("Add domain…", addDomain, "sm")}</span></h2>
      <div class="body">${x.domains.length
        ? `${x.domains.map((d, i) => `<div class="drow">
             <div>${dnsRow(x.dns[i].apex)}${i === 0 ? ` <span class="badge accent">primary</span>` : ""}<div class="dim">sites: ${dnsRow(x.dns[i].wildcard)}</div><div class="faint">${servedBy(d) ? `served by <b>${esc(servedBy(d))}</b>` : external(d) ? `served by <b>${esc(external(d))}</b> (not landfall)` : "no site serves it"}</div></div>
             <div class="actions">${btn(servedBy(d) ? "Serve another site…" : "Serve a site…", () => serve(d), "sm")}${menuBtn([
               i ? { label: "Make primary", hint: "--primary", run: () => run(["server", "domain", n, "--primary", d], reload) } : null,
               { label: `Remove ${d}…`, cls: "danger", hint: "--rm", run: () => confirmDlg({ title: `Remove ${d} from ${n}?`, text: "New sites stop getting names under it. Sites keep their domains.", ok: "Remove it", danger: true, onOk: () => run(["server", "domain", n, "--rm", d, "-y"], reload) }) },
             ], `More for ${d}`)}</div>
           </div>`).join("")}
           <p class="faint">New sites get <span class="mono">&lt;site&gt;.${esc(x.domains[0])}</span>; a bare name like <span class="mono">blog</span> means <span class="mono">blog.${esc(x.domains[0])}</span>, and <span class="mono">@</span> means <span class="mono">${esc(x.domains[0])}</span> itself.</p>
           ${records.length ? `<div class="note">Add at your DNS provider:<div class="mono">${records.join("<br>")}</div></div>` : ""}`
        : `<p class="dim">No main domain set in landfall. New sites get a free <span class="mono">&lt;site&gt;.&lt;ip&gt;.sslip.io</span> address until you set one.</p>`}
        ${x.suggest.length ? `<div class="note">${x.domains.length ? "Other domains" : "Domains"} your sites on this server already use: ${x.suggest.map((g) => `<b>${esc(g.domain)}</b> <span class="faint">(${g.hosts})</span> ${btn("Add", () => run(["server", "domain", n, "--add", g.domain], reload), "sm")}`).join(" ")}</div>` : ""}</div>
    </div>
    <div class="card">
      <h2>On the server <span class="dim mono" style="font-weight:400">${esc(P.root)}</span></h2>
      <div class="body">${rows([
        ["sites", `<span class="mono">${esc(P.sites)}/&lt;site&gt;/</span> <span class="dim">one folder per site: releases, compose file, .env</span>`],
        ["traefik", `<span class="mono">${esc(P.traefik)}/</span>`],
        ["history", `<span class="mono">${esc(P.journal)}</span> <span class="dim">every change with its undo</span>`],
      ])}</div>
    </div>
    <div class="card">
      <h2>landfall config <span class="dim mono" style="font-weight:400">${esc(x.configFile)}</span></h2>
      <div class="body">${saved.length ? rows(saved) : `<p class="dim">Not registered — an ssh alias landfall reads from ~/.ssh/config.</p>`}</div>
    </div>
    <div class="card">
      <h2>SSH <span class="dim mono" style="font-weight:400">ssh -G ${esc(x.saved?.host ?? n)}</span></h2>
      <div class="body">${rows([
        ["login", `<span class="mono">${esc(`${x.ssh.user}@${x.ssh.hostname}:${x.ssh.port}`)}</span>`],
        ...x.ssh.keys.map((k) => ["key", `<span class="mono">${esc(k.file)}</span>${k.exists ? "" : ` <span class="badge bad">missing</span>`}`]),
      ])}
      ${x.ssh.block
        ? `<p class="dim">${esc(x.ssh.block.file)}:${x.ssh.block.line} · ${x.ssh.block.managed ? "written by landfall" : "your own"}</p><pre class="mono block">${esc(x.ssh.block.text)}</pre>`
        : `<p class="dim">No Host block; ssh uses its defaults.</p>`}</div>
    </div>`;
}

function historyView(n) {
  const st = S.history[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> reading the journal…</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const runs = st.data;
  if (!runs.length) return `<div class="card"><div class="body empty"><h2>Nothing yet</h2><p>Every change landfall makes on ${esc(n)} is logged here, with a way to undo it.</p></div></div>`;
  const s = sv(n);
  const undo = (argv) => run(["undo", ...argv, ...s, "-y"], { server: n });
  const total = runs.reduce((a, r) => a + r.pending, 0);
  const items = runs
    .map((r) => {
      const todo = r.steps.filter((x) => x.undo && !x.undone);
      const later = runs.filter((x) => x.n > r.n && x.pending);
      const undoRun = () =>
        dialog({
          title: `Undo #${r.n} ${r.cmd} on ${n}?`,
          text: [...todo.map((x) => `↺ ${x.what}`).reverse(), ...(later.length ? ["", `Later runs build on it and stay: ${later.map((x) => `#${x.n}`).join(", ")}`] : [])].join("\n"),
          ok: `Revert ${plural(todo.length, "change")}`,
          danger: true,
          onOk: () => undo([String(r.n)]),
        });
      const steps = r.steps
        .map((x, i) => {
          const [cls, ico] = x.reverts ? ["fixed", "↩"] : x.undone ? ["undone", "✓"] : x.undo ? ["", "↺"] : ["fixed", "·"];
          const one = x.undo && !x.undone
            ? btn("undo", () => confirmDlg({ title: `Undo step ${r.n}.${i + 1}?`, text: x.what, ok: "Undo it", danger: true, onOk: () => undo([`${r.n}.${i + 1}`]) }), "ghost sm")
            : "";
          return `<li class="${cls}"><span class="ico">${ico}</span><span class="what">${esc(x.what)}</span>${!x.undo && !x.reverts ? `<span class="faint">(not reversible)</span>` : ""}${x.undone ? `<span class="faint">(undone)</span>` : ""}${one}</li>`;
        })
        .join("");
      return `<div class="run">
        <div class="top"><b>#${r.n}</b><span class="cmd">${esc(r.cmd || "?")}</span><span class="dim">${esc(ago(r.time))}</span>
          <span class="faint mono hide-sm">${esc(r.actor)} · ${esc(r.id)}</span>
          <span class="actions">${r.pending ? btn(`Undo ${plural(r.pending, "change")}`, undoRun, "sm") : `<span class="faint">nothing to undo</span>`}</span></div>
        <ul class="steps">${steps}</ul></div>`;
    })
    .join("");
  return `
    <div class="card">
      <h2>Journal <span class="dim" style="font-weight:400">/opt/landfall/journal.log · newest first</span>
        <span class="actions">${total ? btn("Undo everything", () => confirmDlg({ title: `Undo everything landfall did on ${n}?`, text: `${plural(total, "change")}, newest first. Sites, Traefik, the deploy user and landfall's firewall rules go away.`, ok: "Revert everything", danger: true, typeToConfirm: n, onOk: () => undo(["--all"]) }), "sm danger") : ""}</span></h2>
      ${items}
    </div>`;
}

// ---- top level -----------------------------------------------------------

function render() {
  if (!S.state) return;
  // Every render re-registers the buttons it draws (dialogs wire their own buttons).
  handlers = new Map();
  const scroll = $("#main").scrollTop;
  // innerHTML drops the focused button: find its redrawn twin by its data-f key.
  const f = document.activeElement?.dataset?.f;
  // So is what someone was typing into the add-rule form.
  const form = $("#addrule"), typed = form && [...form.elements].filter((el) => el.name).map((el) => [el.name, el.value]);
  const typing = form?.contains(document.activeElement) && document.activeElement.name;
  renderHeader();
  renderNav();
  renderMain();
  renderJob();
  $("#main").scrollTop = scroll;
  const again = typed && $("#addrule");
  if (again) {
    for (const [k, v] of typed) again.elements[k].value = v;
    if (typing) again.elements[typing].focus({ preventScroll: true });
  }
  if (f && !document.activeElement?.closest?.("#dlg, #menu")) [...document.querySelectorAll("[data-f]")].find((el) => el.dataset.f === f)?.focus({ preventScroll: true });
  document.title = S.sel ? `${S.sel} · ${S.tab} · landfall` : "landfall";
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && menuEl) return closeMenu();
  // 1-7: the open server's sections.
  const sec = SECTIONS[Number(e.key) - 1];
  if (sec && S.sel && !e.metaKey && !e.ctrlKey && !e.altKey && !$("#dlg").open && !e.target.closest?.("input, textarea, select")) return go(S.sel, sec[0]);
  if (e.key === "Escape" && !$("#dlg").open && S.job && !e.target.closest?.("input, textarea, select")) {
    S.job = null;
    render();
  }
});

$("#filter").addEventListener("input", (e) => {
  S.filter = e.target.value.trim();
  renderNav();
});
$("#add-server").onclick = () => addServer();

(async () => {
  try {
    await refreshState();
    // Jobs started before a reload keep running on the server: list them, and show one still running.
    const old = [];
    for (const info of S.state.jobs.slice().reverse()) {
      const j = { info, lines: [], actions: [] };
      S.jobs.set(info.id, j);
      if (info.code === undefined) stream(j);
      else old.push(j);
    }
    S.job = S.state.jobs.find((j) => j.code === undefined)?.id ?? null;
    route();
    // Finished jobs' output only matters once someone opens them: fetch it after the page is up.
    for (const j of old) {
      http(`/api/jobs/${j.info.id}`).then((full) => {
        j.lines = full.lines;
        if (S.job === j.info.id) render();
      }, () => {});
    }
  } catch (e) {
    $("#main").innerHTML = `<div class="empty"><h2>lf ui</h2><p>${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
