function errorHint(error) {
  if (/permission denied/i.test(error)) return "No key login yet. Use Set up: landfall asks for the password once and installs a key.";
  if (/resolve|not known|nodename/i.test(error)) return "Host name not found. Check the entry in ~/.ssh/config.";
  if (/timed out|refused|no route|unreachable/i.test(error)) return "Server not reachable. Is it running, and is the ssh port right?";
  return "";
}

const isUp = (status) => /^up/i.test(status);
// A one-off service that finished (Exited (0)) is not down: grey, not red.
const statusDot = (status) => {
  const [cls, word] = isUp(status) ? (/unhealthy|restarting/i.test(status) ? ["warn", "unhealthy"] : ["up", "running"]) : /^exited \(0\)/i.test(status) ? ["", "finished"] : ["down", "down"];
  return `<span class="dot ${cls}" role="img" aria-label="${word}" title="${esc(status)}"></span>`;
};

const size = (b) => {
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) (b /= 1024), i++;
  return `${b < 10 && i ? b.toFixed(1) : Math.round(b)} ${u[i]}`;
};
const uptime = (s) => {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  return d ? `${d}d ${h}h` : h ? `${h}h` : `${Math.floor(s / 60)}m`;
};

function factsLine(n) {
  const f = S.facts[n]?.data;
  if (!f) return "";
  const pct = (used, total) => (total ? Math.round((used / total) * 100) : 0);
  const disk = pct(f.disk.used, f.disk.total);
  const items = [
    `<b>${esc(f.os)}</b> ${esc(f.arch)}`,
    `<span title="kernel ${esc(f.kernel)}">up ${uptime(f.uptime)}</span>`,
    f.cpus ? `${f.cpus} CPU · load ${esc(f.load.split(" ")[0])}` : "",
    f.mem.total ? `RAM ${size(f.mem.total - f.mem.available)} / ${size(f.mem.total)}` : "",
    f.disk.total ? `<span ${disk > 85 ? `style="color:var(--warn)"` : ""}>disk ${disk}% of ${size(f.disk.total)}</span>` : "",
    f.docker ? `docker ${esc(f.docker)}` : `<span class="faint">no docker</span>`,
    f.reboot ? `<span class="badge warn">reboot required</span>` : "",
  ];
  return `<div class="facts">${items.filter(Boolean).map((x) => `<span>${x}</span>`).join("")}</div>`;
}

function factsNote(n) {
  const f = S.facts[n]?.data;
  const sup = f?.support;
  // A system that installs its own way (DSM, SteamOS) is not a problem, just a different kind of server.
  if (!sup?.note) return "";
  return `<div class="note ${sup.level === "eol" || sup.level === "unsupported" ? "bad" : ""}">${esc(sup.note)}${f.can && !f.can.docker ? `. Docker: ${esc(f.why.docker)}` : ""}</div>`;
}

  } else if (!o) view.innerHTML = "";

  else if (S.tab === "firewall") view.innerHTML = firewallView(n);
  else if (S.tab === "system") view.innerHTML = systemView(n);

function sitesView(n, o) {
  ensureDns(n, o);
  if (!o.ready && can(n) && !can(n).setup) {
    return `<div class="card"><div class="body empty"><h2>Not ready for sites</h2>
      <p>${esc(S.facts[n]?.data?.why?.setup ?? "")}, so landfall cannot set it up: sites need ${esc("/opt/landfall")} and Traefik, which setup creates.</p></div></div>`;
  }
  if (!o.ready) {
    return `<div class="card"><div class="body empty"><h2>Not set up for landfall yet</h2>
      <p>Setup installs Docker and Traefik, a deploy user and (if you want) a firewall. It shows what it would change first.</p>
      <p>${btn("Check & set up", () => setupFlow([n]), "primary")}</p></div></div>`;
  }
  if (!o.sites.length) {
    return `<div class="card"><div class="body empty"><h2>No sites yet</h2>
      <p>Deploy a folder with a compose.yaml, a Dockerfile, static files, or an image. It gets HTTPS automatically.</p>
      <p>${btn("Deploy a folder…", () => folderDialog(S.state.cwd), "primary")} <span class="dim">or drop one here</span></p>
      <p class="faint mono">lf deploy ./dist -d example.com -s ${esc(n)}</p></div></div>${othersCard(n, o)}`;
  }
  const rows = o.sites
    .map(({ meta: m, status, services, domains, main, state, kind }) => {
      const cur = m.releases.find((r) => r.id === m.current);
      const name = m.name;
      const open = S.open.has(`${n}/${name}`);
      const up = isUp(status);
      const old = state === "old";
      // Adopted and pre-Compose sites: landfall runs them, it does not deploy them.
      const managed = state === "managed";
      const older = [...m.releases].sort((a, b) => (a.at < b.at ? 1 : -1)).filter((r) => r.at < (cur?.at ?? ""));
      const proj = (S.state.projects ?? []).find((p) => p.server === n && p.name === name);
      const deleteSite = () =>
        dialog({
          title: m.adopted ? `Stop and forget ${name}?` : `Delete ${name} from ${n}?`,
          text: m.adopted
            ? `Runs docker compose down in ${m.adopted}; its files and volumes stay.`
            : "Stops it and removes its files and releases. Its named volumes (databases, uploads) stay unless you delete them too.\nThis cannot be undone.",
          fields: m.adopted ? [] : [{ name: "volumes", type: "check", label: "Also delete its volumes", hint: "Databases, uploads: all its data. lf sites rm --volumes" }],
          ok: m.adopted ? `Forget ${name}` : `Delete ${name}`,
          danger: true,
          typeToConfirm: m.adopted ? "" : name,
          onOk: (v) => run(["sites", "rm", name, ...sv(n), "-y", ...(v.volumes ? ["--volumes"] : [])]),
        });
      const svcMenu = (x) =>
        menuBtn([
          { label: "Logs", hint: `lf logs ${name} ${x.service}`, run: () => run(["logs", name, x.service, ...sv(n), "-f"]) },
          { label: "Restart", hint: "lf restart", run: () => run(["restart", name, x.service, ...sv(n)]) },
          isUp(x.status)
            ? { label: "Stop…", hint: "lf stop", run: () => confirmDlg({ title: `Stop ${x.service} of ${name}?`, text: "It stays stopped until you start it again.", ok: "Stop it", danger: true, onOk: () => run(["stop", name, x.service, ...sv(n)]) }) }
            : { label: "Start", hint: "lf start", run: () => run(["start", name, x.service, ...sv(n)]) },
        ], `${x.service} of ${name}`, "sm ghost");
      const editBuild = () => buildSettings(proj.path, { server: n, name, domains: m.domains ?? [], old });
      const acts = [
        proj && !m.adopted
          ? btn("Redeploy", () => confirmDlg({ title: `Redeploy ${name}?`, text: `From ${tilde(proj.path)}${proj.kind === "static" ? " (runs its build first, if it has one)" : ""}.`, ok: "Deploy", onOk: () => run(["deploy", "-y", ...sv(n)], { server: n, cwd: proj.path, after: openAfter }) }), "sm primary", `lf deploy in ${proj.path}`)
          : m.adopted || m.kind === "image" ? ""
          : btn("Redeploy…", () => folderDialog(S.state.cwd, { server: n, name, domains: m.domains ?? [], old }), "sm", "Pick the folder it was deployed from"),
        old ? "" : btn("Logs", () => run(["logs", name, ...sv(n), "-f"]), "sm", "Follow the logs of all its services"),
        menuBtn([
          old ? null : { label: "Restart", hint: "lf restart", run: () => run(["restart", name, ...sv(n)]) },
          old ? null
          : up ? { label: "Stop…", hint: "lf stop", run: () => confirmDlg({ title: `Stop ${name}?`, text: `${domains.join(", ") || "The site"} stops answering until you start it again.`, ok: "Stop it", danger: true, onOk: () => run(["stop", name, ...sv(n)]) }) }
          : { label: "Start", hint: "lf start", run: () => run(["start", name, ...sv(n)]) },
          managed && older.length
            ? { label: "Roll back…", hint: "lf rollback", title: `To ${older[0].id} (${ago(older[0].at)})`, run: () => confirmDlg({ title: `Roll back ${name}?`, text: `From ${m.current} to ${older[0].id} (${ago(older[0].at)}). Volumes keep their data.`, ok: "Roll back", onOk: () => run(["rollback", name, ...sv(n), "-y"]) }) }
            : null,
          "-",
          old ? null : { label: "Open via tunnel", hint: "lf tunnel", title: "An SSH tunnel straight to the container: test it on localhost, no domain needed", run: () => run(["tunnel", name, ...sv(n)], { server: n }) },
          main ? { label: "Domains…", hint: "lf domains", run: () => domainsDialog(n, m) } : null,
          managed ? { label: m.auth?.length ? "Login…" : "Password…", hint: "lf auth", title: "Protect the site with a user and password", run: () => authDialog(n, m) } : null,
          managed ? { label: "Environment…", hint: "lf env", run: () => envDialog(n, name) } : null,
          proj && !m.adopted ? { label: "Build settings…", hint: "lf deploy --build --start", title: "What it builds and starts with, its port, static or Node.js", run: editBuild } : null,
          "-",
          { label: m.adopted ? `Forget ${name}…` : `Delete ${name}…`, cls: "danger", hint: "lf sites rm", run: deleteSite },
        ], `More for ${name}`),
      ].join("");
      const toggle = () => (open ? S.open.delete(`${n}/${name}`) : S.open.add(`${n}/${name}`), render());
      const live = m.releases?.find((r) => r.id === m.current);
      const svcDomains = (svc) => (svc === main ? m.domains : (live?.services?.find((x) => x.name === svc)?.domains ?? []));
      const det = open && proj && !m.adopted ? detected(proj.path) : undefined;
      const detail = open
        ? `<tr class="detail"><td colspan="5"><dl class="kv">
            ${old ? `<dt>Old site</dt><dd class="dim">Deployed before sites were Compose projects: ${proj ? "redeploy it" : `run <span class="mono">lf deploy</span> for it`} once to manage it again.</dd>` : ""}
            <dt>Services</dt><dd>${services.length
              ? `<ul class="services">${services.map((x) => `<li>${statusDot(x.status)}<b>${esc(x.service)}</b>${svcDomains(x.service).length ? ` <span class="badge">${esc(svcDomains(x.service).join(" "))}</span>` : ""} <span class="faint">${esc(x.status.toLowerCase())}</span>${old ? "" : svcMenu(x)}</li>`).join("")}</ul>`
              : `<span class="dim">none running</span>`}</dd>
            <dt>On ${esc(n)}</dt><dd>${siteFiles(m, state)}</dd>
            ${m.adopted ? "" : `<dt>Source</dt><dd>${proj
              ? `<span class="mono">${esc(tilde(proj.path))}</span> <span class="dim">· redeploy runs there</span>`
              : `<span class="dim">not deployed from this machine${m.kind === "image" ? "" : " (or the folder moved): Redeploy… picks the folder"}</span>`}</dd>`}
            ${det !== undefined ? `<dt>Build</dt><dd>${det ? `${describe(det, false)} ${btn("Edit…", editBuild, "sm ghost", "Build settings: lf deploy --build --start")}` : `<span class="faint">${det === false ? "cannot read its folder" : "reading its folder…"}</span>`}</dd>` : ""}
            <dt>Kind</dt><dd>${esc(kind)}${main || !managed ? "" : ` <span class="dim">· domains set in compose.yaml</span>`}</dd>
            ${managed ? `<dt>Login</dt><dd>${m.auth?.length ? `${esc(m.auth.map((a) => a.split(":")[0]).join(", "))} (basic auth)` : `<span class="dim">public</span>`}</dd>` : ""}
            <dt>Created</dt><dd>${esc(ago(m.createdAt))} · updated ${esc(ago(m.updatedAt))}</dd>
            ${m.releases.length ? `<dt>Releases</dt><dd><ul class="releases">${[...m.releases]
              .sort((a, b) => (a.at < b.at ? 1 : -1))
              .map((r) => `<li><span class="mono">${esc(r.id)}</span><span class="dim">${esc(ago(r.at))}</span>${r.services ? `<span class="faint">${esc(r.services.map((x) => x.name).join(", "))}</span>` : ""}
                ${r.id === m.current ? `<span class="badge ok">live</span>` : managed ? btn("Switch to this", () => confirmDlg({ title: `Switch ${name} to ${r.id}?`, text: `Release from ${ago(r.at)} goes live instead of ${m.current}. Volumes keep their data.`, ok: "Switch", onOk: () => run(["rollback", name, ...sv(n), "--to", r.id, "-y"]) }), "sm") : ""}</li>`)
              .join("")}</ul></dd>` : ""}
          </dl></td></tr>`
        : "";
      // A site deployed with no domain is reached by its tunnel.
      const where = domains.length ? domains.map((d) => domainChip(n, d)).join("") : main && !old ? `<span class="faint">no domain</span> ${tunnelBtn(n, ["tunnel", name, ...sv(n)])}` : "";
      return `<tr class="click" ${on(toggle)}>
        <td><div class="site-name">${statusDot(status)}<button type="button" class="row-toggle" aria-expanded="${open}" data-f="row:${esc(name)}" ${on(toggle)}><b>${esc(name)}</b> <span class="faint" aria-hidden="true">${open ? "▾" : "▸"}</span></button>${m.auth?.length ? `<span class="lock" title="password protected" role="img" aria-label="password protected">🔒</span>` : ""}</div>
          <div class="chips show-sm">${where}</div></td>
        <td class="hide-sm"><div class="chips">${where}</div></td>
        <td class="hide-sm"><span class="badge" title="${esc(services.map((x) => x.service).join(", "))}">${esc(kind)}</span>${services.length > 1 ? ` <span class="faint">${services.length} services</span>` : ""}</td>
        <td class="hide-sm dim">${cur ? esc(ago(cur.at)) : ""}</td>
        <td class="acts">${acts}</td></tr>${detail}`;
    })
    .join("");
  return `<div class="card scroll"><table>
    <thead><tr><th>Site</th><th class="hide-sm">Domains</th><th class="hide-sm">Kind</th><th class="hide-sm">Deployed</th><th><span class="sr">Actions</span></th></tr></thead>
    <tbody>${rows}</tbody></table></div>${errorsCard(n)}${othersCard(n, o)}`;
}

/** Where a site lives on the server: docker compose works in its current folder. */
function siteFiles(m, state) {
  const dir = `${S.state.paths.sites}/${m.name}`;
  if (m.adopted) return `<span class="mono">${esc(m.adopted)}</span><div class="dim">its own folder; project <span class="mono">${esc(m.project ?? m.name)}</span></div>`;
  if (state === "old") return `<span class="mono">${esc(dir)}</span>`;
  return `<span class="mono">${esc(dir)}/current</span> <span class="dim">→ releases/${esc(m.current)}</span>
    <div class="faint mono">compose.yaml · compose.override.yaml (landfall's) · .env (mode 600)</div>
    <div class="faint">run it by hand: <span class="mono">cd ${esc(dir)}/current && docker compose ps</span></div>`;
}

function adoptDialog(n, e) {
  dialog({
    title: `Adopt ${e.name}?`,
    text: `${e.name} keeps running from ${e.dir} with its own files and Traefik labels. landfall lists it as a site with logs, restart, stop and start; it does not deploy it or change its domains.`,
    fields: [{ name: "name", label: "Site name", value: e.name.toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+/, "") }],
    ok: "Adopt",
    onOk: (v) => run(["adopt", e.name, ...sv(n), "--name", v.name.trim()], { server: n }),
  });
}

function envDialog(n, name) {
  dialog({
    title: `Environment of ${name}`,
    text: "Changes recreate the container. Leave both empty to only show the current values.",
    fields: [
      { name: "set", label: "Set (KEY=VALUE, one per line)", type: "textarea", value: "", placeholder: "DATABASE_URL=postgres://…\nLOG_LEVEL=info" },
      { name: "unset", label: "Remove (names, space separated)", value: "", placeholder: "OLD_KEY" },
    ],
    ok: "Apply",
    onOk: (v) => {
      const pairs = v.set.split("\n").map((l) => l.trim()).filter((l) => l && l.includes("="));
      const unset = v.unset.split(/[\s,]+/).filter(Boolean).flatMap((k) => ["-u", k]);
      run(["env", name, ...sv(n), ...pairs, ...unset]);
    },
  });
}

// ---- updates ---------------------------------------------------------------

const IMG = { current: ["ok", "up to date"], update: ["warn", "newer image"], unknown: ["", "unknown"], pinned: ["", "pinned"], rebuild: ["", "rebuild"], foreign: ["", "not landfall's"], missing: ["bad", "missing"] };

function updatesBadge(n) {
  const d = S.updates[n]?.data;
  if (!d) return "";
  const k = d.packages.updates.length + d.images.filter((i) => i.state === "update").length;
  const sec = d.packages.updates.some((u) => u.security);
  return k ? ` <span class="badge ${sec ? "warn" : ""}">${k}</span>` : "";
}

function refreshUpdates(n) {
  S.updates[n] = { loading: true, refreshing: true };
  render();
  http(`/api/servers/${encodeURIComponent(n)}/updates?refresh=1`).then(
    (data) => ((S.updates[n] = { data }), render()),
    (e) => ((S.updates[n] = { error: e.message }), render()),
  );
}

/** "24.0.2 → 29.9.2 · how to get it", or "· newest" when it is (and the newest is known). */
const engineLine = (have, latest, old, how) =>
  `<span class="mono">${esc(have)}</span>${old ? ` <span class="dim">→</span> <span class="mono">${esc(latest)}</span>${how ? ` <span class="faint">· ${esc(how)}</span>` : ""}` : latest ? ` <span class="faint">· newest</span>` : ""}`;

function updatesView(n) {
  const st = S.updates[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> ${st.refreshing ? "refreshing package lists…" : "checking packages and images…"}</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div><div class="actions" style="margin:0">${btn("Retry", () => (load(n, "updates", true), render()))}</div>`;
  const { packages: p, images, engine: e } = st.data;
  const s = sv(n);
  const sec = p.updates.filter((u) => u.security);
  const upgrade = (flags, what, k) =>
    confirmDlg({
      title: `Upgrade ${what} on ${n}?`,
      text: `${plural(k, "package")} through ${p.mgr}, as root. Package upgrades cannot be undone.${flags.includes("--reboot") ? "\nReboots afterwards if the upgrade needs it: sites are offline for a minute or two." : ""}`,
      ok: "Upgrade",
      danger: flags.includes("--reboot"),
      onOk: () => run(["update", "--packages", ...flags, ...s, "-y"], { server: n }),
    });
  // Package upgrades need a package manager and root (the CLI's can.packages).
  const pkgOk = p.mgr !== "none" && (can(n)?.packages ?? true);
  const pkgActs = !pkgOk ? "" : [
    btn("Refresh lists", () => refreshUpdates(n), "sm", "Fetch the newest package lists first (apt update)"),
    sec.length && p.mgr !== "apk" ? btn(`Security only (${sec.length})`, () => upgrade(["--security"], "security updates", sec.length), "sm") : "",
    p.updates.length ? btn("Upgrade all", () => upgrade([], "all packages", p.updates.length), "sm primary") : "",
    p.updates.length ? btn("Upgrade + reboot", () => upgrade(["--reboot"], "all packages", p.updates.length), "sm danger") : "",
  ].join("");
  const shown = p.updates.slice(0, 200);
  const pkgRows = shown
    .map((u) => `<tr><td class="mono">${esc(u.name)}</td><td class="mono dim hide-sm">${esc(u.from ?? "")}</td><td class="mono">${esc(u.to)}</td><td>${u.security ? `<span class="badge warn">security</span>` : ""}</td></tr>`)
    .join("");
  const imgUpdates = images.filter((i) => i.state === "update");
  const updImg = (names) =>
    confirmDlg({
      title: `Update ${names.join(", ")}?`,
      text: "Pulls the newer image and recreates the container (a few seconds offline). Undo puts the old image back.",
      ok: "Update",
      onOk: () => run(["update", ...names, "--images", ...s, "-y"], { server: n }),
    });
  const imgRows = images
    .map((i) => {
      const [cls, label] = IMG[i.state] ?? ["", i.state];
      const can = i.state === "update" || i.state === "unknown";
      return `<tr><td><b>${esc(i.name)}</b> <span class="faint">${esc(i.kind)}</span></td><td class="mono dim hide-sm">${esc(i.ref || "-")}</td>
        <td><span class="badge ${cls}">${esc(label)}</span></td><td class="dim hide-sm">${esc(i.note ?? "")}</td>
        <td class="acts">${can ? btn(i.state === "update" ? "Update" : "Pull anyway", () => updImg([i.name]), i.state === "update" ? "sm primary" : "sm") : ""}</td></tr>`;
    })
    .join("");
  const head = p.mgr === "none"
    ? `<span class="dim" style="font-weight:400">no supported package manager</span>`
    : p.updates.length
      ? `<span class="badge">${p.updates.length}</span>${sec.length ? ` <span class="badge warn">${sec.length} security</span>` : ""}`
      : `<span class="badge ok">up to date</span>`;
  return `
    ${p.mgr === "none" ? "" : `<div class="card">
      <h2>Packages ${head}${p.reboot ? ` <span class="badge warn">reboot required</span>` : ""}
        <span class="dim hide-sm" style="font-weight:400">${esc(p.mgr)}${p.refreshed ? "" : " · lists not refreshed"}</span>
        <span class="actions">${pkgActs}</span></h2>
      ${pkgRows ? `<div class="scroll"><table>
        <thead><tr><th>Package</th><th class="hide-sm">Installed</th><th>New</th><th></th></tr></thead>
        <tbody>${pkgRows}${p.updates.length > shown.length ? `<tr><td colspan="4" class="dim">… ${p.updates.length - shown.length} more</td></tr>` : ""}</tbody>
      </table></div>` : ""}
      ${pkgOk ? "" : `<p class="dim">${esc(S.facts[n]?.data?.why?.packages ?? "")}</p>`}
    </div>`}
    ${!e.docker && can(n) && !can(n).docker ? "" : `<div class="card">
      <h2>Docker <span class="badge ${!e.docker || e.dockerNote || e.composeNote ? "warn" : "ok"}">${!e.docker ? "not installed" : e.dockerNote || e.composeNote ? "update available" : "up to date"}</span>
        <span class="actions">${e.composeUpdate ? btn("Update compose", () => run(["update", "--compose", ...s, "-y"], { server: n }), "sm primary") : ""}</span></h2>
      ${e.docker ? `<div class="body"><dl class="kv">
        <dt>Docker</dt><dd>${engineLine(e.docker, e.latestDocker, e.dockerNote, e.dockerHow)}</dd>
        <dt>Compose</dt><dd>${e.compose ? engineLine(e.compose, e.latestCompose, e.composeNote, e.composeHow) : `<span class="badge warn">missing</span> <span class="faint">lf setup installs it</span>`}</dd>
      </dl></div>` : ""}
    </div>
    <div class="card">
      <h2>Images <span class="dim" style="font-weight:400">Traefik and sites</span>
        <span class="actions">${imgUpdates.length ? btn(`Update all (${imgUpdates.length})`, () => updImg(imgUpdates.map((i) => i.name)), "sm primary") : ""}</span></h2>
      <div class="scroll"><table>
        <thead><tr><th>Name</th><th class="hide-sm">Image</th><th>State</th><th class="hide-sm">Note</th><th></th></tr></thead>
        <tbody>${imgRows || `<tr><td colspan="5" class="dim">no containers</td></tr>`}</tbody>
      </table></div>
    </div>`}`;
}

// ---- firewall --------------------------------------------------------------

const REACH = { open: "ok", limited: "accent", blocked: "bad", local: "" };

function firewallView(n) {
  const st = S.firewall[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> reading the firewall…</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const fw = st.data;
  const s = sv(n);
  const fwRun = (argv) => run(argv, { server: n });
  const active = fw.ufw === "active";
  const toggle =
    fw.ufw === "missing"
      ? btn("Install & enable ufw", () => fwRun(["firewall", "enable", ...s]), "primary")
      : active
        ? btn("Turn off", () => confirmDlg({ title: `Turn the firewall on ${n} off?`, text: "Every listening port becomes reachable from anywhere.", ok: "Turn it off", danger: true, onOk: () => fwRun(["firewall", "disable", ...s, "-y"]) }), "danger")
        : btn("Turn on", () => fwRun(["firewall", "enable", ...s]), "primary");
  const badge = active ? `<span class="badge ok">on</span>` : fw.ufw === "missing" ? `<span class="badge warn">ufw not installed</span>` : `<span class="badge bad">off</span>`;
  const blocked = !active && fw.blocked.length
    ? `<div class="note">Turning it on would cut off ${esc(fw.blocked.join(", "))}: add rules for them first, or landfall refuses (with a way to do it anyway).</div>`
    : "";
  const ruleRows = fw.rules
    .map((r, i) => {
      const num = String(i + 1);
      const flip = r.action === "deny" || r.action === "reject" ? "allow" : "deny";
      const cls = r.action === "allow" ? "ok" : r.action === "limit" ? "accent" : "bad";
      const port = r.port ? `${r.port}${r.proto ? `/${r.proto}` : ""}` : "";
      return `<tr>
        <td class="faint">${num}</td>
        <td>${btn(`<span class="badge ${cls}">${esc(r.action)}${r.out ? " out" : ""}</span>`, () => confirmDlg({ title: `Switch rule ${num} to ${flip}?`, text: `${r.spec}${r.from ? ` from ${r.from}` : ""}`, ok: `Switch to ${flip}`, danger: flip === "deny", onOk: () => fwRun(["firewall", "update", r.spec, "--action", flip, ...s]) }), "ghost sm", `Switch to ${flip}`)}</td>
        <td class="mono">${esc(port || r.spec)}</td>
        <td>${r.from ? `<span class="mono">${esc(r.from)}</span>` : `<span class="dim">anywhere</span>`}</td>
        <td class="dim hide-sm">${esc(r.comment ?? "")}</td>
        <td class="acts">${btn("Edit", () => editRule(n, num, r), "sm")}${btn("Remove", () => confirmDlg({ title: `Remove rule ${num}?`, text: r.spec, ok: "Remove it", danger: true, onOk: () => fwRun(["firewall", "rm", r.spec, ...s, "-y"]) }), "sm danger")}</td>
      </tr>`;
    })
    .join("");
  const portRows = fw.ports
    .map((p) => `<tr><td class="mono">${esc(p.port)}</td><td>${esc(p.proc)}</td><td><span class="badge ${REACH[p.state] ?? ""}">${esc(p.state)}</span></td><td class="dim">${esc(p.why)}</td></tr>`)
    .join("");
  return `
    ${blocked}
    <div class="card">
      <h2>ufw ${badge} <span class="dim" style="font-weight:400">incoming default: ${esc(fw.policy.toLowerCase())} · ssh on ${esc(fw.sshPort)}${fw.asRoot ? " · as root" : ""}</span>
        <span class="actions">${toggle}</span></h2>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th>Action</th><th>Port</th><th>From</th><th class="hide-sm">Comment</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody>${ruleRows || `<tr><td colspan="6" class="dim">no rules</td></tr>`}</tbody>
      </table></div>
      <div class="body" style="border-top:1px solid var(--line)">
        <form class="form-row" id="addrule">
          <label>Port <input name="port" placeholder="5432, 51820/udp, 6000:6007/tcp" required></label>
          <label>From <input name="from" placeholder="anywhere, or 10.0.0.0/8"></label>
          <label style="flex:0 0 110px">Action <select name="action"><option value="allow">allow</option><option value="deny">deny</option></select></label>
          <button type="submit" class="primary">Add rule</button>
        </form>
      </div>
    </div>
    <div class="card">
      <h2>Listening ports <span class="dim" style="font-weight:400">and whether the internet reaches them</span></h2>
      <div class="scroll"><table>
        <thead><tr><th>Port</th><th>Process</th><th>Reach</th><th>Why</th></tr></thead>
        <tbody>${portRows || `<tr><td colspan="4" class="dim">nothing listening</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

document.addEventListener("submit", (e) => {
  if (e.target.id !== "addrule") return;
  e.preventDefault();
  const f = e.target.elements;
  const port = f.port.value.trim();
  if (!port) return;
  const from = f.from.value.trim();
  const action = f.action.value;
  e.target.reset();
  run(["firewall", action, port, ...sv(S.sel), ...(from && from !== "anywhere" ? ["--from", from] : [])], { server: S.sel });
});

function editRule(n, num, r) {
  const port = r.port ? `${r.port}${r.proto ? `/${r.proto}` : ""}` : "";
  dialog({
    title: `Edit rule ${num}`,
    text: r.spec,
    fields: [
      { name: "port", label: "Port", value: port, placeholder: "port[/proto]" },
      { name: "from", label: "From", value: r.from ?? "", placeholder: "anywhere", hint: "An address or network like 10.0.0.0/8. Empty = anyone." },
      { name: "action", label: "Action", type: "select", value: r.action, options: ["allow", "deny", "reject", "limit"].map((a) => ({ value: a, label: a })) },
    ],
    ok: "Save",
    onOk: (v) => {
      // By its text, not its number: numbers shift when another firewall command lands first.
      const argv = ["firewall", "update", r.spec, ...sv(n)];
      if (v.port.trim() && v.port.trim() !== port) argv.push("--port", v.port.trim());
      argv.push("--from", v.from.trim() || "any");
      if (v.action !== r.action) argv.push("--action", v.action);
      run(argv, { server: n });
    },
  });
}

// ---- system ----------------------------------------------------------------

const SVC_FAILED = (s) => s.active === "failed" || s.active === "crashed";
const SVC_UP = (s) => s.active === "active" || s.active === "started";
// What keeps the server and its sites running: shown first, the rest behind "all".
const KEY_SVCS = ["docker", "containerd", "ssh", "sshd", "fail2ban", "ufw", "unattended-upgrades", "cron", "crond", "systemd-timesyncd", "chronyd", "chrony"];
const svcName = (u) => u.replace(/\.service$/, "");

function systemView(n) {
  const st = S.system[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> reading ${esc(n)}…</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const i = st.data;
  const s = sv(n);
  const go_ = (argv) => run([...argv, ...s], { server: n });
  const rows = (pairs) => `<dl class="kv">${pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;

  const swapTotal = i.swap.reduce((t, x) => t + x.size, 0);
  const d = i.docker;
  // Change buttons only where the CLI would do it: as admin, and not on a system that keeps it itself.
  const adm = i.root, set = adm && !i.managed;
  const may = (ok, html) => (ok ? html : "");
  const basics = `<div class="card"><h2>Basics</h2><div class="body">${rows([
    ["Host name", `<span class="mono">${esc(i.hostname)}</span> ${may(set, btn("Change", () => renameHost(n, i.hostname), "ghost sm"))}`],
    ["Time zone", `${esc(i.timezone)} <span class="faint">· ${esc(i.time)}</span> ${may(set, btn("Change", () => changeTz(n, i.timezone), "ghost sm"))}`],
    ["Clock", i.ntp === true ? `<span class="badge ok">synced</span>` : i.ntp === false ? `<span class="badge warn">not synced</span>` : `<span class="faint">unknown</span>`],
    ["Swap", `${swapTotal ? `${size(swapTotal)} <span class="faint">${esc(i.swap.map((x) => `${x.file} · ${size(x.used)} used`).join(", "))}</span>` : `<span class="badge${i.mem < 4 * 1024 ** 3 ? " warn" : ""}">none</span> <span class="faint">${size(i.mem)} memory</span>`}
      ${!set ? "" : i.swap.some((x) => x.file === "/swapfile")
        ? btn("Remove", () => confirmDlg({ title: `Remove the swap file on ${n}?`, text: "What is swapped out moves back to memory first.", ok: "Remove it", danger: true, onOk: () => go_(["swap", "off", "-y"]) }), "ghost sm danger")
        : swapTotal ? "" : btn("Add…", () => addSwapDlg(n, i), "ghost sm")}`],
    ["Docker logs", !d ? `<span class="faint">no docker</span>`
      : `${d.maxSize ? `${esc(d.maxSize)} × ${d.maxFile ?? 1} per container` : d.driver === "json-file" ? `<span class="badge warn">unlimited</span>` : ""} <span class="faint">${esc(d.driver)}</span> ${d.daemonError || !set ? "" : btn(d.maxSize ? "Change" : "Limit…", () => logLimitDlg(n, d), "ghost sm")}`],
  ])}${d?.daemonError ? `<div class="note bad" style="margin:12px 0 0">${esc(d.daemonError)}</div>` : ""}
  ${i.managed ? `<p class="faint" style="margin:12px 0 0">${esc(i.managed)}.</p>` : ""}
  ${i.root ? "" : `<p class="faint" style="margin:12px 0 0">${esc(i.user)} has no passwordless sudo and root's key does not work: other users' keys, bans and Docker's settings may be missing.</p>`}</div></div>`;

  let services = "";
  if (i.init !== "other") {
    const all = S.allSvcs?.[n];
    const shown = i.services
      .filter((x) => all || SVC_FAILED(x) || KEY_SVCS.includes(svcName(x.unit)) || (i.init === "openrc" && SVC_UP(x)))
      .sort((a, b) => (SVC_FAILED(b) - SVC_FAILED(a)) || (KEY_SVCS.includes(svcName(b.unit)) - KEY_SVCS.includes(svcName(a.unit))) || a.unit.localeCompare(b.unit));
    const nFailed = i.services.filter(SVC_FAILED).length;
    const row = (x) => {
      const u = svcName(x.unit);
      const ssh = /^sshd?$/.test(u), core = /^(docker|containerd)$/.test(u);
      const stop = () => confirmDlg({
        title: `Stop ${u} on ${n}?`,
        text: ssh ? "New ssh logins fail until it is started again (from the provider's console)." : core ? "Every site goes down until it is started again." : "It stays stopped until started again, or until the next boot if it is enabled.",
        ok: "Stop it", danger: true, onOk: () => go_(["services", "stop", u, "-y", ...(ssh ? ["--force"] : [])]),
      });
      const restart = () => core
        ? confirmDlg({ title: `Restart ${u} on ${n}?`, text: "Every site goes down for a moment.", ok: "Restart", danger: true, onOk: () => go_(["services", "restart", u, "-y"]) })
        : go_(["services", "restart", u]);
      const cls = SVC_FAILED(x) ? "bad" : SVC_UP(x) ? "ok" : "";
      return `<tr><td class="mono">${esc(u)}</td><td><span class="badge ${cls}">${esc(x.sub || x.active)}</span></td>
        ${i.init === "systemd" ? `<td class="faint hide-sm">${esc(x.enabled ?? "")}</td>` : ""}<td class="dim hide-sm">${esc(x.description)}</td>
        <td class="acts">${btn("Logs", () => run(["services", "logs", u, "-n", "200", ...s], { server: n }), "sm")}${may(adm, menuBtn([
          { label: "Restart", run: restart },
          SVC_UP(x) ? { label: "Stop…", cls: "danger", run: stop } : { label: "Start", run: () => go_(["services", "start", u]) },
        ], `Actions for ${u}`))}</td></tr>`;
    };
    services = `<div class="card"><h2>Services ${nFailed ? `<span class="badge bad">${nFailed} failed</span>` : ""} <span class="sub">${i.init}</span>
      <span class="actions">${btn(all ? "Fewer" : `All ${i.services.length}`, () => ((S.allSvcs = { ...S.allSvcs, [n]: !all }), render()), "sm")}</span></h2>
      <div class="scroll"><table><thead><tr><th>Service</th><th>State</th>${i.init === "systemd" ? `<th class="hide-sm">Boot</th>` : ""}<th class="hide-sm">Description</th><th><span class="sr">Actions</span></th></tr></thead>
      <tbody>${shown.map(row).join("") || `<tr><td colspan="5" class="dim">none</td></tr>`}</tbody></table></div></div>`;
  }

  const keyRows = i.keys.map((k) => {
    const label = k.comment || k.fingerprint.slice(7, 19);
    const rm = () => confirmDlg({
      title: `Remove ${label} from ${k.user}?`,
      text: k.mine ? "This is the key this machine logs in with: removing it can lock you out." : `${k.type} ${k.fingerprint}`,
      ok: "Remove it", danger: true,
      onOk: () => go_(["keys", "rm", k.fingerprint, "--user", k.user, "-y", ...(k.mine ? ["--force"] : [])]),
    });
    return `<tr><td>${esc(k.user)}</td><td>${k.mine ? `<span class="badge ok" title="This machine logs in with it">this machine</span> ` : ""}${esc(k.comment || "")}${k.options ? `<div class="faint mono">${esc(k.options)}</div>` : ""}</td>
      <td class="mono faint hide-sm">${esc(k.type.replace(/^ssh-/, ""))} ${esc(k.fingerprint.slice(7, 23))}…</td><td class="acts">${may(adm || k.user === i.user, btn("Remove", rm, "sm danger"))}</td></tr>`;
  }).join("");
  const keys = `<div class="card"><h2>SSH keys <span class="badge">${i.keys.length}</span> <span class="sub">who may log in</span><span class="actions">${btn("Add key…", () => addKeyDlg(n), "sm")}</span></h2>
    <div class="scroll"><table><thead><tr><th>User</th><th>Comment</th><th class="hide-sm">Key</th><th><span class="sr">Actions</span></th></tr></thead>
    <tbody>${keyRows || `<tr><td colspan="4" class="dim">no keys found</td></tr>`}</tbody></table></div></div>`;

  const banned = i.jails.flatMap((j) => j.ips.map((ip) => ({ ip, jail: j.name })));
  const bans = i.fail2ban === "running"
    ? `<div class="card"><h2>Bans <span class="badge${banned.length ? " warn" : ""}">${banned.length}</span> <span class="sub">fail2ban · ${esc(i.jails.map((j) => `${j.name}: ${j.total} in total`).join(", "))}</span></h2>
      <div class="scroll"><table><thead><tr><th>IP</th><th>Jail</th><th><span class="sr">Actions</span></th></tr></thead>
      <tbody>${banned.map((b) => `<tr><td class="mono">${esc(b.ip)}</td><td>${esc(b.jail)}</td><td class="acts">${may(adm, btn("Unban", () => go_(["unban", b.ip]), "sm"))}</td></tr>`).join("") || `<tr><td colspan="3" class="dim">nobody banned right now</td></tr>`}</tbody></table></div></div>`
    : `<div class="card"><h2>Bans</h2><div class="body dim">${i.fail2ban === "missing" ? "fail2ban is not installed." : "fail2ban is not running."}</div></div>`;

  return securityCard(n, i) + basics + services + keys + bans;
}

/** What `lf security` says, with its fixes as buttons. */
function rebootDlg(n) {
  confirmDlg({ title: `Reboot ${n}?`, text: "Its sites are offline for a minute or two. Waits until it is back and checks its containers run again.", ok: "Reboot", danger: true, onOk: () => run(["reboot", ...sv(n), "-y"], { server: n }) });
}

function securityCard(n, i) {
  const adv = i.advice ?? [];
  const cls = { risk: "bad", warn: "warn", info: "" };
  const fix = (a) => {
    const f = a.fix;
    if (!f) return "";
    // A key pair for someone else: say where it goes before making it.
    if (f.user) return btn(`${f.label}…`, () => addKeyDlg(n, f.user, true), "sm");
    if (f.argv[0] === "reboot") return btn(`${f.label}…`, () => rebootDlg(n), "sm");
    return btn(f.confirm ? `${f.label}…` : f.label, () => f.confirm
      ? confirmDlg({ title: `${a.title}: ${f.label.toLowerCase()} on ${n}?`, text: f.confirm, ok: f.label, onOk: () => run([...f.argv, "-y"], { server: n }) })
      : run(f.argv, { server: n }), "sm");
  };
  const risks = adv.filter((a) => a.level === "risk").length;
  return `<div class="card"><h2>Security ${adv.length ? `<span class="badge ${risks ? "bad" : "warn"}">${plural(adv.length, "thing")} to look at</span>` : `<span class="badge ok">nothing to fix</span>`} <span class="sub">lf security</span></h2>
    ${adv.length ? `<div class="scroll"><table><tbody>${adv.map((a) => `<tr><td><span class="badge ${cls[a.level]}">${a.level}</span></td>
      <td><b>${esc(a.title)}</b><div class="dim">${esc(a.why)}</div></td><td class="acts">${fix(a)}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="body dim">SSH takes keys only${i.security.firewall === "active" ? ", the firewall is on" : ""}${i.fail2ban === "running" ? ", fail2ban runs" : ""}${i.security.autoUpdates ? " and security updates install themselves" : ""}.</div>`}</div>`;
}

function renameHost(n, old) {
  dialog({
    title: `Rename ${n}`,
    text: "The server's own host name: what its shell prompt and logs show. Your ssh alias stays as it is.",
    fields: [{ name: "name", label: "Host name", value: old, placeholder: "web-1" }],
    ok: "Rename",
    onOk: (v) => {
      const name = v.name.trim();
      if (!/^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/i.test(name)) return { error: "Letters, digits and -, up to 63, no dots.", field: "name" };
      if (name !== old) run(["hostname", name, ...sv(n)], { server: n });
    },
  });
}
function changeTz(n, old) {
  dialog({
    title: `Time zone of ${n}`,
    text: "Cron jobs, logs and the clock in containers that read it follow it.",
    fields: [{ name: "tz", label: "Time zone", value: old, placeholder: "Europe/Berlin, UTC", hint: `Yours is ${Intl.DateTimeFormat().resolvedOptions().timeZone}.` }],
    ok: "Change",
    onOk: (v) => {
      const tz = v.tz.trim();
      if (!/^[A-Za-z0-9_+-]+(\/[A-Za-z0-9_+-]+)*$/.test(tz)) return { error: "A name like Europe/Berlin or UTC.", field: "tz" };
      if (tz !== old) run(["timezone", tz, ...sv(n)], { server: n });
    },
  });
}
function addSwapDlg(n, i) {
  const gb = 1024 ** 3;
  // Rule of thumb: as much as memory up to 2 GB, never more than a tenth of the free disk.
  const pick = Math.max(0.5, Math.min(i.mem > 2 * gb ? 2 : 1, Math.floor((i.diskFree / gb / 10) * 2) / 2));
  dialog({
    title: `Add swap to ${n}`,
    text: `A swap file at /swapfile, on at boot. It keeps the server alive when memory runs out (slowly instead of killing processes). ${size(i.diskFree)} free on the disk.`,
    fields: [{ name: "size", label: "Size", value: `${pick >= 1 ? pick + "G" : "512M"}`, placeholder: "1G, 512M" }],
    ok: "Add swap",
    onOk: (v) => {
      if (!/^\d+(\.\d+)?\s*[mg]$/i.test(v.size.trim())) return { error: "A size like 1G or 512M.", field: "size" };
      run(["swap", v.size.trim(), ...sv(n)], { server: n });
    },
  });
}
function logLimitDlg(n, d) {
  dialog({
    title: `Docker log limit on ${n}`,
    text: "Caps the log Docker keeps per container. It applies to containers created afterwards: redeploy or restart sites to apply it to them.",
    fields: [
      { name: "size", label: "Per file", value: d.maxSize ?? "10m", placeholder: "10m", hint: "k, m or g. Empty removes the limit." },
      { name: "files", label: "Files kept", value: String(d.maxFile ?? 3), placeholder: "3" },
      { name: "restart", type: "check", label: "Restart Docker now", hint: "Sites go down for a moment. Otherwise it applies on Docker's next start." },
    ],
    ok: "Save",
    onOk: (v) => {
      const sz = v.size.trim().toLowerCase();
      if (sz && !/^\d+[kmg]$/.test(sz)) return { error: "A size like 10m.", field: "size" };
      if (!/^\d+$/.test(v.files.trim())) return { error: "A number.", field: "files" };
      run(["log-limit", sz || "off", "--files", v.files.trim(), ...(v.restart ? ["--restart", "-y"] : []), ...sv(n)], { server: n });
    },
  });
}
function addKeyDlg(n, user = "", generate = false) {
  dialog({
    title: `Add an SSH key to ${n}`,
    text: "Paste a public key (the .pub file, one line), or make a new pair on this computer. Whoever holds the private key can log in.",
    fields: [
      { name: "generate", label: "Make a new key pair", type: "check", value: generate, hint: `Saved as ~/.ssh/${n}_<user>, without a passphrase (add one with ssh-keygen -p). Hand it to whoever logs in as that user.` },
      { name: "key", label: "Public key", type: "textarea", value: "", placeholder: "ssh-ed25519 AAAA… name@laptop", hint: "Not needed for a new pair." },
      { name: "user", label: "User", value: user, placeholder: "the login user", hint: "Whose account it logs in to. Empty: the user landfall logs in as." },
    ],
    ok: "Add key",
    onOk: (v) => {
      const u = v.user.trim() ? ["--user", v.user.trim()] : [];
      if (v.generate) return void run(["keys", "add", "--generate", ...u, ...sv(n)], { server: n });
      const key = v.key.trim().split("\n")[0];
      if (!/^(\S+\s+)?(ssh-|ecdsa-|sk-)\S+ AAAA/.test(key)) return { error: "That does not look like a public key.", field: "key" };
      run(["keys", "add", key, ...u, ...sv(n)], { server: n });
    },
  });
}

/** Everything an SSH tunnel reaches on server n, and the tunnels open now. */
function tunnelsView(n, o) {
  if (!o.ready && !o.others.length && !o.unrouted?.length) return `<div class="card"><div class="body empty"><h2>Nothing to tunnel to yet</h2><p>Set up the server and deploy a site first.</p></div></div>`;
  const open = openTunnels(n);
  const chips = (l) => `<div class="chips">${l.map((d) => `<span class="chip">${esc(d)}</span>`).join("")}</div>`;
  const targets = [];
  const dashArgv = ["traefik", "dashboard", ...sv(n)];
  targets.push({ name: "Traefik dashboard", status: o.traefik, serves: o.dashboard.hosts, argv: o.dashboard.tunnel ? dashArgv : null, why: "no tunnel yet: see Traefik" });
  for (const x of o.sites) {
    if (x.state === "old") continue;
    // One row per service when a site has several: each is its own container.
    const many = x.services.length > 1;
    if (!many) targets.push({ name: x.meta.name, status: x.status, serves: x.domains, argv: ["tunnel", x.meta.name, ...sv(n)] });
    else for (const svc of x.services) targets.push({ name: `${x.meta.name} · ${svc.service}`, status: svc.status, serves: svc.service === x.main ? x.domains : [], argv: ["tunnel", x.meta.name, svc.service, ...sv(n)] });
  }
  for (const e of o.others) targets.push({ name: e.name, status: e.status, serves: e.domains, argv: ["tunnel", e.name, ...sv(n)], other: true });
  // Databases, workers: by Compose project and service, else by container name.
  const loose = (o.unrouted ?? []).map((x) => ({ name: x.container, status: x.status, image: x.image, ports: x.ports ?? [], serves: [], argv: ["tunnel", ...(x.project ? [x.project, x.service] : [x.container]), ...sv(n)] }));
  const row = (t) => `<tr><td><div class="site-name">${t.status ? statusDot(t.status) : ""}<b>${esc(t.name)}</b>${t.other ? `&nbsp;<span class="faint">not landfall's</span>` : ""}</div><div class="show-sm">${chips(t.serves)}</div></td>
      <td class="hide-sm">${chips(t.serves)}</td>
      <td class="acts">${t.argv ? tunnelBtn(n, t.argv) : `<span class="dim">${esc(t.why)}</span> ${btn("Traefik", () => go(n, "traefik"), "sm")}`}</td></tr>`;
  return `${open.length ? `<div class="card scroll"><h2>Open <span class="badge ok">${open.length}</span></h2><table><tbody>${open
      .map((j) => `<tr><td><b class="mono">lf ${esc(j.info.argv.filter((a, i, l) => a !== "-s" && l[i - 1] !== "-s").join(" "))}</b></td><td class="acts">${tunnelBtn(n, j.info.argv)}</td></tr>`)
      .join("")}</tbody></table></div>` : ""}
    <div class="card scroll"><h2>Tunnel to</h2>
      <div class="lede">An SSH tunnel forwards a port on this machine to a container on ${esc(n)}: test a site on localhost with no domain, HTTPS or login. Nothing changes on the server, and closing the tunnel ends it.</div>
      <table><thead><tr><th>Container</th><th class="hide-sm">Domains</th><th><span class="sr">Tunnel</span></th></tr></thead><tbody>${targets.map(row).join("")}</tbody></table></div>
    ${loose.length ? `<div class="card scroll"><h2>Other containers <span class="badge">${loose.length}</span></h2>
      <div class="lede">Running, but no domain routes to them: databases, caches, workers. The tunnel goes to the port their image exposes.</div>
      <table><thead><tr><th>Container</th><th class="hide-sm">Image</th><th><span class="sr">Tunnel</span></th></tr></thead><tbody>${loose
        .map((t) => `<tr><td><div class="site-name">${statusDot(t.status)}<b>${esc(t.name)}</b></div><div class="show-sm faint mono">${esc(t.image)}</div></td><td class="hide-sm faint mono">${esc(t.image)}</td><td class="acts">${tunnelBtn(n, t.argv, undefined, t.ports)}</td></tr>`)
        .join("")}</tbody></table></div>` : ""}`;
}

/** Traefik on server n: its dashboard (domain and tunnel) and how landfall runs it. */
function traefikView(n) {
  const st = S.settings[n] ?? { loading: true };

  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const x = st.data;
  const reload = { server: n, after: (j) => (j.info.code === 0 ? void (load(n, "traefik", true), render()) : undefined) };
  const rows = (pairs) => `<dl class="kv">${pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const P = S.state.paths;
  const dashboard = () =>
    dialog({
      title: `Traefik dashboard on ${n}`,
      text: "Serves the dashboard on a domain behind a login. Without one it stays reachable through an SSH tunnel only (Open via tunnel).\nRuns lf traefik setup, which reconfigures landfall's Traefik.",
      fields: [
        { name: "domain", label: "Domain", value: x.traefik.dashboard ?? "", placeholder: x.domains[0] ? `traefik.${x.domains[0]}` : "traefik.example.com", hint: x.traefik.dashboard ? "Empty: take the dashboard off its domain." : "Needs an A record pointing at the server." },
        {
          legend: "Login",
          fields: [
            { name: "user", label: "User", value: "admin", placeholder: "admin" },
            { name: "password", label: `Password (at least ${S.state.rules.minPassword} characters)`, type: "password", hint: x.traefik.dashboard ? "Empty: keeps the current one." : "Empty: a generated one, shown in the output." },
          ],
        },
      ],
      ok: "Apply",
      onOk: (v) => {
        const d = v.domain.trim();
        const user = v.user.trim() || "admin";

        if (bad) return invalid(...bad);
        const argv = ["traefik", "setup", ...sv(n), "--dashboard", d || "off"];

  const traefikDialog = () =>
    dialog({

      fields: [
        { name: "http3", label: "HTTP/3 (QUIC on 443/udp)", type: "check", value: x.traefik.http3, hint: "Faster on lossy and mobile connections; browsers that can't use it fall back to HTTP/2." },
        {
          name: "mode", label: "Ports", type: "select", value: x.traefik.hostNetwork ? "host" : "docker",
          options: [

  const tunnel = x.tunnelOnly;

  const saved = x.saved ? Object.entries(x.saved).filter(([k, v]) => v !== undefined && k !== "dashboard").map(([k, v]) => [k, `<span class="mono">${esc(String(v))}</span>`]) : [];

        ? `${x.domains.map((d, i) => `<div class="drow">
             <div>${dnsRow(x.dns[i].apex)}${i === 0 ? ` <span class="badge accent">primary</span>` : ""}<div class="dim">sites: ${dnsRow(x.dns[i].wildcard)}</div><div class="faint">${servedBy(d) ? `served by <b>${esc(servedBy(d))}</b>` : external(d) ? `served by <b>${esc(external(d))}</b> (not landfall)` : "no site serves it"}</div></div>

             ], `More for ${d}`)}</div>
           </div>`).join("")}
           <p class="faint">New sites get <span class="mono">&lt;site&gt;.${esc(x.domains[0])}</span>; a bare name like <span class="mono">blog</span> means <span class="mono">blog.${esc(x.domains[0])}</span>, and <span class="mono">@</span> means <span class="mono">${esc(x.domains[0])}</span> itself.</p>
           ${records.length ? `<div class="note">Add at your DNS provider:<div class="mono">${records.join("<br>")}</div></div>` : ""}`
        : `<p class="dim">No main domain set in landfall. New sites get a free <span class="mono">&lt;site&gt;.&lt;ip&gt;.sslip.io</span> address until you set one.</p>`}
        <div class="drow">

        : `<p class="dim">No Host block; ssh uses its defaults.</p>`}</div>

}

// The last samples per server, for the sparklines: 5 minutes at one per 5s.
const STATS_LOG = 60;
function logStats(n, s) {
  const log = (S.statsLog[n] ??= []);
  log.push({ cpu: s.cpu, mem: s.mem.total ? ((s.mem.total - s.mem.available) / s.mem.total) * 100 : 0 });
  if (log.length > STATS_LOG) log.shift();
}
const pctOf = (used, total) => (total ? Math.round((used / total) * 100) : 0);
/** A sparkline of 0-100 values, oldest left. */
function spark(values) {
  if (values.length < 2) return "";
  const pts = values.map((v, i) => `${((STATS_LOG - values.length + i) / (STATS_LOG - 1)) * 100},${24 - (Math.min(100, v) / 100) * 22}`).join(" ");
  return `<svg viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function meter(label, p, value, sub, line = "", hint = "") {
  const cls = p >= 90 ? "bad" : p >= 70 ? "warn" : "";
  return `<div class="meter ${cls}" title="${esc(hint)}"><div class="k"><span>${esc(label)}</span></div>
    <div class="v">${value}${line}</div>
    ${p === null ? "" : `<div class="bar" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${Math.min(100, p)}%"></i></div>`}
    <div class="t">${sub}</div></div>`;
}
/** Live usage of one server: meters, the busiest processes and containers, disk usage on request. */
function statsView(n) {
  const st = S.stats[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> measuring ${esc(n)} for a second…</div>`;
  if (st.error && !st.data) return `<div class="note bad">${esc(st.error)}</div><div class="actions" style="margin:0">${btn("Retry", () => (load(n, "stats", true), render()))}</div>`;
  const s = st.data;
  const log = S.statsLog[n] ?? [];
  const memUsed = s.mem.total - s.mem.available;
  const swapUsed = s.mem.swapTotal - s.mem.swapFree;
  const meters = [
    meter("CPU", s.cpu, `${s.cpu}%`, `${plural(s.cpus, "core")} · load ${s.load.join(" ")}`, spark(log.map((x) => x.cpu)), "Busy share of all cores over one second; load is the 1, 5 and 15 minute average"),
    meter("Memory", pctOf(memUsed, s.mem.total), `${pctOf(memUsed, s.mem.total)}%`, `${size(memUsed)} of ${size(s.mem.total)}`, spark(log.map((x) => x.mem)), "Used, without caches the kernel gives back when needed"),
    s.mem.swapTotal ? meter("Swap", pctOf(swapUsed, s.mem.swapTotal), `${pctOf(swapUsed, s.mem.swapTotal)}%`, `${size(swapUsed)} of ${size(s.mem.swapTotal)}`) : "",
    ...s.disks.map((d) => meter(`Disk ${d.mount}`, pctOf(d.used, d.total), `${pctOf(d.used, d.total)}%`, `${size(d.used)} of ${size(d.total)} · ${size(d.available)} free`)),
    ...s.net.map((x) => meter(`Network ${x.iface}`, null, `↓ ${size(x.rx)}/s`, `↑ ${size(x.tx)}/s`)),
  ].join("");
  const procs = s.procs.slice(0, 8);
  const procCard = procs.length
    ? `<div class="card"><h2>Processes <span class="sub">busiest and largest · cpu 100% = one core</span></h2><div class="scroll"><table>
        <thead><tr><th>Name</th><th class="num">CPU</th><th class="num">Memory</th><th class="num hide-sm">PID</th></tr></thead>
        <tbody>${procs.map((p) => `<tr><td class="mono">${esc(p.name)}</td><td class="num">${p.cpu}%</td><td class="num">${size(p.rss)}</td><td class="num faint hide-sm">${p.pid}</td></tr>`).join("")}</tbody></table></div></div>`
    : "";
  const up = (x) => isUp(x.status);
  const ctrCard = !s.docker
    ? `<div class="note">No access to Docker on ${esc(n)}: containers are not shown. Set up the server to fix that.</div>`
    : s.containers.length
      ? `<div class="card"><h2>Containers <span class="badge">${s.containers.length}</span></h2><div class="scroll"><table>
          <thead><tr><th>Container</th><th class="hide-sm">Site</th><th class="num">CPU</th><th class="num">Memory</th><th class="num hide-sm" title="Received and sent since the container started">Network in / out</th><th class="num hide-sm">Restarts</th></tr></thead>
          <tbody>${s.containers
            .map((x) => `<tr><td>${statusDot(x.status)}<span class="mono">${esc(x.name)}</span><div class="faint">${esc(x.image)}</div></td>
              <td class="hide-sm">${x.site ? `<b>${esc(x.site)}</b>` : `<span class="faint">${esc(x.project || "-")}</span>`}</td>
              <td class="num">${up(x) ? `${Math.round(x.cpu * 10) / 10}%` : ""}</td>
              <td class="num">${up(x) ? `${size(x.mem)}${x.memLimit && x.memLimit < s.mem.total ? `<div class="faint" title="Set by mem_limit or deploy.resources in its compose file">limit ${size(x.memLimit)}</div>` : ""}` : `<span class="faint">${esc(x.status)}</span>`}</td>
              <td class="num hide-sm" title="since the container started">${up(x) ? `↓ ${size(x.net.rx)} <span class="faint">·</span> ↑ ${size(x.net.tx)}` : ""}</td>
              <td class="num hide-sm">${x.restarts ? `<span class="badge warn">${x.restarts}</span>` : `<span class="faint">0</span>`}</td></tr>`)
            .join("")}</tbody></table></div></div>`
      : "";
  const live = `<p class="faint" style="margin-top:14px">${st.loading ? `<span class="spin"></span> ` : ""}${st.error ? `<span style="color:var(--bad)">last sample failed: ${esc(st.error)}</span> · ` : ""}measured ${new Date(s.at).toLocaleTimeString()} · new sample every 5s while this tab is open · <span class="mono">lf stats -w${S.state.defaults.default === n ? "" : ` -s ${esc(n)}`}</span></p>`;
  return `<div class="meters">${meters}</div>${ctrCard}${procCard}${diskCard(n)}${live}`;
}

// ---- traffic ---------------------------------------------------------------

const TRAFFIC_SPANS = [["1h", "Last hour"], ["24h", "24 hours"], ["7d", "7 days"]];
const CLASS_COLORS = { "2xx": "var(--accent)", "3xx": "var(--faint)", "4xx": "var(--warn)", "5xx": "var(--bad)" };
const ms = (v) => (v >= 1000 ? `${(v / 1000).toFixed(1)} s` : `${v} ms`);
const count = (v) => v.toLocaleString();
const sv2 = (n) => (S.state.defaults.default === n ? "" : ` -s ${n}`);

/** One lazily fetched view per server, outside the tab stores: the sites' error card and certificates. */
function ensure(store, n, url) {
  if (S[store][n]) return;
  S[store][n] = { loading: true };
  http(`/api/servers/${encodeURIComponent(n)}${url}`).then(
    (data) => ((S[store][n] = { data }), render()),
    (e) => ((S[store][n] = { error: e.message }), render()),
  );
}

/** Requests per minute or hour, stacked by status class; hover a bar for its numbers. */
function trafficChart(series, bucket) {
  const W = 600, H = 120;
  const tot = series.map((x) => x["2xx"] + x["3xx"] + x["4xx"] + x["5xx"]);
  const max = Math.max(1, ...tot);
  const bw = W / series.length;
  const gap = bw > 4 ? 1 : 0;
  const when = (at) => (bucket === "hour" ? new Date(`${at}:00:00Z`) : new Date(`${at}:00Z`));
  const label = (at) => (bucket === "hour" ? when(at).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : when(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  const bars = series
    .map((x, i) => {
      let y = H;
      const segs = ["2xx", "3xx", "4xx", "5xx"]
        .filter((k) => x[k])
        .map((k) => {
          const h = Math.max(1, (x[k] / max) * (H - 4));
          y -= h;
          return `<rect x="${i * bw + gap / 2}" y="${y}" width="${Math.max(0.5, bw - gap)}" height="${h}" fill="${CLASS_COLORS[k]}"/>`;
        })
        .join("");
      const tip = `${label(x.at)}: ${count(tot[i])} requests${["4xx", "5xx"].filter((k) => x[k]).map((k) => `, ${count(x[k])} ${k}`).join("")}`;
      return `<g><title>${esc(tip)}</title><rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>${segs}</g>`;
    })
    .join("");
  const ticks = [0, Math.floor(series.length / 2), series.length - 1].map((i, j) => `<span style="text-align:${["left", "center", "right"][j]}">${esc(label(series[i].at))}</span>`).join("");
  return `<div class="tchart"><div class="tmax faint">${count(max)}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Requests per ${bucket}">${bars}</svg>
    <div class="tticks faint">${ticks}</div>
    <div class="tlegend">${Object.entries(CLASS_COLORS).map(([k, col]) => `<span><i style="background:${col}"></i>${k}</span>`).join("")}</div></div>`;
}

const errorCell = (status) => `<span class="badge ${status >= 500 ? "bad" : "warn"}">${status}</span>`;

function trafficView(n) {
  ensure("certs", n, "/certs");
  const st = S.traffic[n] ?? { loading: true };
  const spans = `<div class="actions" style="margin:0 0 14px">${TRAFFIC_SPANS.map(([v, l]) => btn(l, () => ((S.since = v), load(n, "traffic", true), render()), `sm${S.since === v ? " primary" : ""}`, `lf traffic --since ${v}`)).join("")}</div>`;
  if (st.loading && !st.data) return `${spans}<div class="loading"><span class="spin"></span> reading Traefik's access log…</div>`;
  if (st.error && !st.data) return `${spans}<div class="note bad">${esc(st.error)}</div>`;
  const t = st.data;
  if (!t.proxy) return `<div class="note">No Traefik on ${esc(n)}: nothing to count. Set up the server to install it.</div>`;
  if (t.format === "common") {
    return `<div class="note warn">Traefik writes its access log as plain text. ${t.own
      ? `Add <span class="mono">--accesslog.format=json</span> to its command to see traffic here.`
      : `${btn("Switch to JSON", () => run(["traefik", "setup", ...sv(n), "-y"], { server: n, after: () => (load(n, "traffic", true), []) }), "sm", "lf traefik setup: restarts Traefik for a moment")}`}</div>${certsCard(n)}`;
  }
  if (t.format === "none") return `${spans}<div class="card"><div class="body empty"><h2>No requests in this span</h2><p class="dim">Traefik's access log has nothing from the last ${esc(S.since)}.</p></div></div>${certsCard(n)}`;
  const T = t.total;
  const errs = T.classes["4xx"] + T.classes["5xx"];
  const pct = (v) => (T.requests ? Math.round((v / T.requests) * 1000) / 10 : 0);
  const meters = [
    meter("Requests", null, count(T.requests), `${plural(t.sites.length, "site")} · ${size(T.bytes)} sent`),
    meter("Server errors", null, `${count(T.classes["5xx"])}`, `${pct(T.classes["5xx"])}% · 5xx: the site failed`),
    meter("Client errors", null, `${count(T.classes["4xx"])}`, `${pct(T.classes["4xx"])}% · 4xx: not found, denied`),
    meter("Response time", null, ms(T.p50), `median · 95% within ${ms(T.p95)}`, "", "From Traefik receiving the request to the last byte sent"),
  ].join("");
  const other = t.hosts.filter((h) => !h.site);
  const rowsOf = (label, x) => `<tr><td>${label}</td><td class="num">${count(x.requests)}</td><td class="num">${x.classes["4xx"] ? `<span class="badge warn">${count(x.classes["4xx"])}</span>` : `<span class="faint">0</span>`}</td><td class="num">${x.classes["5xx"] ? `<span class="badge bad">${count(x.classes["5xx"])}</span>` : `<span class="faint">0</span>`}</td><td class="num hide-sm">${ms(x.p50)}</td><td class="num hide-sm">${ms(x.p95)}</td><td class="num hide-sm">${size(x.bytes)}</td></tr>`;
  const siteCard = `<div class="card"><h2>By site</h2><div class="scroll"><table>
    <thead><tr><th>Site</th><th class="num">Requests</th><th class="num">4xx</th><th class="num">5xx</th><th class="num hide-sm">Median</th><th class="num hide-sm">95%</th><th class="num hide-sm">Sent</th></tr></thead>
    <tbody>${t.sites.map((x) => rowsOf(`<b>${esc(x.site)}</b><div class="faint">${esc(x.hosts.join(" "))}</div>`, x)).join("")}${other.slice(0, 10).map((h) => rowsOf(`<span class="mono dim">${esc(h.host)}</span>`, h)).join("")}</tbody></table></div>
    ${other.length ? `<div class="body faint" style="padding-top:0">Hosts without a site: bots asking for the server's IP or old domains${other.length > 10 ? `, ${other.length - 10} more` : ""}.</div>` : ""}</div>`;
  const list = (title, rows, cols) => (rows.length ? `<div class="card"><h2>${title}</h2><div class="scroll"><table><thead><tr>${cols.map(([c, cls = ""]) => `<th class="${cls}">${c}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div></div>` : "");
  const paths = list("Busiest paths", T.paths.map((p) => `<tr><td class="mono">${esc(p.path)}</td><td class="num">${count(p.count)}</td><td class="num">${p.errors ? `<span class="badge warn">${count(p.errors)}</span>` : ""}</td></tr>`), [["Path"], ["Requests", "num"], ["Failed", "num"]]);
  const errors = list("Failing requests", T.errors.map((e) => `<tr><td>${errorCell(e.status)}</td><td class="mono">${esc(e.path)}</td><td class="num">${count(e.count)}</td></tr>`), [["Status"], ["Path"], ["Requests", "num"]]);
  const ips = list("Clients", T.ips.map((i) => `<tr><td class="mono">${esc(i.ip)}</td><td class="num">${count(i.count)}</td></tr>`), [["IP"], ["Requests", "num"]]);
  const reach = t.from && new Date(t.from) - (Date.now() - t.since * 1000) > (t.bucket === "hour" ? 2 * 3_600_000 : 120_000) ? ` · the log reaches back to ${new Date(t.from).toLocaleString()}` : "";
  return `${spans}<div class="meters">${meters}</div>
    <div class="card"><h2>Requests per ${t.bucket} ${errs ? `<span class="sub">${count(errs)} failed</span>` : ""}</h2><div class="body">${trafficChart(T.series, t.bucket)}</div></div>
    ${siteCard}<div class="cols">${errors}${paths}</div>${ips}${certsCard(n)}
    <p class="faint" style="margin-top:14px">${st.loading ? `<span class="spin"></span> ` : ""}from Traefik's access log, read ${new Date(t.at).toLocaleTimeString()}${reach} · <span class="mono">lf traffic --since ${esc(S.since)}${esc(sv2(n))}</span></p>`;
}

/** Each site domain's certificate: days left, who issued it, why getting one failed. */
function certsCard(n) {
  const st = S.certs[n];
  const head = `<h2>Certificates <span class="sub">lf certs</span></h2>`;
  if (!st || (st.loading && !st.data)) return `<div class="card">${head}<div class="loading"><span class="spin"></span> reading certificates…</div></div>`;
  if (st.error) return `<div class="card">${head}<div class="body"><div class="note bad" style="margin:0">${esc(st.error)}</div></div></div>`;
  const r = st.data;
  if (!r.domains.length) return "";
  const days = (c) => !c ? `<span class="badge bad">none</span>` : c.days < 7 ? `<span class="badge bad">${c.days < 0 ? "expired" : plural(c.days, "day")}</span>` : c.staging ? `<span class="badge warn">staging</span>` : `<span class="badge ${c.days < 30 ? "warn" : "ok"}">${plural(c.days, "day")}</span>`;
  const rows = r.domains.map((d) => `<tr><td>${esc(d.domain)}${d.error && (!d.cert || d.cert.days < 30) ? `<div class="faint" style="color:var(--bad)">${esc(d.error.error)}</div>` : ""}</td><td class="hide-sm dim">${esc(d.site)}</td><td>${days(d.cert)}</td><td class="hide-sm dim">${d.cert ? esc(new Date(d.cert.expires).toLocaleDateString()) : ""}</td><td class="hide-sm faint">${esc(d.cert?.issuer ?? "")}</td></tr>`).join("");
  return `<div class="card">${head}${r.denied.length ? `<div class="body"><div class="note warn" style="margin:0">${esc(r.denied.join(", "))} needs root to read: this login has no passwordless sudo.</div></div>` : ""}<div class="scroll"><table>
    <thead><tr><th>Domain</th><th class="hide-sm">Site</th><th>Left</th><th class="hide-sm">Expires</th><th class="hide-sm">Issuer</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/** The sites tab: what failed in the last 24 hours, only when something did. */
function errorsCard(n) {
  if (!can(n)?.docker) return "";
  ensure("errs", n, "/traffic?since=24h");
  const t = S.errs[n]?.data;
  if (!t || t.format !== "json") return "";
  const rows = t.hosts.flatMap((h) => h.errors.map((e) => ({ ...e, where: h.site ?? h.host, site: !!h.site }))).filter((e) => e.site || e.status >= 500).sort((a, b) => (b.status >= 500) - (a.status >= 500) || b.count - a.count).slice(0, 6);
  if (!rows.length) return "";
  const fives = t.total.classes["5xx"];
  return `<div class="card"><h2>Errors in the last 24h <span class="sub">${fives ? `${count(fives)} server errors · ` : ""}${count(t.total.classes["4xx"])} client errors</span><span class="actions">${btn("Traffic", () => (location.hash = `#/${encodeURIComponent(n)}/traffic`), "sm")}</span></h2><div class="scroll"><table>
    <thead><tr><th>Status</th><th>Site</th><th>Path</th><th class="num">Requests</th></tr></thead>
    <tbody>${rows.map((e) => `<tr><td>${errorCell(e.status)}</td><td>${e.site ? `<b>${esc(e.where)}</b>` : `<span class="mono dim">${esc(e.where)}</span>`}</td><td class="mono">${esc(e.path)}</td><td class="num">${count(e.count)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function loadDisk(n) {
  S.disk[n] = { ...S.disk[n], loading: true, error: undefined };
  render();
  http(`/api/servers/${encodeURIComponent(n)}/disk`).then(
    (data) => ((S.disk[n] = { data }), render()),
    (e) => ((S.disk[n] = { error: e.message }), render()),
  );
}
function pruneFlow(n) {
  http(`/api/servers/${encodeURIComponent(n)}/prune`).then((p) => {
    const imgs = p.images.filter((i) => !i.keep);
    const kept = (w) => p.images.filter((i) => i.keep === w).length;
    const most = imgs.reduce((t, i) => t + i.size, 0) + p.buildCache;
    const keep = [[kept("release"), "for rollback"], [kept("undo"), "for undo"], [kept("used"), "in use"]].filter(([k]) => k).map(([k, w]) => `${k} ${w}`).join(", ");
    dialog({
      title: `Clean up ${n}?`,
      text: `${plural(imgs.length, "unused image")} and ${size(p.buildCache)} of build cache: up to ${size(most)}.${keep ? ` Kept: ${keep}.` : ""} Volumes and containers stay.`,
      fields: kept("tagged") ? [{ name: "all", type: "check", label: `Also ${plural(kept("tagged"), "unused tagged image")}`, hint: "Pulled again when a site needs them" }] : [],
      ok: "Clean up",
      danger: true,
      onOk: (v) => run(["prune", ...sv(n), "-y", ...(v.all ? ["--all"] : [])], { server: n, after: () => (loadDisk(n), []) }),
    });
  }, (e) => toast(e.message));
}
function diskCard(n) {
  const st = S.disk[n];
  const head = (acts) => `<h2>Disk usage <span class="sub">images, volumes, build cache, sites and logs</span><span class="actions">${acts}</span></h2>`;
  if (!st) return `<div class="card">${head(btn("Analyze", () => loadDisk(n), "sm", "lf disk: sums up folders, takes a few seconds"))}<div class="body dim">Where the space goes. Sums up folders on the server, so only on request.</div></div>`;
  if (!st.data) {
    const body = st.loading ? `<div class="loading"><span class="spin"></span> adding up folders…</div>` : `<div class="body"><div class="note bad" style="margin:0">${esc(st.error)}</div></div>`;
    return `<div class="card">${head(st.loading ? "" : btn("Retry", () => loadDisk(n), "sm"))}${body}</div>`;
  }
  const d = st.data;
  const tbl = (cols, rows) => `<div class="scroll"><table><thead><tr>${cols.map(([c, cls = ""]) => `<th class="${cls}">${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  const sub = (t) => `<h3 style="margin:16px 18px 6px;font-size:var(--fs-sm);color:var(--dim);font-weight:600">${t}</h3>`;
  const docker = d.dockerDf.length
    ? sub("Docker") + tbl([["Kind"], ["Count", "num"], ["In use", "num"], ["Size", "num"], ["Reclaimable", "num"]],
        d.dockerDf.map((x) => `<tr><td>${esc(x.type)}</td><td class="num">${x.count}</td><td class="num">${x.active}</td><td class="num">${size(x.size)}</td><td class="num">${x.reclaimable ? `<span class="badge warn">${size(x.reclaimable)}</span>` : `<span class="faint">0</span>`}</td></tr>`).join(""))
    : "";
  const sites = d.sites.length
    ? sub(`Sites <span class="faint mono">${esc(S.state.paths.sites)}</span>`) + tbl([["Site"], ["Files", "num"], ["Releases", "num"]],
        d.sites.map((x) => `<tr><td>${esc(x.name)}</td><td class="num">${size(x.size)}</td><td class="num">${x.releases} · ${size(x.releasesSize)}</td></tr>`).join(""))
    : "";
  const vols = d.volumes.filter((x) => x.size > 0).slice(0, 10);
  const volumes = vols.length
    ? sub("Largest volumes") + tbl([["Volume"], ["Size", "num"], ["Used by", "num"]],
        vols.map((x) => `<tr><td class="mono">${esc(x.name)}</td><td class="num">${size(x.size)}</td><td class="num">${x.links ? plural(x.links, "container") : `<span class="badge warn">nothing</span>`}</td></tr>`).join(""))
    : "";
  const lg = d.logs.filter((x) => x.size > 0).slice(0, 10);
  const logs = lg.length ? sub("Largest container logs") + tbl([["Container"], ["Size", "num"]], lg.map((x) => `<tr><td class="mono">${esc(x.container)}</td><td class="num">${size(x.size)}</td></tr>`).join("")) : "";
  const notes = [
    d.journald ? `systemd journal: ${size(d.journald)}` : "",
    d.docker ? "" : "No access to Docker: images, volumes and logs are not shown.",
    d.root ? "" : "Without root or passwordless sudo, root-owned folders and container logs may be missing.",
  ].filter(Boolean);
  return `<div class="card">${head((d.docker ? btn("Clean up…", () => pruneFlow(n), "sm", "lf prune: remove unused images and the build cache") : "") + btn("↻", () => loadDisk(n), "sm", "Analyze again").replace("<button", `<button aria-label="Analyze again"`))}${docker}${sites}${volumes}${logs}
    ${notes.length ? `<div class="body faint">${notes.map(esc).join("<br>")}</div>` : `<div style="height:8px"></div>`}</div>`;
}

function historyView(n) {
  const st = S.history[n] ?? { loading: true };
  if (st.loading && !st.data) return `<div class="loading"><span class="spin"></span> reading the journal…</div>`;
  if (st.error) return `<div class="note bad">${esc(st.error)}</div>`;
  const runs = st.data;
  if (!runs.length) return `<div class="card"><div class="body empty"><h2>Nothing yet</h2><p>Every change landfall makes on ${esc(n)} is logged here, with a way to undo it.</p></div></div>`;
  const s = sv(n);
  const undo = (argv) => run(["undo", ...argv, ...s, "-y"], { server: n });
  const total = runs.reduce((a, r) => a + r.pending, 0);
  const items = runs
    .map((r) => {
      const todo = r.steps.filter((x) => x.undo && !x.undone);
      const later = runs.filter((x) => x.n > r.n && x.pending);
      const undoRun = () =>
        dialog({
          title: `Undo #${r.n} ${r.cmd} on ${n}?`,
          text: [...todo.map((x) => `↺ ${x.what}`).reverse(), ...(later.length ? ["", `Later runs build on it and stay: ${later.map((x) => `#${x.n}`).join(", ")}`] : [])].join("\n"),
          ok: `Revert ${plural(todo.length, "change")}`,
          danger: true,
          onOk: () => undo([String(r.n)]),
        });
      const steps = r.steps
        .map((x, i) => {
          const [cls, ico] = x.reverts ? ["fixed", "↩"] : x.undone ? ["undone", "✓"] : x.undo ? ["", "↺"] : ["fixed", "·"];
          const one = x.undo && !x.undone
            ? btn("undo", () => confirmDlg({ title: `Undo step ${r.n}.${i + 1}?`, text: x.what, ok: "Undo it", danger: true, onOk: () => undo([`${r.n}.${i + 1}`]) }), "ghost sm")
            : "";
          return `<li class="${cls}"><span class="ico">${ico}</span><span class="what">${esc(x.what)}</span>${!x.undo && !x.reverts ? `<span class="faint">(not reversible)</span>` : ""}${x.undone ? `<span class="faint">(undone)</span>` : ""}${one}</li>`;
        })
        .join("");
      return `<div class="run">
        <div class="top"><b>#${r.n}</b><span class="cmd">${esc(r.cmd || "?")}</span><span class="dim">${esc(ago(r.time))}</span>
          <span class="faint mono hide-sm">${esc(r.actor)} · ${esc(r.id)}</span>
          <span class="actions">${r.pending ? btn(`Undo ${plural(r.pending, "change")}`, undoRun, "sm") : `<span class="faint">nothing to undo</span>`}</span></div>
        <ul class="steps">${steps}</ul></div>`;
    })
    .join("");
  return `
    <div class="card">
      <h2>Journal <span class="dim" style="font-weight:400">/opt/landfall/journal.log · newest first</span>
        <span class="actions">${total ? btn("Undo everything", () => confirmDlg({ title: `Undo everything landfall did on ${n}?`, text: `${plural(total, "change")}, newest first. Sites, Traefik, the deploy user and landfall's firewall rules go away.`, ok: "Revert everything", danger: true, typeToConfirm: n, onOk: () => undo(["--all"]) }), "sm danger") : ""}</span></h2>
      ${items}
    </div>`;
}

// ---- top level -----------------------------------------------------------

function render() {
  if (!S.state) return;
  // Every render re-registers the buttons it draws (dialogs wire their own buttons).
  handlers = new Map();
  const scroll = $("#main").scrollTop;
  // innerHTML drops the focused button: find its redrawn twin by its data-f key.
  const f = document.activeElement?.dataset?.f;
  // So is what someone was typing into the add-rule form.
  const form = $("#addrule"), typed = form && [...form.elements].filter((el) => el.name).map((el) => [el.name, el.value]);
  const typing = form?.contains(document.activeElement) && document.activeElement.name;
  renderHeader();
  renderNav();
  renderMain();
  renderJob();
  $("#main").scrollTop = scroll;
  const again = typed && $("#addrule");
  if (again) {
    for (const [k, v] of typed) again.elements[k].value = v;
    if (typing) again.elements[typing].focus({ preventScroll: true });
  }
  if (f && !document.activeElement?.closest?.("#dlg, #menu")) [...document.querySelectorAll("[data-f]")].find((el) => el.dataset.f === f)?.focus({ preventScroll: true });
  document.title = S.sel ? `${S.sel} · ${S.tab} · landfall` : "landfall";
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && menuEl) return closeMenu();
  // 1-9: the open server's sections.
  const sec = S.sel && sections(S.sel)[Number(e.key) - 1];
  if (sec && S.sel && !e.metaKey && !e.ctrlKey && !e.altKey && !$("#dlg").open && !e.target.closest?.("input, textarea, select")) return go(S.sel, sec[0]);
  if (e.key === "Escape" && !$("#dlg").open && S.job && !e.target.closest?.("input, textarea, select")) {
    S.job = null;
    render();
  }
});

$("#filter").addEventListener("input", (e) => {
  S.filter = e.target.value.trim();
  renderNav();
});
$("#add-server").onclick = () => addServer();
// Servers go up and down: check again each minute while the page is visible.
setInterval(() => document.hidden || loadReach(), 60_000);
// Sites answer or not: check their domains again each minute while their tab is open.
setInterval(() => {
  const n = S.sel;
  if (document.hidden || !n || S.tab !== "sites") return;
  ensureDns(n, S.overview[n]?.data, true);
}, 60_000);
// Live stats: a new sample every 5s while the tab is open, unless the last one is still running.
setInterval(() => {
  const n = S.sel;
  if (document.hidden || !n || S.tab !== "stats" || S.stats[n]?.loading || S.overview[n]?.error) return;
  load(n, "stats", true);
}, 5_000);

(async () => {
  try {
    await refreshState();
    loadReach();
    // Jobs started before a reload keep running on the server: list them, and show one still running.
    const old = [];
    for (const info of S.state.jobs.slice().reverse()) {
      const j = { info, lines: [], actions: [] };
      S.jobs.set(info.id, j);
      if (info.code === undefined) stream(j);
      else old.push(j);
    }
    S.job = S.state.jobs.find((j) => j.code === undefined)?.id ?? null;
    route();
    // Finished jobs' output only matters once someone opens them: fetch it after the page is up.
    for (const j of old) {
      http(`/api/jobs/${j.info.id}`).then((full) => {
        j.lines = full.lines;
        if (S.job === j.info.id) render();
      }, () => {});
    }
  } catch (e) {
    $("#main").innerHTML = `<div class="empty"><h2>lf ui</h2><p>${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
