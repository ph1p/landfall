name: CI

on:
  pull_request:
  workflow_dispatch:
  # Release runs these checks on every push to main before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # packageManager selects pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: cli
          path: dist/
          if-no-files-found: error

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  runtime-floor:
    name: Runtime floor (Node 22.4)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # tsdown leaves production dependencies external. Install on a supported toolchain,
      # then switch only the artifact execution to the advertised runtime floor.
      - run: pnpm install --prod --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: cli
          path: dist/
      - uses: actions/setup-node@v7
        with:
          node-version: 22.4.0
      - env:
          LANDFALL_CONFIG_DIR: ${{ runner.temp }}/landfall-config
          LANDFALL_SSH_CONFIG: ${{ runner.temp }}/landfall-ssh
        run: |
          node --version
          node dist/cli.mjs --version
          node dist/cli.mjs --help
          test -f dist/ui/index.html

  integration:
    name: End to end
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: E2E_ONLY="static secrets ui" pnpm e2e
