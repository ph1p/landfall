name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0 # packageManager selects pnpm
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm build
      - uses: actions/upload-artifact@v4.6.2
        if: matrix.node == 24
        with:
          name: cli
          path: dist/
          if-no-files-found: error

  runtime-floor:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # tsdown leaves production dependencies external. Install on a supported toolchain,
      # then switch only the artifact execution to the advertised runtime floor.
      - run: pnpm install --prod --frozen-lockfile
      - uses: actions/download-artifact@v4.3.0
        with:
          name: cli
          path: dist/
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.4.0
      - env:
          LANDFALL_CONFIG_DIR: ${{ runner.temp }}/landfall-config
          LANDFALL_SSH_CONFIG: ${{ runner.temp }}/landfall-ssh
        run: |
          node --version
          node dist/cli.mjs --version
          node dist/cli.mjs --help
          test -f dist/ui/index.html

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: E2E_ONLY="static secrets ui" pnpm e2e
