name: Release

# Every push to main runs CI, then semantic-release: feat, fix, perf, refactor and revert commits publish a new npm
# version, tag it, write a GitHub release and commit the version back to package.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Semantic Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tag, release commit, GitHub release
      issues: write # comment on the issues a release closes
      pull-requests: write
      id-token: write # npm trusted publishing
    outputs:
      published: ${{ steps.semantic.outputs.published }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: semantic
        run: pnpm release
        # npm publishes through trusted publishing (OIDC, id-token above): npmjs.com → landfall → Settings →
        # Trusted publishing must name ph1p/landfall, workflow release.yml, no environment. No NPM_TOKEN.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
